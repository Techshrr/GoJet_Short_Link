services:
  redirect-engine:
    build: .
    environment:
      REDIS_ADDRESS: redis:6379
      VISITOR_HASH_KEY: ${VISITOR_HASH_KEY:?Set VISITOR_HASH_KEY in .env}
    ports: ["8080:8080"]
    depends_on:
      redis:
        condition: service_healthy
  analytics-worker:
    build:
      context: .
      dockerfile: services/analytics-worker/Dockerfile
    environment:
      REDIS_ADDRESS: redis:6379
      MYSQL_DSN: gojet:gojet@tcp(mysql:3306)/gojet?parseTime=true&charset=utf8mb4
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 10
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gojet
      MYSQL_USER: gojet
      MYSQL_PASSWORD: gojet
      MYSQL_ROOT_PASSWORD: local-root-password
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plocal-root-password"]
      interval: 3s
      timeout: 2s
      retries: 30
volumes:
  redis-data:
  mysql-data:
