services:
  logreceiver:
    build:
      context: .
      dockerfile: services/logreceiver/Dockerfile
    environment:
      MYSQL_DSN: gojet:gojet@tcp(mysql:3306)/gojet?parseTime=true&charset=utf8mb4
      LOG_INGEST_TOKEN: ${LOG_INGEST_TOKEN:-change-this-log-ingest-token}
    depends_on:
      mysql:
        condition: service_healthy
    ports: ["8092:8092"]
  redirectengine:
    build: .
    environment:
      REDIS_ADDRESS: redis:6379
      VISITOR_HASH_KEY: ${VISITOR_HASH_KEY:?Set VISITOR_HASH_KEY in .env}
      QR_TRACKING_KEY: ${QR_TRACKING_KEY:?Set QR_TRACKING_KEY in .env}
      LOG_WEBHOOK_URL: ${LOG_WEBHOOK_URL:-http://logreceiver:8092/v1/logs}
      LOG_WEBHOOK_TOKEN: ${LOG_WEBHOOK_TOKEN:?LOG_WEBHOOK_TOKEN is required}
    ports: ["8080:8080"]
    depends_on:
      redis:
        condition: service_healthy
  analyticsworker:
    build:
      context: .
      dockerfile: services/analyticsworker/Dockerfile
    environment:
      REDIS_ADDRESS: redis:6379
      MYSQL_DSN: gojet:gojet@tcp(mysql:3306)/gojet?parseTime=true&charset=utf8mb4
      LOG_WEBHOOK_URL: ${LOG_WEBHOOK_URL:-http://logreceiver:8092/v1/logs}
      LOG_WEBHOOK_TOKEN: ${LOG_WEBHOOK_TOKEN:?LOG_WEBHOOK_TOKEN is required}
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
  analyticsreconciler:
    build:
      context: .
      dockerfile: services/analyticsreconciler/Dockerfile
    environment:
      REDIS_ADDRESS: redis:6379
      MYSQL_DSN: gojet:gojet@tcp(mysql:3306)/gojet?parseTime=true&charset=utf8mb4
      ANALYTICS_RECONCILE_BATCH: ${ANALYTICS_RECONCILE_BATCH:-500}
      ANALYTICS_RECONCILE_INTERVAL_SECONDS: ${ANALYTICS_RECONCILE_INTERVAL_SECONDS:-60}
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
  platformapi:
    build:
      context: .
      dockerfile: services/platformapi/Dockerfile
    environment:
      MYSQL_DSN: gojet:gojet@tcp(mysql:3306)/gojet?parseTime=true&charset=utf8mb4
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?Set SETTINGS_ENCRYPTION_KEY in .env}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:?Set ADMIN_BOOTSTRAP_EMAIL in .env}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:?Set ADMIN_BOOTSTRAP_PASSWORD in .env}
      REDIS_ADDRESS: redis:6379
      ANALYTICS_GROUP: ${ANALYTICS_GROUP:-gojet-mysql}
      UPLOAD_STORAGE_PATH: /data/uploads
      FILE_STORAGE_PATH: /data/files
      FILE_STORAGE_DRIVER: ${FILE_STORAGE_DRIVER:-filesystem}
      S3_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-gojet-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-this-local-secret}
      S3_BUCKET: ${S3_BUCKET:-gojet-files}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SECURE: ${S3_SECURE:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      QR_TRACKING_KEY: ${QR_TRACKING_KEY:?Set QR_TRACKING_KEY in .env}
      LOG_WEBHOOK_URL: ${LOG_WEBHOOK_URL:-http://logreceiver:8092/v1/logs}
      LOG_WEBHOOK_TOKEN: ${LOG_WEBHOOK_TOKEN:?LOG_WEBHOOK_TOKEN is required}
    volumes:
      - uploads:/data/uploads
      - files:/data/files
    ports: ["8090:8090"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
  mailworker:
    build:
      context: .
      dockerfile: services/platformapi/Dockerfile
    entrypoint: ["/mailworker"]
    environment:
      MYSQL_DSN: gojet:gojet@tcp(mysql:3306)/gojet?parseTime=true&charset=utf8mb4
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?Set SETTINGS_ENCRYPTION_KEY in .env}
      LOG_WEBHOOK_URL: ${LOG_WEBHOOK_URL:-http://logreceiver:8092/v1/logs}
      LOG_WEBHOOK_TOKEN: ${LOG_WEBHOOK_TOKEN:?LOG_WEBHOOK_TOKEN is required}
    depends_on:
      mysql:
        condition: service_healthy
  fileworker:
    build:
      context: .
      dockerfile: services/platformapi/Dockerfile
    entrypoint: ["/fileworker"]
    environment:
      MYSQL_DSN: gojet:gojet@tcp(mysql:3306)/gojet?parseTime=true&charset=utf8mb4
      FILE_STORAGE_PATH: /data/files
      CLAMAV_ADDRESS: clamav:3310
      LOG_WEBHOOK_URL: ${LOG_WEBHOOK_URL:-http://logreceiver:8092/v1/logs}
      LOG_WEBHOOK_TOKEN: ${LOG_WEBHOOK_TOKEN:?LOG_WEBHOOK_TOKEN is required}
      FILE_STORAGE_DRIVER: ${FILE_STORAGE_DRIVER:-filesystem}
      S3_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-gojet-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-this-local-secret}
      S3_BUCKET: ${S3_BUCKET:-gojet-files}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SECURE: ${S3_SECURE:-false}
    volumes:
      - files:/data/files
    depends_on:
      mysql:
        condition: service_healthy
      clamav:
        condition: service_started
  operationsmonitor:
    build:
      context: .
      dockerfile: services/platformapi/Dockerfile
    entrypoint: ["/operationsmonitor"]
    environment:
      MYSQL_DSN: gojet:gojet@tcp(mysql:3306)/gojet?parseTime=true&charset=utf8mb4
      ALERT_RECIPIENT: ${ALERT_RECIPIENT:-}
      OPERATIONS_MONITOR_INTERVAL_SECONDS: ${OPERATIONS_MONITOR_INTERVAL_SECONDS:-60}
      LOG_WEBHOOK_URL: ${LOG_WEBHOOK_URL:-http://logreceiver:8092/v1/logs}
      LOG_WEBHOOK_TOKEN: ${LOG_WEBHOOK_TOKEN:?LOG_WEBHOOK_TOKEN is required}
    depends_on:
      mysql:
        condition: service_healthy
  clamav:
    image: clamav/clamav:1.4.5
    volumes:
      - clamav-data:/var/lib/clamav
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-gojet-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-this-local-secret}
    volumes: ["minio-data:/data"]
    ports: ["9000:9000", "9001:9001"]
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command: ["until mc alias set gojet http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY; do sleep 2; done; mc mb --ignore-existing gojet/$$S3_BUCKET"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-gojet-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-this-local-secret}
      S3_BUCKET: ${S3_BUCKET:-gojet-files}
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 10
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gojet
      MYSQL_USER: gojet
      MYSQL_PASSWORD: gojet
      MYSQL_ROOT_PASSWORD: local-root-password
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plocal-root-password"]
      interval: 3s
      timeout: 2s
      retries: 30
volumes:
  redis-data:
  mysql-data:
  uploads:
  files:
  clamav-data:
  minio-data:
