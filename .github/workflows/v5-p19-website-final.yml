name: V5 P19 Website Final Gate
on:
  push:
    branches: ["rebuild/v5-*"]
    paths: ["frontend/**","docs/v5/**",".github/workflows/v5-p19-website-final.yml"]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Verify P01-P19 source contracts and independent builds
        working-directory: frontend
        run: pnpm check
      - name: Verify P18/P19 static artifacts
        working-directory: frontend
        run: |
          test -f apps/docs/dist/pagefind/pagefind.js
          test -f apps/site/dist/sitemap.xml
          test -f apps/site/dist/robots.txt
          test -f apps/site/dist/products/links/index.html
          test -f apps/site/dist/solutions/developers/index.html
          test -f apps/site/dist/legal/acceptable-use/index.html
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core-product
            command: pnpm test:shells && pnpm test:links && pnpm test:domains && pnpm test:analytics && pnpm test:qr
          - name: resources-workspace
            command: pnpm test:files && pnpm test:text && pnpm test:bio && pnpm test:workspace && pnpm test:billing && pnpm test:commerce
          - name: support-identity
            command: pnpm test:support && pnpm test:mail-ops && pnpm test:auth && pnpm test:account && pnpm test:oauth
          - name: governance-docs-site
            command: pnpm test:trust-safety && pnpm test:admin && pnpm test:docs && pnpm test:site-final
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser regression — ${{ matrix.name }}
        working-directory: frontend
        run: ${{ matrix.command }}
      - name: Upload P19 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-p19-${{ matrix.name }}-${{ github.sha }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
  close:
    if: always()
    needs: [contract,browser]
    runs-on: ubuntu-latest
    steps:
      - name: Publish exact-head P19 closure evidence
        uses: actions/github-script@v7
        env:
          CONTRACT_RESULT: ${{ needs.contract.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        with:
          script: |
            const branch=context.ref.replace('refs/heads/','');
            const ref=await github.rest.repos.getBranch({owner:context.repo.owner,repo:context.repo.repo,branch});
            if(ref.data.commit.sha!==context.sha){core.info(`Skip stale evidence: tested ${context.sha}, branch is ${ref.data.commit.sha}`);return;}
            const success=process.env.CONTRACT_RESULT==='success' && process.env.BROWSER_RESULT==='success';
            const marker='<!-- v5-p19-ci-evidence-v1 -->';
            const body=`${marker}\n### P19 Website Final exact-HEAD CI evidence\n- **Status:** ${success?'SUCCESS':'FAILURE'}\n- **Branch:** \`${branch}\`\n- **Exact HEAD / tested SHA:** \`${context.sha}\`\n- **Actions run:** https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n- **Run ID:** \`${context.runId}\`\n- **Contract job:** ${process.env.CONTRACT_RESULT}\n- **Browser matrix:** ${process.env.BROWSER_RESULT}\n- **Scope:** P01–P18 regression coverage + P19 Website Final 1440x900 / 1280x800 / 390x844 gate + static prerender + SEO/sitemap/robots.\n- **Invariants:** Hero is build-guarded against exact Workspace Links/QR/Analytics source; no fabricated dashboard; pricing remains server-owned; motion follows frozen durations and prefers-reduced-motion disables continuous effects.\n`;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:8,per_page:100});
            const existing=comments.find(c=>c.body?.includes(marker));
            if(existing)await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:8,body});
            if(!success)core.setFailed('P19 closure failed; see contract/browser results above.');
