name: V5 P11 Bio Gate

on:
  push:
    branches:
      - 'rebuild/v5-*'
    paths:
      - 'frontend/**'
      - 'app/resources/**'
      - 'services/platformapi/cmd/server/**'
      - 'services/platformapi/cmd/fileworker/**'
      - 'services/analyticsworker/**'
      - 'services/analyticsreconciler/**'
      - 'go.mod'
      - 'go.sum'
      - 'docs/v5/P11_BIO_CONTRACT.md'
      - 'docs/v5/CAPABILITY-MATRIX.md'
      - '.github/workflows/v5-p11-bio.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'app/resources/**'
      - 'services/platformapi/cmd/server/**'
      - 'services/platformapi/cmd/fileworker/**'
      - 'services/analyticsworker/**'
      - 'services/analyticsreconciler/**'
      - 'go.mod'
      - 'go.sum'
      - 'docs/v5/P11_BIO_CONTRACT.md'
      - 'docs/v5/CAPABILITY-MATRIX.md'
      - '.github/workflows/v5-p11-bio.yml'

concurrency:
  group: v5-p11-bio-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  bio:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: go.sum

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify no browser auth-token persistence
        run: |
          if grep -R -n --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.astro -E '(localStorage|sessionStorage)\.(setItem|getItem|removeItem)' apps packages; then
            echo 'V5 auth/session persistence must not use browser Web Storage.' >&2
            exit 1
          fi

      - name: Run P01-P11 contract, strict TypeScript and build gates
        run: pnpm check

      - name: Verify Bio is an independent dynamic route entry
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('apps/workspace/dist/.vite/manifest.json', 'utf8'));
          const entry = Object.values(manifest).find((item) => item && item.src === 'src/routes/BioPageV503.tsx');
          if (!entry || entry.isDynamicEntry !== true) throw new Error('BioPageV503.tsx is not a dynamic entry');
          NODE

      - name: Test P05-P11 Go backend, public Bio safety, fileworker and analytics runtime
        working-directory: .
        run: go test ./app/links ./app/domains ./app/resources ./services/platformapi/cmd/server ./services/platformapi/cmd/fileworker ./services/analyticsworker/... ./services/analyticsreconciler/...

      - name: Install Playwright Chromium without apt mirror dependency
        timeout-minutes: 12
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
        run: |
          set -euo pipefail
          pnpm exec playwright --version
          timeout -k 30s 10m pnpm exec playwright install chromium

      - name: Run P04-P11 fixed-viewport Browser Gate regressions
        run: |
          pnpm test:shells
          pnpm test:links
          pnpm test:domains
          pnpm test:analytics
          pnpm test:qr
          pnpm test:files
          pnpm test:text
          pnpm test:bio

      - name: Upload P11 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p11-bio-evidence-${{ github.sha }}
          path: frontend/test-results
          if-no-files-found: warn
          retention-days: 7

      - name: Persist P11 exact-head CI evidence to issue 8
        if: always() && github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          HEAD_BRANCH: ${{ github.ref_name }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          current_sha="$(git ls-remote origin "refs/heads/$HEAD_BRANCH" | awk '{print $1}' | head -n 1)"
          if [ -z "$current_sha" ] || [ "$current_sha" != "$HEAD_SHA" ]; then
            echo "Skipping stale P11 evidence for $HEAD_SHA; current branch HEAD is ${current_sha:-unknown}."
            exit 0
          fi
          marker='<!-- v5-p11-ci-evidence-v1 -->'
          if [ "$JOB_STATUS" = "success" ]; then state='✅ success'; else state="❌ $JOB_STATUS"; fi
          cat > /tmp/v5-p11-evidence.md <<EOF
          $marker
          ## P11 Bio — exact-head evidence v1

          - Status: **$state**
          - Branch: \`$HEAD_BRANCH\`
          - Tested SHA: \`$HEAD_SHA\`
          - Workflow run: $RUN_URL
          - Run ID: \`$RUN_ID\`
          - Scope: P01–P10 regression verifiers + P11 Bio contract + strict TS/build + Bio dynamic entry + Go resources/platform/public-Bio/fileworker/analytics tests + P04/P05/P06/P07/P08/P09/P10/P11 fixed-viewport browser gates

          This marker is written only when the tested SHA is still the exact current branch HEAD. P12 remains locked unless this P11 exact-head run is successful and the Link in Bio matrix row is DONE.
          EOF
          comment_id="$(gh api --paginate "repos/$REPO/issues/8/comments" --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1 || true)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" --raw-field body="$(cat /tmp/v5-p11-evidence.md)" >/dev/null
          else
            gh api --method POST "repos/$REPO/issues/8/comments" --raw-field body="$(cat /tmp/v5-p11-evidence.md)" >/dev/null
          fi
