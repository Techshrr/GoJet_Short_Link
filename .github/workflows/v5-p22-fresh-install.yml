name: V5 P22 Fresh Install Candidate

on:
  push:
    branches: ["rebuild/v5-*"]
    paths:
      - ".github/workflows/v5-p22-fresh-install.yml"
      - ".github/workflows/v5-p21-native-package.yml"
      - "install.sh"
      - "public/install/**"
      - "scripts/nativeinstallerapply.sh"
      - "scripts/installgeoip.sh"
      - "deploy/native/**"
      - "deploy/nginx/**"
      - "tests/integration/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: v5-p22-fresh-install-${{ github.ref }}
  cancel-in-progress: true

env:
  P22_HOST: p22.gojet.test
  P22_ROOT: /www/wwwroot/p22.gojet.test
  P22_DB: gojet_p22
  P22_DB_USER: gojet_p22
  P22_DB_PASSWORD: GoJetP22MySQLSecret2026
  P22_REDIS_PASSWORD: GoJetP22RedisSecret2026
  P22_ADMIN_EMAIL: owner@example.test
  P22_ADMIN_PASSWORD: OwnerPassword!2026

jobs:
  p21-exact-head:
    name: Require exact-head P21 success
    runs-on: ubuntu-latest
    timeout-minutes: 110
    outputs:
      run-id: ${{ steps.find.outputs.run_id }}
    steps:
      - id: find
        name: Wait for authoritative P21 artifact for this SHA
        uses: actions/github-script@v7
        with:
          script: |
            const workflow='v5-p21-native-package.yml';
            const tested=context.sha;
            const branch=context.ref.replace('refs/heads/','');
            for(let attempt=0;attempt<660;attempt++){
              const ref=await github.rest.repos.getBranch({owner:context.repo.owner,repo:context.repo.repo,branch});
              if(ref.data.commit.sha!==tested){
                core.setFailed(`P22 is stale: tested ${tested}, branch HEAD is ${ref.data.commit.sha}`);
                return;
              }
              const runs=await github.rest.actions.listWorkflowRuns({
                owner:context.repo.owner,repo:context.repo.repo,workflow_id:workflow,
                branch,per_page:50
              });
              const exact=runs.data.workflow_runs
                .filter(r=>r.head_sha===tested && r.event==='push')
                .sort((a,b)=>b.id-a.id)[0];
              if(exact){
                core.info(`P21 exact-head run ${exact.id}: ${exact.status}/${exact.conclusion}`);
                if(exact.status==='completed'){
                  if(exact.conclusion!=='success'){
                    core.setFailed(`P21 exact-head run ${exact.id} concluded ${exact.conclusion}`);
                    return;
                  }
                  const artifacts=await github.rest.actions.listWorkflowRunArtifacts({
                    owner:context.repo.owner,repo:context.repo.repo,run_id:exact.id,per_page:100
                  });
                  const expected=`gojet-v5-native-linux-amd64-${tested}`;
                  const matches=artifacts.data.artifacts.filter(a=>a.name===expected && !a.expired);
                  if(matches.length!==1){
                    core.setFailed(`Expected exactly one live P21 artifact ${expected}; found ${matches.length}`);
                    return;
                  }
                  core.setOutput('run_id',String(exact.id));
                  return;
                }
              }
              await new Promise(resolve=>setTimeout(resolve,10000));
            }
            core.setFailed(`No successful completed P21 push run/artifact found for exact HEAD ${tested}`);

  fresh-install:
    name: G12 Fresh Install + G13 Production Validation
    needs: p21-exact-head
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout acceptance harness only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install real Native production dependencies
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            nginx php8.3-cli php8.3-fpm php8.3-mysql mysql-server redis-server \
            clamav clamav-daemon clamav-freshclam zbar-tools poppler-utils \
            fonts-noto-cjk curl jq default-mysql-client openssl ca-certificates
          php -r 'exit(version_compare(PHP_VERSION,"8.3.0",">=")?0:1);'
          mysql --version | grep -E 'Distrib 8\.'
          redis-server --version
          nginx -v
          systemctl --version | head -1

      - name: Prepare MySQL 8 and authenticated Redis
        run: |
          set -euo pipefail
          sudo systemctl enable --now mysql
          for i in $(seq 1 60); do sudo mysqladmin ping --silent >/dev/null 2>&1 && break; sleep 1; test "$i" -lt 60; done
          sudo mysql <<SQL
          ALTER USER 'root'@'localhost' IDENTIFIED BY 'root';
          CREATE DATABASE IF NOT EXISTS ${P22_DB} CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE USER IF NOT EXISTS '${P22_DB_USER}'@'127.0.0.1' IDENTIFIED BY '${P22_DB_PASSWORD}';
          CREATE USER IF NOT EXISTS '${P22_DB_USER}'@'localhost' IDENTIFIED BY '${P22_DB_PASSWORD}';
          GRANT ALL PRIVILEGES ON ${P22_DB}.* TO '${P22_DB_USER}'@'127.0.0.1';
          GRANT ALL PRIVILEGES ON ${P22_DB}.* TO '${P22_DB_USER}'@'localhost';
          FLUSH PRIVILEGES;
          SQL
          MYSQL_PWD="$P22_DB_PASSWORD" mysql -h127.0.0.1 -P3306 -u"$P22_DB_USER" "$P22_DB" -e 'SELECT VERSION()' | grep '^8\.'
          sudo python3 - <<'PY'
          from pathlib import Path
          p=Path('/etc/redis/redis.conf')
          text=p.read_text()
          lines=text.splitlines()
          out=[]
          replaced=False
          for line in lines:
              if line.lstrip().startswith('requirepass '):
                  out.append('requirepass GoJetP22RedisSecret2026')
                  replaced=True
              else:
                  out.append(line)
          if not replaced:
              out.append('requirepass GoJetP22RedisSecret2026')
          p.write_text('\n'.join(out)+'\n')
          PY
          sudo systemctl enable --now redis-server
          sudo systemctl restart redis-server
          redis-cli -h127.0.0.1 -p6379 -a "$P22_REDIS_PASSWORD" --no-auth-warning ping | grep -qx PONG
          if redis-cli -h127.0.0.1 -p6379 ping 2>/dev/null | grep -qx PONG; then
            echo 'Redis accepted unauthenticated PING' >&2
            exit 1
          fi

      - name: Prepare real ClamAV daemon and signatures
        run: |
          set -euo pipefail
          sudo systemctl stop clamav-freshclam.service 2>/dev/null || true
          if ! test -s /var/lib/clamav/main.cvd && ! test -s /var/lib/clamav/main.cld; then
            sudo freshclam --stdout
          fi
          sudo systemctl enable clamav-daemon.service
          sudo systemctl restart clamav-daemon.service
          for i in $(seq 1 90); do
            if test -S /run/clamav/clamd.ctl && sudo systemctl is-active --quiet clamav-daemon.service; then break; fi
            sleep 1
            test "$i" -lt 90
          done
          test -S /run/clamav/clamd.ctl
          sudo systemctl is-active --quiet clamav-daemon.service

      - name: Build BT/aaPanel production filesystem contract with real Nginx and PHP-FPM
        run: |
          set -euo pipefail
          sudo install -d -m 0755 \
            /www/server/panel/vhost/nginx \
            /www/server/panel/vhost/rewrite \
            /www/server/nginx/sbin \
            /www/server/php/83/bin \
            /www/server/mysql/bin \
            /www/server/redis/src \
            "$P22_ROOT"
          sudo ln -sfn /usr/sbin/nginx /www/server/nginx/sbin/nginx
          sudo ln -sfn "$(command -v php)" /www/server/php/83/bin/php
          sudo ln -sfn "$(command -v mysql)" /www/server/mysql/bin/mysql
          sudo ln -sfn "$(command -v redis-cli)" /www/server/redis/src/redis-cli
          sudo systemctl enable --now php8.3-fpm
          sudo openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /etc/ssl/private/gojet-p22.key \
            -out /etc/ssl/certs/gojet-p22.crt \
            -subj "/CN=$P22_HOST" \
            -addext "subjectAltName=DNS:$P22_HOST"
          sudo touch "/www/server/panel/vhost/rewrite/$P22_HOST.conf"
          sudo tee "/www/server/panel/vhost/nginx/$P22_HOST.conf" >/dev/null <<NGINX
          server {
              listen 443 ssl;
              server_name $P22_HOST;
              root $P22_ROOT/public;
              index index.html index.php;
              ssl_certificate /etc/ssl/certs/gojet-p22.crt;
              ssl_certificate_key /etc/ssl/private/gojet-p22.key;

              include /www/server/panel/vhost/rewrite/$P22_HOST.conf;

              location ~ \.php$ {
                  include fastcgi_params;
                  fastcgi_param SCRIPT_FILENAME \$document_root\$fastcgi_script_name;
                  fastcgi_param HTTPS on;
                  fastcgi_pass unix:/run/php/php8.3-fpm.sock;
              }
          }
          NGINX
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo ln -sfn "/www/server/panel/vhost/nginx/$P22_HOST.conf" "/etc/nginx/sites-enabled/$P22_HOST.conf"
          sudo nginx -t
          sudo systemctl enable --now nginx

      - name: Download immutable exact-head P21 Native artifact
        uses: actions/download-artifact@v4
        with:
          name: gojet-v5-native-linux-amd64-${{ github.sha }}
          path: /tmp/gojet-p21
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.p21-exact-head.outputs.run-id }}

      - name: Verify P21 provenance and unpack fresh candidate
        run: |
          set -euo pipefail
          cd /tmp/gojet-p21
          test -f gojet-v5-native-linux-amd64.tar.gz
          test -f gojet-v5-native-linux-amd64.tar.gz.sha256
          sha256sum -c gojet-v5-native-linux-amd64.tar.gz.sha256
          python3 - <<'PY'
          import json, os
          p='/tmp/gojet-p21/VERSION-MANIFEST.json'
          d=json.load(open(p))
          assert d['schema']=='gojet-v5-native-version-manifest-v1'
          assert d['phase']=='P21' and d['gate']=='G11'
          assert d['git_sha']==os.environ['GITHUB_SHA']
          assert d['platform']['runtime']=='go+systemd'
          assert d['platform']['web']=='nginx+php-8.3'
          assert d['platform']['database']=='mysql-8.x'
          assert d['platform']['cache']=='redis-authenticated'
          assert d['fresh_install_claimed'] is False
          assert len(d['binaries'])==8
          PY
          sudo rm -rf "$P22_ROOT"
          sudo install -d -m 0755 "$P22_ROOT"
          sudo tar -xzf gojet-v5-native-linux-amd64.tar.gz -C "$P22_ROOT" --strip-components=1
          sudo test -x "$P22_ROOT/install.sh"
          sudo test -f "$P22_ROOT/public/install/index.php"
          sudo test "$(find "$P22_ROOT/bin" -maxdepth 1 -type f | wc -l)" -eq 8
          sudo test ! -e "$P22_ROOT/node_modules"
          sudo test ! -e "$P22_ROOT/compose.yaml"
          sudo test ! -e "$P22_ROOT/Dockerfile"

      - name: G12 root bootstrap through packaged install.sh
        run: |
          set -euo pipefail
          sudo bash "$P22_ROOT/install.sh"
          sudo test -f "$P22_ROOT/storage/installer/bootstrap.ready"
          sudo test -f "$P22_ROOT/storage/installer/clamav.ready"
          sudo systemctl is-active --quiet gojetinstaller.path
          sudo grep -Fq 'location = /install { return 302 /install/; }' "/www/server/panel/vhost/rewrite/$P22_HOST.conf"
          sudo grep -Fq 'location = /install/ { rewrite ^ /install/index.php last; }' "/www/server/panel/vhost/rewrite/$P22_HOST.conf"
          curl --noproxy '*' -kfsS --resolve "$P22_HOST:443:127.0.0.1" "https://$P22_HOST/install/" | grep -Fq 'GoJet 安装向导'

      - name: G12 complete real four-step HTTPS Web Installer
        run: |
          set -euo pipefail
          BASE="https://$P22_HOST"
          RESOLVE=(--noproxy '*' -k --resolve "$P22_HOST:443:127.0.0.1")
          COOKIE=/tmp/gojet-p22-cookie.txt
          PAGE=/tmp/gojet-p22-install.html
          get_page(){ curl "${RESOLVE[@]}" -fsS -c "$COOKIE" -b "$COOKIE" "$BASE/install/" -o "$PAGE"; }
          csrf(){
            python3 - "$PAGE" <<'PY'
          import html,re,sys
          text=open(sys.argv[1],encoding='utf-8').read()
          m=re.search(r'name="csrf"\s+value="([^"]+)"',text)
          if not m: raise SystemExit('installer CSRF token missing')
          print(html.unescape(m.group(1)))
          PY
          }
          post(){
            curl "${RESOLVE[@]}" -fsS -c "$COOKIE" -b "$COOKIE" \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              --data "$1" "$BASE/install/" -o "$PAGE"
          }

          get_page
          TOKEN=$(csrf)
          post "csrf=$TOKEN&action=environment"
          grep -Fq 'name="mysql_database"' "$PAGE"

          TOKEN=$(csrf)
          post "csrf=$TOKEN&action=connections&mysql_port=3306&mysql_database=$P22_DB&mysql_user=$P22_DB_USER&mysql_password=$P22_DB_PASSWORD&redis_port=6379&redis_password=$P22_REDIS_PASSWORD"
          grep -Fq 'name="public_url"' "$PAGE"

          TOKEN=$(csrf)
          post "csrf=$TOKEN&action=site&public_url=https%3A%2F%2F$P22_HOST&admin_email=owner%40example.test&admin_password=OwnerPassword%212026&admin_password_confirm=OwnerPassword%212026&alert_email=owner%40example.test"
          grep -Fq 'value="install"' "$PAGE"

          TOKEN=$(csrf)
          post "csrf=$TOKEN&action=install"
          grep -Fq 'data-install-progress' "$PAGE"

          for i in $(seq 1 120); do
            if sudo test -f "$P22_ROOT/deploy/native/installed.lock"; then break; fi
            if sudo test -f "$P22_ROOT/storage/installer/status.json"; then
              sudo cat "$P22_ROOT/storage/installer/status.json"
              if sudo grep -q '"result":"failed"' "$P22_ROOT/storage/installer/status.json"; then
                sudo journalctl -u gojetinstaller.service --no-pager -n 250
                exit 1
              fi
            fi
            sleep 2
            test "$i" -lt 120
          done
          sudo test -f "$P22_ROOT/deploy/native/installed.lock"
          sudo grep -Fq 'mysql_schema=' "$P22_ROOT/deploy/native/installed.lock"
          sudo grep -Fq 'clamav=unix:///run/clamav/clamd.ctl' "$P22_ROOT/deploy/native/installed.lock"
          code=$(curl "${RESOLVE[@]}" -sS -o /tmp/install-after.txt -w '%{http_code}' "$BASE/install/")
          test "$code" = 404
          if sudo systemctl is-enabled --quiet gojetinstaller.path; then
            echo 'installer path should be disabled after completion' >&2
            exit 1
          fi

      - name: G12 assert installed Native topology
        run: |
          set -euo pipefail
          services=(logreceiver redirectengine platformapi analyticsworker analyticsreconciler mailworker fileworker operationsmonitor)
          for service in "${services[@]}"; do
            sudo systemctl is-enabled --quiet "gojet@$service.service"
            sudo systemctl is-active --quiet "gojet@$service.service"
          done
          sudo nginx -t
          curl -fsS http://127.0.0.1:18080/health | grep -Fq '"status":"ok"'
          curl -fsS http://127.0.0.1:18090/health | grep -Fq '"status":"ok"'
          curl -fsS http://127.0.0.1:18092/health | grep -Fq '"status":"ok"'
          MYSQL_PWD="$P22_DB_PASSWORD" mysql -h127.0.0.1 -P3306 -u"$P22_DB_USER" "$P22_DB" -N -B -e \
            "SELECT COUNT(*) FROM schema_migrations;" | grep -Eq '^[1-9][0-9]*$'
          redis-cli -h127.0.0.1 -p6379 -a "$P22_REDIS_PASSWORD" --no-auth-warning ping | grep -qx PONG
          sudo test -S /run/clamav/clamd.ctl

      - name: G13 restart Nginx, all 8 services, MySQL and Redis reconnect
        run: |
          set -euo pipefail
          services=(logreceiver redirectengine platformapi analyticsworker analyticsreconciler mailworker fileworker operationsmonitor)
          sudo systemctl restart nginx
          for service in "${services[@]}"; do sudo systemctl restart "gojet@$service.service"; done
          for service in "${services[@]}"; do sudo systemctl is-active --quiet "gojet@$service.service"; done
          sudo systemctl restart mysql
          sudo systemctl restart redis-server
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18090/health >/dev/null 2>&1 \
              && curl -fsS http://127.0.0.1:18080/health >/dev/null 2>&1 \
              && redis-cli -h127.0.0.1 -p6379 -a "$P22_REDIS_PASSWORD" --no-auth-warning ping 2>/dev/null | grep -qx PONG \
              && MYSQL_PWD="$P22_DB_PASSWORD" mysql -h127.0.0.1 -P3306 -u"$P22_DB_USER" "$P22_DB" -e 'SELECT 1' >/dev/null 2>&1; then
              break
            fi
            sleep 2
            test "$i" -lt 60
          done
          for service in "${services[@]}"; do sudo systemctl is-active --quiet "gojet@$service.service"; done
          curl --noproxy '*' -kfsS --resolve "$P22_HOST:443:127.0.0.1" "https://$P22_HOST/" | grep -Fq '<!doctype html>'

      - name: G13 real ClamAV EICAR plus real safe file upload/download
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: ${{ env.P22_DB }}
        run: |
          set -euo pipefail
          API=http://127.0.0.1:18090
          mysqlq(){ MYSQL_PWD=root mysql -h127.0.0.1 -P3306 -uroot "$P22_DB" -N -B -e "$1"; }
          req(){ local m=$1 p=$2 b=${3:-} t=${4:-}; local a=(-sS -X "$m" -H 'Content-Type: application/json' -w $'\n%{http_code}'); test -z "$t" || a+=(-H "Authorization: Bearer $t"); test -z "$b" || a+=(--data "$b"); curl "${a[@]}" "$API$p"; }
          body(){ printf '%s\n' "$1" | sed '$d'; }
          status(){ printf '%s\n' "$1" | tail -n1; }
          suffix="$(date +%s)-$RANDOM"
          raw=$(req POST /api/auth/register "{\"email\":\"p22-file-$suffix@example.test\",\"display_name\":\"P22 File\",\"password\":\"P22FilePassword!2026\"}")
          test "$(status "$raw")" = 201
          token=$(body "$raw" | python3 -c 'import json,sys;print(json.load(sys.stdin)["token"])')
          spaces=$(req GET /api/workspaces '' "$token"); test "$(status "$spaces")" = 200
          wid=$(body "$spaces" | python3 -c 'import json,sys;print(json.load(sys.stdin)["data"][0]["id"])')

          printf '%s' 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' >/tmp/eicar.com
          raw=$(curl -sS -H "Authorization: Bearer $token" -F "file=@/tmp/eicar.com;type=application/octet-stream" -w $'\n%{http_code}' "$API/api/workspaces/$wid/fileshares")
          test "$(status "$raw")" = 202
          eicar_id=$(body "$raw" | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
          for i in $(seq 1 45); do
            state=$(mysqlq "SELECT CONCAT(scan_status,'|',status,'|',COALESCE(scan_result,'')) FROM file_shares WHERE id=$eicar_id;")
            echo "EICAR state=$state"
            if printf '%s' "$state" | grep -Eqi 'infect|virus|malware|quarant'; then break; fi
            sleep 1
            test "$i" -lt 45
          done
          printf '%s' "$state" | grep -Eqi 'infect|virus|malware|quarant'
          storage=$(mysqlq "SELECT storage_name FROM file_shares WHERE id=$eicar_id;")
          sudo test -f "$P22_ROOT/deploy/data/files/quarantine/$storage"
          sudo test ! -f "$P22_ROOT/deploy/data/files/clean/$storage"

          printf 'GoJet P22 safe file %s\n' "$suffix" >/tmp/p22-safe.txt
          raw=$(curl -sS -H "Authorization: Bearer $token" -F "file=@/tmp/p22-safe.txt;type=text/plain" -w $'\n%{http_code}' "$API/api/workspaces/$wid/fileshares")
          test "$(status "$raw")" = 202
          safe_id=$(body "$raw" | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
          safe_slug=$(body "$raw" | python3 -c 'import json,sys;print(json.load(sys.stdin)["slug"])')
          for i in $(seq 1 45); do
            state=$(mysqlq "SELECT CONCAT(scan_status,'|',status) FROM file_shares WHERE id=$safe_id;")
            echo "safe state=$state"
            test "$state" = 'clean|active' && break
            sleep 1
            test "$i" -lt 45
          done
          test "$state" = 'clean|active'
          curl -fsS -H 'X-GoJet-Public-File-Page: 1' "$API/api/public/files/$safe_slug?download=1" -o /tmp/p22-safe-download.txt
          cmp /tmp/p22-safe.txt /tmp/p22-safe-download.txt

      - name: G13 QR, PDF, Mail, OAuth adapters and real signed payment channel
        env:
          GOJET_TEST_BASE: http://127.0.0.1:18090
          GOJET_PUBLIC_BASE: http://127.0.0.1:18080
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: ${{ env.P22_DB }}
          REDIS_ADDRESS: 127.0.0.1:6379
          REDIS_PASSWORD: ${{ env.P22_REDIS_PASSWORD }}
          UPLOAD_STORAGE_PATH: ${{ env.P22_ROOT }}/deploy/data/uploads
          BRAND_ASSET_PATH: ${{ env.P22_ROOT }}/deploy/data/brand
          GENERATED_QR_STORAGE_PATH: ${{ env.P22_ROOT }}/deploy/data/generated/qr
          FILE_STORAGE_PATH: ${{ env.P22_ROOT }}/deploy/data/files
        run: |
          set -euo pipefail
          mkdir -p /tmp/gojet
          sudo grep '^SETTINGS_ENCRYPTION_KEY=' "$P22_ROOT/deploy/native/gojet.env" | sudo tee /tmp/gojet/testenv >/dev/null
          sudo cp "$P22_ROOT/bin/mailworker" /tmp/gojet/mailworker
          sudo chown -R "$USER":"$(id -gn)" /tmp/gojet
          chmod 0600 /tmp/gojet/testenv
          chmod 0755 /tmp/gojet/mailworker
          bash tests/integration/qrreale2e.sh
          bash tests/integration/invoicepdfrender.sh
          bash tests/integration/maillifecyclesmtp.sh
          bash tests/integration/socialprovideradapters.sh
          bash tests/integration/epaycallback.sh

      - name: G13 Turnstile production Siteverify with Cloudflare test secret
        run: |
          set -euo pipefail
          API=http://127.0.0.1:18090
          req(){ local m=$1 p=$2 b=${3:-} t=${4:-}; local a=(-sS -X "$m" -H 'Content-Type: application/json' -w $'\n%{http_code}'); test -z "$t" || a+=(-H "Authorization: Bearer $t"); test -z "$b" || a+=(--data "$b"); curl "${a[@]}" "$API$p"; }
          body(){ printf '%s\n' "$1" | sed '$d'; }
          status(){ printf '%s\n' "$1" | tail -n1; }
          admin=$(req POST /api/admin/auth/login "{\"email\":\"$P22_ADMIN_EMAIL\",\"password\":\"$P22_ADMIN_PASSWORD\"}")
          test "$(status "$admin")" = 200
          token=$(body "$admin" | python3 -c 'import json,sys;print(json.load(sys.stdin)["token"])')
          payload='{"turnstile.enabled":true,"turnstile.registration":true,"turnstile.login":true,"turnstile.site_key":"1x00000000000000000000AA","turnstile.secret":"1x0000000000000000000000000000000AA","turnstile.fail_open":false}'
          saved=$(req PUT /api/admin/bot-protection "$payload" "$token")
          test "$(status "$saved")" = 200
          suffix="$(date +%s)-$RANDOM"
          registered=$(req POST /api/auth/register "{\"email\":\"turnstile-p22-$suffix@example.test\",\"display_name\":\"Turnstile P22\",\"password\":\"TurnstileP22!2026\",\"turnstile_token\":\"XXXX.DUMMY.TOKEN.XXXX\"}")
          test "$(status "$registered")" = 201
          public=$(req GET /api/public/turnstile)
          test "$(status "$public")" = 200
          body "$public" | grep -Fq '"enabled":true'
          body "$public" | grep -Fq '1x00000000000000000000AA'

      - name: Write immutable P22 evidence
        run: |
          set -euo pipefail
          {
            echo "phase=P22"
            echo "gate_g12=success"
            echo "gate_g13=success"
            echo "tested_sha=$GITHUB_SHA"
            echo "p21_run_id=${{ needs.p21-exact-head.outputs.run-id }}"
            echo "p22_run_id=$GITHUB_RUN_ID"
            echo "artifact=gojet-v5-native-linux-amd64-$GITHUB_SHA"
            echo "native_topology=nginx+php8.3+mysql8+authenticated-redis+systemd+clamav"
            echo "validation=8-service-restart,nginx-restart,mysql-redis-reconnect,eicar,qr,file,pdf,mail,oauth,turnstile,epay"
          } | tee /tmp/GOJET-V5-P22-EVIDENCE.txt

      - name: Upload P22 evidence
        uses: actions/upload-artifact@v4
        with:
          name: gojet-v5-p22-evidence-${{ github.sha }}
          path: /tmp/GOJET-V5-P22-EVIDENCE.txt
          if-no-files-found: error
          retention-days: 30

      - name: Diagnostics
        if: failure()
        run: |
          sudo journalctl -u gojetinstaller.service --no-pager -n 300 2>/dev/null || true
          for s in logreceiver redirectengine platformapi analyticsworker analyticsreconciler mailworker fileworker operationsmonitor; do
            echo "===== gojet@$s ====="
            sudo journalctl -u "gojet@$s.service" --no-pager -n 120 2>/dev/null || true
          done
          echo '===== nginx ====='
          sudo nginx -T 2>/dev/null || true
          echo '===== installer status ====='
          sudo cat "$P22_ROOT/storage/installer/status.json" 2>/dev/null || true

  close:
    name: P22 exact-head closure
    if: always()
    needs: [p21-exact-head, fresh-install]
    runs-on: ubuntu-latest
    steps:
      - name: Publish P22 evidence and close Issue #8 stage state
        uses: actions/github-script@v7
        env:
          P21_RESULT: ${{ needs.p21-exact-head.result }}
          P22_RESULT: ${{ needs.fresh-install.result }}
          P21_RUN_ID: ${{ needs.p21-exact-head.outputs.run-id }}
        with:
          script: |
            const branch=context.ref.replace('refs/heads/','');
            const ref=await github.rest.repos.getBranch({owner:context.repo.owner,repo:context.repo.repo,branch});
            if(ref.data.commit.sha!==context.sha){
              core.info(`Skip stale P22 evidence: tested ${context.sha}, branch is ${ref.data.commit.sha}`);
              return;
            }
            const success=process.env.P21_RESULT==='success' && process.env.P22_RESULT==='success';
            const marker='<!-- v5-p22-ci-evidence-v1 -->';
            const evidence=`${marker}
            ## P22 Fresh Install Candidate — exact-head G12/G13 evidence v1

            - Status: **${success?'✅ success':'❌ failure'}**
            - Branch: \`${branch}\`
            - Tested SHA: \`${context.sha}\`
            - Workflow run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
            - Run ID: \`${context.runId}\`
            - Exact-head P21 prerequisite: **${process.env.P21_RESULT}** (run \`${process.env.P21_RUN_ID||'n/a'}\`)
            - G12 Fresh Install: **${process.env.P22_RESULT}**
            - G13 Production Validation: **${process.env.P22_RESULT}**
            - Consumed artifact: \`gojet-v5-native-linux-amd64-${context.sha}\`
            - Native topology: Nginx + PHP 8.3 Installer + MySQL 8.x + authenticated Redis + 8 Go/systemd services + ClamAV.
            - G13: 8-service restart, Nginx restart, MySQL/Redis reconnect, real ClamAV EICAR, real QR render/decode, real file upload/scan/download, real PDF render, SMTP protocol, OAuth provider adapters, Cloudflare Turnstile Siteverify, signed Epay channel lifecycle.

            ${success?'P00–P22 / G0–G13 are complete on this exact HEAD.':'P22 remains incomplete; do not claim Final Candidate / Production Candidate.'}
            `;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:8,per_page:100});
            const existing=comments.find(c=>c.body?.includes(marker));
            if(existing) await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body:evidence});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:8,body:evidence});

            if(!success){
              core.setFailed('P22 closure failed; G12/G13 remain incomplete.');
              return;
            }

            const issue=await github.rest.issues.get({owner:context.repo.owner,repo:context.repo.repo,issue_number:8});
            let body=issue.data.body||'';
            body=body.replace(
              '> **状态：ACTIVE / P21 COMPLETE / P22 NOT STARTED / 唯一 V5 执行总线**',
              '> **状态：COMPLETE / P22 COMPLETE / G0–G13 COMPLETE / 唯一 V5 执行总线**'
            );
            body=body.replace('- [ ] **P22 — Fresh Install Candidate**','- [x] **P22 — Fresh Install Candidate**');
            body=body.replace(
              'P22 Fresh Install Candidate / G12–G13 **未开始、未声明、未验收**。',
              'P22 Fresh Install Candidate / G12–G13 已在 authoritative exact-head Gate 完成并验收。'
            );

            if(!body.includes('### P22 ✅')){
              const insert=`### P22 ✅
            Final authoritative exact-head：\`${context.sha}\` / Actions \`${context.runId}\` success。

            Fresh Install Candidate / G12–G13 已完整闭环：
            - exact-head P21 prerequisite：success，消费同一 SHA 的 immutable Native artifact；
            - G12：BT/aaPanel 生产目录契约下，以真实 Nginx + PHP 8.3 + MySQL 8.x + authenticated Redis + systemd + ClamAV 完成 HTTPS 四步 Web Installer fresh install；
            - 安装后 8 个 Go/systemd 服务全部 enabled + active，Installer 已锁定并从公开入口返回 404；
            - G13：8 services restart、Nginx restart、MySQL/Redis reconnect 全部通过；
            - ClamAV EICAR、真实安全文件上传/扫描/下载、QR 真渲染与真解码、PDF 真渲染、SMTP、OAuth adapters、Cloudflare Turnstile Siteverify、Epay signed channel lifecycle 全部通过；
            - P22 immutable evidence artifact：\`gojet-v5-p22-evidence-${context.sha}\`。

            `;
              body=body.replace('## 5. 当前执行点',insert+'## 5. 当前执行点');
            }

            const start=body.indexOf('## 5. 当前执行点');
            const end=body.indexOf('## 6. Gate');
            if(start<0 || end<0 || end<=start) throw new Error('Issue #8 current execution section anchors missing');
            const execution=`## 5. 当前执行点

            **P22 — Fresh Install Candidate / COMPLETE**

            P00–P22 已按强制顺序完成；当前 authoritative exact HEAD 为 \`${context.sha}\`。P21 prerequisite run \`${process.env.P21_RUN_ID}\` 与 P22 Actions \`${context.runId}\` 均为 exact-head success；G12 Fresh Install 与 G13 Production Validation 已完成。

            **当前没有未执行阶段。** P00–P22 / G0–G13 已全部闭环；后续若进入正式发布、tag、production rollout 或版本升级，应另开独立发布任务，不得回改本 Issue 的已验收历史。

            `;
            body=body.slice(0,start)+execution+body.slice(end);
            await github.rest.issues.update({
              owner:context.repo.owner,repo:context.repo.repo,issue_number:8,body
            });
