name: GoJet Destination Risk Runtime Gate

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/v4-rc12-real-install-fixes
    paths:
      - 'app/destinationrisk/**'
      - 'services/platformapi/cmd/operationsmonitor/**'
      - 'services/redirectengine/internal/store/**'
      - 'database/migrations/linkdestinationrisk*.sql'
      - 'database/migrations/migrationcatalog.txt'
      - 'deploy/compose.production.yaml'
      - 'deploy/native/gojet@.service'
      - 'scripts/lib.sh'
      - '.github/workflows/destinationriskruntime.yml'
  pull_request:
    paths:
      - 'app/destinationrisk/**'
      - 'services/platformapi/cmd/operationsmonitor/**'
      - 'services/redirectengine/internal/store/**'
      - 'database/migrations/linkdestinationrisk*.sql'
      - 'database/migrations/migrationcatalog.txt'
      - 'deploy/compose.production.yaml'
      - 'deploy/native/gojet@.service'
      - 'scripts/lib.sh'
      - '.github/workflows/destinationriskruntime.yml'

concurrency:
  group: destination-risk-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Test risk runtime packages
        run: |
          set -euo pipefail
          go test ./app/destinationrisk ./services/platformapi/cmd/operationsmonitor ./services/redirectengine/internal/store
          go vet ./app/destinationrisk ./services/platformapi/cmd/operationsmonitor ./services/redirectengine/internal/store
      - name: Validate safe migration baseline
        run: |
          set -euo pipefail
          grep -Fq "'review'," database/migrations/linkdestinationrisk.sql
          grep -Fq "review until first destination scan completes" database/migrations/linkdestinationrisk.sql
          grep -Fq 'UTC_TIMESTAMP()' database/migrations/linkdestinationrisk.sql
          grep -Fq "WHERE provider='migration_legacy'" database/migrations/linkdestinationriskbaseline.sql
          grep -Fq "SET decision='review'" database/migrations/linkdestinationriskbaseline.sql
          grep -Fq 'next_scan_at=UTC_TIMESTAMP()' database/migrations/linkdestinationriskbaseline.sql
          python3 - <<'PY'
          from pathlib import Path
          catalog = [line.strip() for line in Path('database/migrations/migrationcatalog.txt').read_text().splitlines() if line.strip()]
          first = 'linkdestinationrisk.sql'
          baseline = 'linkdestinationriskbaseline.sql'
          assert catalog.count(first) == 1, f'{first} must appear exactly once in migration catalog'
          assert catalog.count(baseline) == 1, f'{baseline} must appear exactly once in migration catalog'
          assert catalog.index(baseline) > catalog.index(first), 'risk baseline must run after initial destination-risk migration'
          PY
          if grep -n -A18 'legacy migration baseline' database/migrations/linkdestinationrisk.sql | grep -Fq "'allow'"; then
            echo 'destination-risk migration baseline must never grant ALLOW' >&2
            exit 1
          fi
      - name: Validate redirect fail-closed contract
        run: |
          set -euo pipefail
          grep -Fq 'Only an exact ALLOW decision bound to the current target fingerprint' services/redirectengine/internal/store/redis.go
          grep -Fq 'enforceRiskDecision(&l, risk)' services/redirectengine/internal/store/redis.go
          grep -Fq '"missing", nil, "reason=review"' services/redirectengine/internal/store/risk_test.go
          grep -Fq 'TestRiskDecisionWithoutPublicBaseStillFailsClosed' services/redirectengine/internal/store/risk_test.go
      - name: Validate Docker risk worker contract
        run: |
          set -euo pipefail
          block="$(sed -n '/^  operationsmonitor:/,/^  clamav:/p' deploy/compose.production.yaml)"
          printf '%s\n' "$block" | grep -Fq 'REDIS_ADDRESS: redis:6379'
          printf '%s\n' "$block" | grep -Fq 'REDIS_PASSWORD:'
          printf '%s\n' "$block" | grep -Fq 'test: ["CMD", "/operationsmonitor", "healthcheck"]'
          printf '%s\n' "$block" | grep -Fq 'condition: service_healthy'
      - name: Validate installer and Native recovery contract
        run: |
          set -euo pipefail
          sh -n scripts/lib.sh
          grep -Fq 'compose exec -T operationsmonitor /operationsmonitor healthcheck' scripts/lib.sh
          grep -Fq 'ExecStartPost=/bin/sh -c' deploy/native/gojet@.service
          grep -Fq 'operationsmonitor healthcheck' deploy/native/gojet@.service
          grep -Fq 'EnsureRedisCache' services/platformapi/cmd/operationsmonitor/main.go
          grep -Fq 'redisCacheReadyKey' app/destinationrisk/runtime.go
          grep -Fq 'rdb.Del(ctx, destinationrisk.RedisKey(item.LinkID, targets))' services/platformapi/cmd/operationsmonitor/main.go
      - name: Reject named-site risk exceptions
        run: |
          set -euo pipefail
          if grep -R -I -n -E 'missav|ybqefs|xp9wq9pq' app/destinationrisk services/platformapi/cmd/operationsmonitor services/redirectengine/internal/store; then
            echo 'named-site destination-risk exception detected' >&2
            exit 1
          fi
