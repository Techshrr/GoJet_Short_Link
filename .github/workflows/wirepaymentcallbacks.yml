name: GoJet payment callback route wiring

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/v4-rc12-real-install-fixes
    paths:
      - '.github/workflows/wirepaymentcallbacks.yml'

permissions:
  contents: write

concurrency:
  group: gojetpaymentcallbackroutewiring
  cancel-in-progress: false

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/v4-rc12-real-install-fixes
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Wire callback observer and administrator query route
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path=Path('services/platformapi/cmd/server/productroutes.go')
          text=path.read_text(encoding='utf-8')

          marker='\tmux.HandleFunc("GET /api/workspaces/{id}/billing/payment-methods", s.user(s.paymentMethods))\n'
          admin='\tmux.HandleFunc("GET /api/admin/payment-callbacks", s.admin("billing.manage", s.adminPaymentCallbacks))\n'
          if admin not in text:
              if marker not in text:
                  raise SystemExit('payment methods route marker not found')
              text=text.replace(marker, marker+admin, 1)

          replacements={
              '\tmux.HandleFunc("POST /api/payments/alipay/notify", s.alipayNotify)\n':'\tmux.HandleFunc("POST /api/payments/alipay/notify", s.observePaymentCallback("alipay", s.alipayNotify))\n',
              '\tmux.HandleFunc("POST /api/payments/wechat/notify", s.wechatNotify)\n':'\tmux.HandleFunc("POST /api/payments/wechat/notify", s.observePaymentCallback("wechat", s.wechatNotify))\n',
              '\tmux.HandleFunc("POST /api/payments/epay/notify", s.epayNotify)\n':'\tmux.HandleFunc("POST /api/payments/epay/notify", s.observePaymentCallback("epay", s.epayNotify))\n',
              '\tmux.HandleFunc("POST /api/payments/paypal/webhook", s.paypalWebhook)\n':'\tmux.HandleFunc("POST /api/payments/paypal/webhook", s.observePaymentCallback("paypal", s.paypalWebhook))\n',
              '\tmux.HandleFunc("POST /api/payments/stripe/webhook", s.stripeWebhook)\n':'\tmux.HandleFunc("POST /api/payments/stripe/webhook", s.observePaymentCallback("stripe", s.stripeWebhook))\n',
          }
          for old,new in replacements.items():
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit('callback route marker not found: '+old.strip())
              text=text.replace(old,new,1)

          path.write_text(text,encoding='utf-8')
          PY
          gofmt -w services/platformapi/cmd/server/productroutes.go services/platformapi/cmd/server/paymentcallbacks.go
          node --check frontend/adminconsole/paymentcallbacks.js
          python3 scripts/checknames.py
          python3 scripts/checkschema.py
          go test ./...
          go vet ./...

      - name: Commit validated source wiring
        run: |
          set -euo pipefail
          git restore -- .github/workflows
          git config user.name 'GoJet Payment Callback Wiring'
          git config user.email 'actions@users.noreply.github.com'
          git add services/platformapi/cmd/server/productroutes.go services/platformapi/cmd/server/paymentcallbacks.go
          git diff --cached --name-status
          if git diff --cached --quiet; then
            echo 'Callback routes already wired.'
            exit 0
          fi
          git commit -m 'Wire payment callback observability'
          git push origin HEAD:rebuild/v4-rc12-real-install-fixes
