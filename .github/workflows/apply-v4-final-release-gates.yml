name: Apply V4 final release gates

on:
  push:
    branches:
      - 'rebuild/v4-product'
    paths:
      - 'scripts/v4-final-release-gates.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/v4-product
          fetch-depth: 0
      - name: Rebase and apply final gates
        run: |
          git fetch origin rebuild/v4-product
          git reset --hard origin/rebuild/v4-product
          python3 scripts/apply-v4-final-release-gates.py
          sh -n scripts/verify-release.sh
          grep -Fq 'admin-permission-boundary.sh' .github/workflows/product-rebuild-candidate-gate.yml
          grep -Fq 'public/announcements/index.html' scripts/verify-release.sh
      - name: Commit final gates
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'gojet-ci'
          git config user.email 'gojet-ci@users.noreply.github.com'
          git add .github/workflows/product-rebuild-candidate-gate.yml .github/workflows/installer-release.yml scripts/verify-release.sh
          git commit -m 'release: converge final V4 candidate gates'
          git pull --rebase origin rebuild/v4-product
          git push origin HEAD:rebuild/v4-product
