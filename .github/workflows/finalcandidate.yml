name: GoJet Final Candidate Gate

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/v4-rc12-real-install-fixes

permissions:
  actions: write
  contents: read

concurrency:
  group: gojetfinalcandidate${{ github.ref }}
  cancel-in-progress: true

jobs:
  exactheadcandidate:
    name: Exact HEAD candidate promotion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for exact HEAD required gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; sha=os.environ['GITHUB_SHA']; token=os.environ['GH_TOKEN']
          api=os.environ.get('GITHUB_API_URL','https://api.github.com')
          branch='rebuild/v4-rc12-real-install-fixes'
          required={
            'GoJet Database Schema Naming Gate':'schemanaming.yml',
            'GoJet Analytics Dashboard Gate':'analyticsdashboard.yml',
            'GoJet Authentication Policy Gate':'authpolicy.yml',
            'GoJet Installer Validation':'installervalidation.yml',
            'GoJet Full stack P0 gate':'fullstackp0.yml',
            'GoJet Product Surface Gate':'productsurface.yml',
            'GoJet Release Package Gate':'releasepackage.yml',
            'GoJet Public Payment Callback Gate':'paymentcallbackpublic.yml',
            'GoJet Payment Callback Browser Gate':'paymentcallbackbrowser.yml',
          }
          def request(path,method='GET',body=None):
            data=None if body is None else json.dumps(body).encode()
            req=urllib.request.Request(api+path,data=data,method=method,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json','User-Agent':'GoJet-Final-Candidate'})
            with urllib.request.urlopen(req,timeout=30) as response:
              if response.status==204:return None
              return json.load(response)
          def get(path):return request(path)
          def assert_current_head():
            ref=get(f'/repos/{repo}/git/ref/heads/{branch}')
            if ref.get('object',{}).get('sha')!=sha:raise SystemExit('candidate SHA is no longer the branch HEAD')
          dispatched=set(); latest={}
          for attempt in range(120):
            assert_current_head()
            payload=get(f'/repos/{repo}/actions/runs?head_sha={sha}&per_page=100')
            latest={}
            for run in payload.get('workflow_runs',[]):
              name=run.get('name')
              if name not in required:continue
              current=latest.get(name)
              if current is None or (run.get('run_number',0),run.get('run_attempt',0),run.get('id',0))>(current.get('run_number',0),current.get('run_attempt',0),current.get('id',0)):
                latest[name]=run
            failed=[name for name in required if name in latest and latest[name].get('status')=='completed' and latest[name].get('conclusion')!='success']
            if failed:
              for name in failed:print(f'{name}: {latest[name].get("conclusion")}',file=sys.stderr)
              raise SystemExit('exact HEAD gate failed')
            missing=[name for name in required if name not in latest]
            for name in missing:
              if name in dispatched:continue
              workflow=required[name]
              try:
                request(f'/repos/{repo}/actions/workflows/{workflow}/dispatches','POST',{'ref':branch})
                dispatched.add(name)
                print(f'dispatched missing exact HEAD gate: {name} ({workflow})')
              except urllib.error.HTTPError as exc:
                detail=exc.read().decode(errors='replace')
                raise SystemExit(f'failed to dispatch {name}: HTTP {exc.code} {detail}')
            pending=[name for name in required if name not in latest or latest[name].get('status')!='completed']
            if not pending:break
            print('waiting for: '+', '.join(pending))
            time.sleep(10)
          else:raise SystemExit('timed out waiting for exact HEAD gates')
          non_success=[name for name in required if latest[name].get('conclusion')!='success']
          if non_success:raise SystemExit('required exact HEAD gates are not all successful')
          assert_current_head()
          release=latest['GoJet Release Package Gate']; release_id=release['id']
          jobs=get(f'/repos/{repo}/actions/runs/{release_id}/jobs?per_page=100').get('jobs',[])
          jobmap={job.get('name'):job for job in jobs}
          for name in ('Production package','Fresh install candidate'):
            if jobmap.get(name,{}).get('conclusion')!='success':raise SystemExit(f'{name} is not successful in exact release run')
          artifacts=get(f'/repos/{repo}/actions/runs/{release_id}/artifacts?per_page=100').get('artifacts',[])
          expected='gojetreleasepackage'+sha
          matches=[artifact for artifact in artifacts if artifact.get('name')==expected and not artifact.get('expired')]
          if len(matches)!=1:raise SystemExit('exact release package artifact is missing, duplicated, or expired')
          artifact=matches[0]
          evidence=['tested_sha='+sha,'release_run_id='+str(release_id),'release_artifact_id='+str(artifact['id']),'release_artifact_name='+expected]
          evidence += [name+'=success' for name in required]
          open('/tmp/GOJETFINALCANDIDATE.txt','w').write('\n'.join(evidence)+'\n')
          print('\n'.join(evidence))
          PY
      - name: Upload immutable final candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: gojetfinalcandidateevidence${{ github.sha }}
          path: /tmp/GOJETFINALCANDIDATE.txt
          if-no-files-found: error
          retention-days: 14
