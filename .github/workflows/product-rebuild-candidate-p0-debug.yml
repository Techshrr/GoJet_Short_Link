name: V4 RC10 candidate P0 isolation

on:
  push:
    branches:
      - 'rebuild/v4-product-hardening'
    paths:
      - 'scripts/v4-candidate-p0-debug.trigger'

permissions:
  contents: read
  actions: read

env:
  PACKAGE_RUN_ID: '31421124096'
  PACKAGE_ARTIFACT_NAME: 'gojet-4.0.0-rc.10-package-release'
  PACKAGE_ZIP_SHA256: '6bcefc6b0160ca67b92c05d98866d4868ba8492605baaf624de3faed12b55c6c'

jobs:
  isolate-p0:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gojet_debug
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client zbar-tools unzip
      - name: Download exact RC10 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_ARTIFACT_NAME }}
          path: /tmp/gojet-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PACKAGE_RUN_ID }}
      - name: Extract exact RC10 and apply fresh migrations
        env:
          MYSQL_PWD: root
        run: |
          set -euo pipefail
          ZIP=/tmp/gojet-artifact/gojet-4.0.0-rc.10-linux-production.zip
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = "$PACKAGE_ZIP_SHA256"
          mkdir -p /tmp/gojet-debug-root
          unzip -q "$ZIP" -d /tmp/gojet-debug-root
          ROOT=$(find /tmp/gojet-debug-root -mindepth 1 -maxdepth 1 -type d | head -1)
          echo "$ROOT" >/tmp/gojet-debug-root-path
          for f in "$ROOT"/database/migrations/*.sql; do mysql -h127.0.0.1 -P3306 -uroot gojet_debug < "$f"; done
      - name: Start exact packaged runtime
        run: |
          set -euo pipefail
          ROOT=$(cat /tmp/gojet-debug-root-path)
          mkdir -p /tmp/gojet-debug/uploads /tmp/gojet-debug/files /tmp/gojet
          SETTINGS_KEY=$(python3 - <<'PY'
          import base64
          print(base64.b64encode(bytes(range(32))).decode())
          PY
          )
          printf 'SETTINGS_ENCRYPTION_KEY=%s\n' "$SETTINGS_KEY" > /tmp/gojet/test-env
          cp "$ROOT/bin/mail-worker" /tmp/gojet/mail-worker
          chmod 0755 /tmp/gojet/mail-worker
          env MYSQL_DSN='root:root@tcp(127.0.0.1:3306)/gojet_debug?parseTime=true&multiStatements=true' REDIS_ADDRESS='127.0.0.1:6379' SETTINGS_ENCRYPTION_KEY="$SETTINGS_KEY" ADMIN_BOOTSTRAP_EMAIL='owner@example.test' ADMIN_BOOTSTRAP_PASSWORD='OwnerPassword!2026' QR_TRACKING_KEY='fresh-candidate-rc10-qr-key-2026' PUBLIC_BASE_URL='http://127.0.0.1:18080' PLATFORM_HTTP_ADDRESS='127.0.0.1:18090' UPLOAD_STORAGE_PATH='/tmp/gojet-debug/uploads' FILE_STORAGE_PATH='/tmp/gojet-debug/files' "$ROOT/bin/platform-api" >/tmp/gojet-debug/platform-api.log 2>&1 &
          echo $! >/tmp/gojet-debug/platform-api.pid
          env REDIS_ADDRESS='127.0.0.1:6379' HTTP_ADDRESS='127.0.0.1:18080' VISITOR_HASH_KEY='fresh-candidate-visitor-key-2026' QR_TRACKING_KEY='fresh-candidate-rc10-qr-key-2026' "$ROOT/bin/redirect-engine" >/tmp/gojet-debug/redirect-engine.log 2>&1 &
          echo $! >/tmp/gojet-debug/redirect-engine.pid
          env MYSQL_DSN='root:root@tcp(127.0.0.1:3306)/gojet_debug?parseTime=true&multiStatements=true' REDIS_ADDRESS='127.0.0.1:6379' ANALYTICS_GROUP='gojet-mysql' ANALYTICS_CONSUMER='fresh-candidate-debug' "$ROOT/bin/analytics-worker" >/tmp/gojet-debug/analytics-worker.log 2>&1 &
          echo $! >/tmp/gojet-debug/analytics-worker.pid
          for port in 18090 18080; do for i in $(seq 1 60); do curl -fsS "http://127.0.0.1:$port/health" >/dev/null 2>&1 && break; sleep 1; test "$i" -lt 60; done; done

      - name: P0 1 - Core product API
        env: &p0env
          GOJET_TEST_BASE: http://127.0.0.1:18090
          GOJET_PUBLIC_BASE: http://127.0.0.1:18080
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: gojet_debug
          REDIS_ADDRESS: 127.0.0.1:6379
          UPLOAD_STORAGE_PATH: /tmp/gojet-debug/uploads
          FILE_STORAGE_PATH: /tmp/gojet-debug/files
        run: bash -x tests/integration/product-rebuild-api.sh
      - name: P0 2 - Administrator permission boundary
        env: *p0env
        run: bash -x tests/integration/admin-permission-boundary.sh
      - name: P0 3 - Administrator link lifecycle
        env: *p0env
        run: bash -x tests/integration/admin-link-lifecycle.sh
      - name: P0 4 - Real QR lifecycle
        env: *p0env
        run: bash -x tests/integration/qr-real-e2e.sh
      - name: P0 5 - Protected file lifecycle
        env: *p0env
        run: bash -x tests/integration/file-share-lifecycle.sh
      - name: P0 6 - Brand logo lifecycle
        env: *p0env
        run: bash -x tests/integration/brand-logo-lifecycle.sh
      - name: P0 7 - SMTP mail lifecycle
        env: *p0env
        run: bash -x tests/integration/mail-lifecycle-smtp.sh
      - name: P0 8 - Billing payment conflict
        env: *p0env
        run: bash -x tests/integration/billing-payment-conflict.sh
      - name: P0 9 - Billing FX freeze
        env: *p0env
        run: bash -x tests/integration/billing-fx-freeze.sh
      - name: Diagnostics
        if: failure()
        run: |
          cat /tmp/gojet-debug/platform-api.log 2>/dev/null || true
          cat /tmp/gojet-debug/redirect-engine.log 2>/dev/null || true
          cat /tmp/gojet-debug/analytics-worker.log 2>/dev/null || true
          cat /tmp/gojet/mail-worker.log 2>/dev/null || true
          MYSQL_PWD=root mysql -h127.0.0.1 -P3306 -uroot gojet_debug -e 'SELECT id,email,status FROM users ORDER BY id; SELECT id,code,status FROM short_links ORDER BY id; SELECT id,invoice_number,status FROM billing_invoices ORDER BY id;' || true
      - name: Stop debug runtime
        if: always()
        run: |
          for n in platform-api redirect-engine analytics-worker; do test ! -f "/tmp/gojet-debug/$n.pid" || kill "$(cat "/tmp/gojet-debug/$n.pid")" 2>/dev/null || true; done
