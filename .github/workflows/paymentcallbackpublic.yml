name: GoJet Public Payment Callback Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/payments/**'
      - 'app/billing/**'
      - 'app/observability/**'
      - 'database/**'
      - 'deploy/nginx/**'
      - 'frontend/adminconsole/paymentcallbacks.js'
      - 'frontend/adminconsole/billingadmin.js'
      - 'frontend/adminconsole/index.html'
      - 'services/platformapi/cmd/server/**'
      - 'scripts/runmigrations.sh'
      - 'tests/integration/paymentcallbackpublic.sh'
      - '.github/workflows/paymentcallbackpublic.yml'
      - '.github/workflows/paymentcallbackbrowser.yml'
  push:
    branches:
      - rebuild/v4-rc12-real-install-fixes
    paths:
      - 'app/payments/**'
      - 'app/billing/**'
      - 'app/observability/**'
      - 'database/**'
      - 'deploy/nginx/**'
      - 'frontend/adminconsole/paymentcallbacks.js'
      - 'frontend/adminconsole/billingadmin.js'
      - 'frontend/adminconsole/index.html'
      - 'services/platformapi/cmd/server/**'
      - 'scripts/runmigrations.sh'
      - 'tests/integration/paymentcallbackpublic.sh'
      - '.github/workflows/paymentcallbackpublic.yml'
      - '.github/workflows/paymentcallbackbrowser.yml'

concurrency:
  group: gojetpaymentcallbackpublic${{ github.ref }}
  cancel-in-progress: true

jobs:
  callback:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gojet_payment_public
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install public ingress dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y default-mysql-client nginx

      - name: Validate source naming schema and callback surface
        run: |
          set -euo pipefail
          python3 scripts/checknames.py
          python3 scripts/checkschema.py
          bash -n scripts/runmigrations.sh
          node --check frontend/adminconsole/paymentcallbacks.js
          bash -n tests/integration/paymentcallbackpublic.sh
          go test ./...
          go vet ./...
          for config in deploy/nginx/gojet.conf deploy/nginx/gojethost.conf deploy/nginx/gojetnative.conf deploy/nginx/gojetbtrewrite.conf; do
            grep -Fq 'location ^~ /api/payments/' "$config"
            grep -Fq 'client_max_body_size 3m;' "$config"
            grep -Fq 'proxy_request_buffering off;' "$config"
            grep -Fq 'add_header Cache-Control "no-store" always;' "$config"
          done

      - name: Apply migration catalog to fresh payment database
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: gojet_payment_public
        run: |
          set -euo pipefail
          bash scripts/runmigrations.sh
          test "$(find database/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 43
          test "$(grep -cve '^[[:space:]]*$' database/migrations/migrationcatalog.txt)" -eq 43
          grep -Fxq 'paymentcallbackevents.sql' database/migrations/migrationcatalog.txt
          grep -Fxq 'linkdestinationrisk.sql' database/migrations/migrationcatalog.txt
          grep -Fxq 'socialauth.sql' database/migrations/migrationcatalog.txt
          MYSQL_PWD=root mysql -h127.0.0.1 -P3306 -uroot gojet_payment_public -N -B -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='gojet_payment_public' AND TABLE_NAME='payment_callback_events';" | grep -Fxq 1

      - name: Build and start exact platform callback runtime
        run: |
          set -euo pipefail
          mkdir -p /tmp/gojetpaymentruntime/{uploads,files,brand,generated/qr,bin}
          go build -o /tmp/gojetpaymentruntime/bin/platformapi ./services/platformapi/cmd/server
          SETTINGS_KEY=$(python3 - <<'PY'
          import base64
          print(base64.b64encode(bytes(range(32))).decode())
          PY
          )
          QR_KEY='5a70c2a65f66db421d7299c6d76e55505003f46a5dd4b269f7ae5a9ac2fab032'
          env \
            MYSQL_DSN='root:root@tcp(127.0.0.1:3306)/gojet_payment_public?parseTime=true&multiStatements=true' \
            REDIS_ADDRESS='127.0.0.1:6379' \
            SETTINGS_ENCRYPTION_KEY="$SETTINGS_KEY" \
            ADMIN_BOOTSTRAP_EMAIL='owner@example.test' \
            ADMIN_BOOTSTRAP_PASSWORD='OwnerPassword!2026' \
            QR_TRACKING_KEY="$QR_KEY" \
            PUBLIC_BASE_URL='http://127.0.0.1:18081' \
            PLATFORM_HTTP_ADDRESS='127.0.0.1:18090' \
            UPLOAD_STORAGE_PATH='/tmp/gojetpaymentruntime/uploads' \
            BRAND_ASSET_PATH='/tmp/gojetpaymentruntime/brand' \
            GENERATED_QR_STORAGE_PATH='/tmp/gojetpaymentruntime/generated/qr' \
            FILE_STORAGE_PATH='/tmp/gojetpaymentruntime/files' \
            PDF_FONT_PATH="$GITHUB_WORKSPACE/resources/fonts/NotoSansSCRegular.ttf" \
            /tmp/gojetpaymentruntime/bin/platformapi >/tmp/gojetpaymentruntime/platformapi.log 2>&1 &
          echo $! >/tmp/gojetpaymentruntime/platformapi.pid
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:18090/health >/dev/null 2>&1 && break
            sleep 1
            test "$i" -lt 60
          done

      - name: Serve callback through real host Nginx template
        run: |
          set -euo pipefail
          ROOT=/tmp/gojetpaymentroot
          rm -rf "$ROOT"
          mkdir -p "$ROOT/public/app" "$ROOT/public/admin"
          python3 scripts/buildpublicsite.py --output "$ROOT/public"
          mkdir -p "$ROOT/public/app" "$ROOT/public/admin"
          chmod -R a+rX "$ROOT"
          python3 - "$ROOT" <<'PY'
          from pathlib import Path
          import sys
          root=sys.argv[1]
          text=Path('deploy/nginx/gojethost.conf').read_text(encoding='utf-8')
          text=text.replace('__GOJET_ROOT__',root).replace('listen 80;','listen 18081;')
          Path('/tmp/gojetpaymenthost.conf').write_text(text,encoding='utf-8')
          PY
          sudo rm -f /etc/nginx/sites-enabled/default /etc/nginx/conf.d/default.conf
          sudo cp /tmp/gojetpaymenthost.conf /etc/nginx/conf.d/gojetpaymenthost.conf
          sudo nginx -t
          sudo nginx
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18081/ >/dev/null 2>&1 && break
            sleep 1
            test "$i" -lt 30
          done
          sudo nginx -T 2>&1 | grep -Fq 'location ^~ /api/payments/'

      - name: Run public signed callback and observability acceptance
        env:
          GOJET_PUBLIC_BASE: http://127.0.0.1:18081
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: gojet_payment_public
        run: bash tests/integration/paymentcallbackpublic.sh

      - name: Payment callback diagnostics
        if: failure()
        env:
          MYSQL_PWD: root
        run: |
          echo '===== platformapi ====='
          cat /tmp/gojetpaymentruntime/platformapi.log 2>/dev/null || true
          echo '===== nginx config ====='
          sudo nginx -T 2>&1 || true
          echo '===== nginx error ====='
          sudo cat /var/log/nginx/error.log 2>/dev/null || true
          echo '===== payment callbacks ====='
          mysql -h127.0.0.1 -P3306 -uroot gojet_payment_public -e 'SELECT id,provider,request_id,merchant_order_no,provider_reference,transaction_id,invoice_id,outcome,response_status,remote_ip,created_at FROM payment_callback_events ORDER BY id DESC LIMIT 20;' 2>/dev/null || true
          echo '===== payment transactions ====='
          mysql -h127.0.0.1 -P3306 -uroot gojet_payment_public -e 'SELECT id,invoice_id,provider,merchant_order_no,provider_order_id,status,amount_cents,currency,updated_at FROM payment_transactions ORDER BY id DESC LIMIT 20;' 2>/dev/null || true

      - name: Stop payment callback runtime
        if: always()
        run: |
          sudo nginx -s stop 2>/dev/null || true
          if [ -f /tmp/gojetpaymentruntime/platformapi.pid ]; then
            kill "$(cat /tmp/gojetpaymentruntime/platformapi.pid)" 2>/dev/null || true
          fi
