name: V5.0.2 Test Install Package

on:
  push:
    branches:
      - "rebuild/v5.0.2-auth-i18n-product-copy"
    paths:
      - ".github/workflows/v502-test-package.yml"
      - "frontend/**"
      - "app/**"
      - "services/**"
      - "database/**"
      - "scripts/**"
      - "deploy/**"
      - "installer/**"
      - "public/install/**"
      - "install.sh"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  package:
    name: Build test install package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frozen frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Prepare FontTools without apt mirror dependency
        run: |
          set -euo pipefail
          python3 -m venv /tmp/gojet-fonttools
          . /tmp/gojet-fonttools/bin/activate
          python -m pip install --disable-pip-version-check --no-input fonttools
          python - <<'PY'
          from fontTools.ttLib import TTFont
          from fontTools.varLib.instancer import instantiateVariableFont
          print('FontTools ready without apt')
          PY
          echo "/tmp/gojet-fonttools/bin" >> "$GITHUB_PATH"

      - name: Confirm package build path does not invoke apt
        run: |
          set -euo pipefail
          if grep -nE '(^|[[:space:]])(sudo[[:space:]]+)?apt(-get)?[[:space:]]' scripts/packagev5native.sh scripts/preparepdffonts.sh scripts/verifyv5nativepackage.sh; then
            echo 'Test package build path must not invoke apt.' >&2
            exit 1
          fi
          echo 'Package build path uses no apt mirror.'

      - name: Build Native test install package
        run: bash scripts/packagev5native.sh

      - name: Verify package structure and exact SHA
        env:
          GOJET_EXPECTED_SHA: ${{ github.sha }}
        run: bash scripts/verifyv5nativepackage.sh

      - name: Write test-package marker
        run: |
          printf '%s\n' 'TEST PACKAGE - NOT RELEASE CERTIFIED' > dist/native/TEST-PACKAGE.txt
          printf 'Git SHA: %s\n' '${{ github.sha }}' >> dist/native/TEST-PACKAGE.txt

      - name: Upload test install package
        uses: actions/upload-artifact@v4
        with:
          name: gojet-v5.0.2-test-install-${{ github.sha }}
          path: |
            dist/native/gojet-v5-native-linux-amd64.tar.gz
            dist/native/gojet-v5-native-linux-amd64.tar.gz.sha256
            dist/native/TEST-PACKAGE.txt
            dist/native/stage/gojet-v5-native-linux-amd64/VERSION-MANIFEST.json
            dist/native/stage/gojet-v5-native-linux-amd64/SBOM.cdx.json
            dist/native/stage/gojet-v5-native-linux-amd64/MANIFEST.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Record successful test package
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const marker='<!-- v502-test-package -->';
            const body=[
              marker,
              '## V5.0.2 test install package',
              '',
              '- Status: **success**',
              `- SHA: \`${context.sha}\``,
              `- Run ID: \`${context.runId}\``,
              `- Artifact: \`gojet-v5.0.2-test-install-${context.sha}\``,
              `- Actions: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '- Package verification: PASS',
              '- Test-package build invokes no apt mirror',
            ].join('\n');
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:8,per_page:100});
            const old=comments.find(c=>c.body?.includes(marker));
            if(old) await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:old.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:8,body});

      - name: Record failed test package
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const marker='<!-- v502-test-package -->';
            const body=[
              marker,
              '## V5.0.2 test install package',
              '',
              '- Status: **failure**',
              `- SHA: \`${context.sha}\``,
              `- Run ID: \`${context.runId}\``,
              `- Actions: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '- No package is being presented until the package build and verification pass.',
            ].join('\n');
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:8,per_page:100});
            const old=comments.find(c=>c.body?.includes(marker));
            if(old) await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:old.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:8,body});
