name: V5 P18 Docs Gate

on:
  push:
    branches: ["rebuild/v5-*"]
    paths:
      - "frontend/**"
      - "docs/v5/**"
      - ".github/workflows/v5-p18-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  p18-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify P18 static Docs contract and all frontend builds
        working-directory: frontend
        run: pnpm check
      - name: Browser regression P01-P18
        working-directory: frontend
        run: |
          pnpm test:shells
          pnpm test:links
          pnpm test:domains
          pnpm test:analytics
          pnpm test:qr
          pnpm test:files
          pnpm test:text
          pnpm test:bio
          pnpm test:workspace
          pnpm test:billing
          pnpm test:commerce
          pnpm test:support
          pnpm test:mail-ops
          pnpm test:auth
          pnpm test:account
          pnpm test:oauth
          pnpm test:trust-safety
          pnpm test:admin
          pnpm test:docs
      - name: Verify Pagefind static search output
        working-directory: frontend
        run: test -f apps/docs/dist/pagefind/pagefind.js
      - name: Upload P18 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-p18-docs-${{ github.sha }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
            frontend/apps/docs/dist/pagefind/
          if-no-files-found: ignore
      - name: Publish exact-head evidence to Issue 8
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const branch=context.ref.replace('refs/heads/','');
            const ref=await github.rest.repos.getBranch({owner:context.repo.owner,repo:context.repo.repo,branch});
            if(ref.data.commit.sha!==context.sha){core.info(`Skip stale evidence: tested ${context.sha}, branch is ${ref.data.commit.sha}`);return;}
            const marker='<!-- v5-p18-ci-evidence-v1 -->';
            const status=process.env.JOB_STATUS==='success'?'SUCCESS':'FAILURE';
            const body=`${marker}\n### P18 Docs exact-HEAD CI evidence\n- **Status:** ${status}\n- **Branch:** \`${branch}\`\n- **Exact HEAD / tested SHA:** \`${context.sha}\`\n- **Actions run:** https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n- **Run ID:** \`${context.runId}\`\n- **Scope:** P01–P17 browser regression + P18 Docs three-viewport browser gate + Starlight/Astro static build + Pagefind artifact + EN/zh-CN IA/API/self-hosting contracts.\n- **Invariants:** /docs is static output; 56/260/760/220 desktop shell; local Pagefind search; no personalization dependency; core API reference includes endpoint/auth/params/body/examples/response/errors/rate-limit and curl/JavaScript/PHP/Go examples.\n`;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:8,per_page:100});
            const existing=comments.find(c=>c.body?.includes(marker));
            if(existing)await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:8,body});
