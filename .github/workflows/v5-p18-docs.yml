# P18/P19 same-exact-HEAD closure trigger; no Gate semantics changed.
name: V5 P18 Docs Gate

on:
  push:
    branches: ["rebuild/v5-*"]
    paths:
      - "frontend/**"
      - "docs/v5/**"
      - ".github/workflows/v5-p18-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: v5-p18-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Verify P01-P18 source contracts and independent builds
        working-directory: frontend
        run: pnpm check
      - name: Verify Pagefind static search output
        working-directory: frontend
        run: test -f apps/docs/dist/pagefind/pagefind.js

  docs-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Chromium without apt mirror dependency
        working-directory: frontend
        timeout-minutes: 12
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
        run: |
          set -euo pipefail
          pnpm exec playwright --version
          timeout -k 30s 10m pnpm exec playwright install chromium
      - name: P18 Docs browser gate — 1440 / 1024 / 390
        working-directory: frontend
        run: pnpm test:docs
      - name: Upload P18 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-p18-docs-${{ github.sha }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore

  close:
    if: always()
    needs: [contract, docs-browser]
    runs-on: ubuntu-latest
    steps:
      - name: Publish exact-head P18 closure evidence
        uses: actions/github-script@v7
        env:
          CONTRACT_RESULT: ${{ needs.contract.result }}
          BROWSER_RESULT: ${{ needs.docs-browser.result }}
        with:
          script: |
            const branch=context.ref.replace('refs/heads/','');
            const ref=await github.rest.repos.getBranch({owner:context.repo.owner,repo:context.repo.repo,branch});
            if(ref.data.commit.sha!==context.sha){core.info(`Skip stale evidence: tested ${context.sha}, branch is ${ref.data.commit.sha}`);return;}
            const success=process.env.CONTRACT_RESULT==='success' && process.env.BROWSER_RESULT==='success';
            const marker='<!-- v5-p18-ci-evidence-v1 -->';
            const body=`${marker}\n### P18 Docs exact-HEAD CI evidence\n- **Status:** ${success?'SUCCESS':'FAILURE'}\n- **Branch:** \`${branch}\`\n- **Exact HEAD / tested SHA:** \`${context.sha}\`\n- **Actions run:** https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n- **Run ID:** \`${context.runId}\`\n- **Contract/build:** ${process.env.CONTRACT_RESULT}\n- **Docs browser gate:** ${process.env.BROWSER_RESULT}\n- **Scope:** P01–P18 frozen source contracts + strict TypeScript/independent builds + P18 Docs three-viewport browser gate + Starlight/Astro static build + Pagefind artifact + EN/zh-CN IA/API/self-hosting contracts.\n- **Invariants:** /docs is static output; frozen token-driven 56/260/760/220 shell; local Pagefind search; no personalization dependency; core API reference includes endpoint/auth/params/body/examples/response/errors/rate-limit and curl/JavaScript/PHP/Go examples. P20 Whole Product Gate remains a later phase.\n`;
            const comments=await github.paginate(github.rest.issues.listComments,{owner:context.repo.owner,repo:context.repo.repo,issue_number:8,per_page:100});
            const existing=comments.find(c=>c.body?.includes(marker));
            if(existing) await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:8,body});
            if(!success) core.setFailed('P18 closure failed; see contract/docs-browser results above.');
