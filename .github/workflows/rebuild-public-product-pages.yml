name: Rebuild V4 public product pages

on:
  push:
    branches:
      - 'rebuild/v4-product'
    paths:
      - 'scripts/v4-public-pages.trigger'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/v4-product
          fetch-depth: 0
      - name: Rebase onto latest branch and regenerate
        run: |
          git fetch origin rebuild/v4-product
          git reset --hard origin/rebuild/v4-product
          python3 scripts/rebuild-public-product-pages.py
          grep -Fq '免费开始' frontend/marketing-site/products/url-shortener/index.html
          grep -Fq 'LINK ANALYTICS' frontend/marketing-site/products/analytics/index.html
          grep -Fq 'ClamAV' frontend/marketing-site/products/file-sharing/index.html
          grep -Fq '套餐管理' frontend/marketing-site/pricing/index.html
      - name: Commit generated pages
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'gojet-ci'
          git config user.email 'gojet-ci@users.noreply.github.com'
          git add frontend/marketing-site/products/url-shortener/index.html frontend/marketing-site/products/analytics/index.html frontend/marketing-site/products/qr-code/index.html frontend/marketing-site/products/bio-pages/index.html frontend/marketing-site/products/text-sharing/index.html frontend/marketing-site/products/file-sharing/index.html frontend/marketing-site/pricing/index.html
          git commit -m 'frontend: rebuild unified public product pages'
          git pull --rebase origin rebuild/v4-product
          git push origin HEAD:rebuild/v4-product
