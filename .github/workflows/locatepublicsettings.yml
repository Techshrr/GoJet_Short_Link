name: Locate GoJet public settings handler

on:
  push:
    branches:
      - rebuild/v4-rc12-real-install-fixes
    paths:
      - '.github/workflows/locatepublicsettings.yml'
  workflow_dispatch:

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate unique public settings handler
        run: |
          set -euo pipefail
          matches=$(grep -R -n --include='*.go' 'func (s \*server) publicSettings' services/platformapi/cmd/server || true)
          printf '%s\n' "$matches"
          count=$(printf '%s\n' "$matches" | grep -c . || true)
          test "$count" -eq 1
