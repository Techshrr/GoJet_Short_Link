name: Apply V4 auth convergence patch

on:
  push:
    branches:
      - 'rebuild/v4-product'
    paths:
      - 'scripts/apply-v4-auth-fixes.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/v4-product
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply targeted source fixes
        run: python3 scripts/apply-v4-auth-fixes.py
      - name: Verify patched source
        run: |
          grep -Fq 'POST /api/auth/forgot-password", s.requestPasswordReset' services/platform-api/cmd/server/main.go
          grep -Fq 'RevokeToken(r.Context(), token)' services/platform-api/cmd/server/identity.go
          grep -Fq 'email_verification_required' services/platform-api/cmd/server/identity.go
          grep -Fq 'requested = append(requested, "platform.read")' app/adminauth/service.go
          gofmt -w services/platform-api/cmd/server/identity.go services/platform-api/cmd/server/main.go app/adminauth/service.go
          go test ./...
          go vet ./...
      - name: Commit convergence patch
        run: |
          if git diff --quiet; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'gojet-ci'
          git config user.email 'gojet-ci@users.noreply.github.com'
          git add services/platform-api/cmd/server/identity.go services/platform-api/cmd/server/main.go app/adminauth/service.go
          git commit -m 'auth: finalize verification recovery and admin self access'
          git push origin HEAD:rebuild/v4-product
