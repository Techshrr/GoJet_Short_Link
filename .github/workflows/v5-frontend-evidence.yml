name: V5 Frontend CI Evidence

on:
  workflow_run:
    workflows:
      - V5 Frontend Foundation
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  publish-evidence:
    if: startsWith(github.event.workflow_run.head_branch, 'rebuild/v5-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update V5 master issue CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          marker='<!-- v5-frontend-ci-evidence -->'
          if [ "$CONCLUSION" = "success" ]; then
            state='✅ success'
          else
            state="❌ ${CONCLUSION:-unknown}"
          fi

          cat > /tmp/body.md <<EOF
          $marker
          ## V5 Frontend Foundation — latest exact-head evidence

          - Status: **$state**
          - Branch: \`$HEAD_BRANCH\`
          - Tested SHA: \`$HEAD_SHA\`
          - Workflow run: $RUN_URL
          - Run ID: \`$RUN_ID\`

          This comment is maintained automatically by \`.github/workflows/v5-frontend-evidence.yml\`; it records the SHA actually tested by the foundation gate and does not imply later phases are complete.
          EOF

          comment_id="$(gh api --paginate "repos/$REPO/issues/8/comments" --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1 || true)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" --raw-field body="$(cat /tmp/body.md)" >/dev/null
          else
            gh api --method POST "repos/$REPO/issues/8/comments" --raw-field body="$(cat /tmp/body.md)" >/dev/null
          fi
