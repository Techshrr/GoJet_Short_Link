name: Resolve PDF dependency lock

on:
  workflow_dispatch:
  push:
    branches:
      - 'rebuild/v4-rc12-real-install-fixes'

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve exact module graph
        run: |
          set -euo pipefail
          go mod tidy
          echo '===== GO.MOD ====='
          cat go.mod
          echo '===== PDF DEPENDENCY GO.SUM ====='
          grep -E 'signintech/gopdf|phpdave11/gofpdi|pkg/errors' go.sum
          echo '===== FULL GO.SUM ====='
          cat go.sum
      - name: Compile PDF packages
        run: |
          set -euo pipefail
          go test ./app/billing ./services/platform-api/cmd/server
