name: V4 RC12 final candidate auth continuation

on:
  workflow_dispatch:
  push:
    branches:
      - 'rebuild/v4-rc12-real-install-fixes'
    paths:
      - 'scripts/v4-candidate-auth-rc12.trigger'

permissions:
  contents: read
  actions: read

env:
  PACKAGE_RUN_ID: '31474701339'
  PACKAGE_HEAD_SHA: 'ee876bcd598f38660f6a6267298327765fc1fe27'
  PACKAGE_ARTIFACT_NAME: 'gojet-4.0.0-rc.12-package-release'
  PACKAGE_VERSION: '4.0.0-rc.12'
  PACKAGE_ZIP_SHA256: 'eebcc4a7ecdf13dd3439eaca2509406a3056c0843c8ef8822ad46e81a4b3a896'
  BASE_CANDIDATE_RUN_ID: '31475653144'
  BASE_CANDIDATE_CONTROL_SHA: 'a35214b8419da7e4a5f700525647c5343074e20d'

concurrency:
  group: v4-rc12-final-auth-continuation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-final:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gojet_auth_final
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove no runtime/package changes after RC12 Package
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee /tmp/gojet-auth-control-sha
          git cat-file -e "$PACKAGE_HEAD_SHA^{commit}"
          git diff --name-only "$PACKAGE_HEAD_SHA"..HEAD | tee /tmp/gojet-post-package-files
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              .github/workflows/product-rebuild-candidate-rc12-final.yml|scripts/v4-candidate-final-rc12.trigger|.github/workflows/product-rebuild-candidate-rc12-auth-final.yml|scripts/v4-candidate-auth-rc12.trigger) ;;
              *) echo "runtime/package content changed after RC12 Package gate: $path" >&2; exit 1 ;;
            esac
          done < /tmp/gojet-post-package-files

      - name: Verify Retry 2 passed every candidate gate before Auth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_CANDIDATE_RUN_ID}/jobs?per_page=100" > /tmp/base-candidate-jobs.json
          python3 - <<'PY'
          import json, os
          data=json.load(open('/tmp/base-candidate-jobs.json'))
          jobs=data.get('jobs',[])
          assert len(jobs)==1, jobs
          job=jobs[0]
          assert job.get('head_sha')==os.environ['BASE_CANDIDATE_CONTROL_SHA'], (job.get('head_sha'), os.environ['BASE_CANDIDATE_CONTROL_SHA'])
          steps={s['name']:s.get('conclusion') for s in job.get('steps',[])}
          required=[
            'Lock RC12 candidate snapshot and prove Package provenance',
            'Install candidate dependencies',
            'Download exact verified RC12 artifact',
            'Verify RC12 evidence and production ZIP',
            'Apply packaged RC12 migrations to two independent fresh databases',
            'Start exact packaged RC12 primary runtime',
            'Run RC12 P0 gates against exact packaged runtime',
            'Candidate support - customer lifecycle',
            'Candidate support - administrator queue and reply',
            'Candidate security - Turnstile secret boundary',
            'Candidate security - public abuse intake',
            'Stop primary packaged runtime',
            'Start packaged authentication-policy runtime',
          ]
          bad=[(name,steps.get(name)) for name in required if steps.get(name)!='success']
          assert not bad, bad
          assert steps.get('Run authentication policy against packaged runtime')=='failure', steps.get('Run authentication policy against packaged runtime')
          print('RC12 Retry 2 prerequisite gates verified; only Auth policy remained red.')
          PY

      - name: Install auth-candidate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client unzip file

      - name: Download exact verified RC12 Package artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_ARTIFACT_NAME }}
          path: /tmp/gojet-package-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PACKAGE_RUN_ID }}

      - name: Verify exact RC12 ZIP and unpack runtime
        run: |
          set -euo pipefail
          ART=/tmp/gojet-package-artifact
          EVIDENCE="$ART/RC12-RELEASE-EVIDENCE.txt"
          ZIP="$ART/gojet-4.0.0-rc.12-linux-production.zip"
          test -f "$EVIDENCE" -a -f "$ZIP" -a -f "$ZIP.sha256"
          grep -Fxq "tested_sha=$PACKAGE_HEAD_SHA" "$EVIDENCE"
          grep -Fxq "version=$PACKAGE_VERSION" "$EVIDENCE"
          grep -Fxq "sha256=$PACKAGE_ZIP_SHA256" "$EVIDENCE"
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = "$PACKAGE_ZIP_SHA256"
          (cd "$ART" && sha256sum -c "$(basename "$ZIP.sha256")")
          unzip -tq "$ZIP"
          mkdir -p /tmp/gojet-auth-root
          unzip -q "$ZIP" -d /tmp/gojet-auth-root
          ROOT=$(find /tmp/gojet-auth-root -mindepth 1 -maxdepth 1 -type d | head -1)
          test -n "$ROOT"
          printf '%s\n' "$ROOT" >/tmp/gojet-auth-root-path
          test "$(cat "$ROOT/VERSION")" = "$PACKAGE_VERSION"
          "$ROOT/scripts/verify-release.sh" "$ZIP"
          "$ROOT/scripts/verify-hardening-release.sh" "$ZIP"

      - name: Apply packaged migrations to fresh Auth database
        env:
          MYSQL_PWD: root
        run: |
          set -euo pipefail
          ROOT=$(cat /tmp/gojet-auth-root-path)
          for f in "$ROOT"/database/migrations/*.sql; do mysql -h127.0.0.1 -P3306 -uroot gojet_auth_final < "$f"; done

      - name: Start exact packaged Auth runtime with acceptance credentials
        run: |
          set -euo pipefail
          ROOT=$(cat /tmp/gojet-auth-root-path)
          mkdir -p /tmp/gojet-auth-final/uploads /tmp/gojet-auth-final/files /tmp/gojet-auth-final/system/images
          SETTINGS_KEY=$(python3 - <<'PY'
          import base64
          print(base64.b64encode(bytes(reversed(range(32)))).decode())
          PY
          )
          env \
            MYSQL_DSN='root:root@tcp(127.0.0.1:3306)/gojet_auth_final?parseTime=true&multiStatements=true' \
            REDIS_ADDRESS='127.0.0.1:6379' \
            SETTINGS_ENCRYPTION_KEY="$SETTINGS_KEY" \
            ADMIN_BOOTSTRAP_EMAIL='owner@example.test' \
            ADMIN_BOOTSTRAP_PASSWORD='OwnerPassword!2026' \
            QR_TRACKING_KEY='fresh-candidate-auth-rc12-final-key-2026' \
            PUBLIC_BASE_URL='http://127.0.0.1:18091' \
            PLATFORM_HTTP_ADDRESS='127.0.0.1:18091' \
            UPLOAD_STORAGE_PATH='/tmp/gojet-auth-final/uploads' \
            SYSTEM_IMAGE_PATH='/tmp/gojet-auth-final/system/images' \
            FILE_STORAGE_PATH='/tmp/gojet-auth-final/files' \
            "$ROOT/bin/platform-api" >/tmp/gojet-auth-final.log 2>&1 &
          echo $! >/tmp/gojet-auth-final.pid
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:18091/health >/dev/null 2>&1 && break; sleep 1; test "$i" -lt 60; done

      - name: Run authentication policy against exact packaged RC12 runtime
        env:
          GOJET_TEST_BASE: http://127.0.0.1:18091
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: gojet_auth_final
          REDIS_ADDRESS: 127.0.0.1:6379
        run: bash tests/integration/auth-policy.sh

      - name: Write composite RC12 Fresh Install Candidate evidence
        run: |
          set -euo pipefail
          ART=/tmp/gojet-package-artifact
          {
            echo "candidate_version=$PACKAGE_VERSION"
            echo "package_run_id=$PACKAGE_RUN_ID"
            echo "package_tested_sha=$PACKAGE_HEAD_SHA"
            echo "package_sha256=$PACKAGE_ZIP_SHA256"
            echo "base_candidate_run_id=$BASE_CANDIDATE_RUN_ID"
            echo "base_candidate_control_sha=$BASE_CANDIDATE_CONTROL_SHA"
            echo "auth_continuation_control_sha=$(cat /tmp/gojet-auth-control-sha)"
            echo 'fresh_package_migrations=pass'
            echo 'packaged_runtime_settings=pass'
            echo 'packaged_runtime_p0=pass'
            echo 'system_asset_isolation=pass'
            echo 'generated_qr_isolation=pass'
            echo 'mail_lifecycle=pass'
            echo 'support_customer=pass'
            echo 'support_administrator=pass'
            echo 'turnstile_secret_boundary=pass'
            echo 'public_abuse=pass'
            echo 'packaged_auth_policy=pass'
            echo 'candidate_result=pass'
          } | tee "$ART/RC12-FRESH-INSTALL-CANDIDATE-EVIDENCE.txt"

      - name: Refuse stale auth continuation if branch moved
        run: |
          set -euo pipefail
          TESTED=$(cat /tmp/gojet-auth-control-sha)
          CURRENT=$(git ls-remote origin refs/heads/rebuild/v4-rc12-real-install-fixes | awk '{print $1}')
          test "$TESTED" = "$CURRENT" || { echo "branch moved during RC12 auth continuation: tested=$TESTED current=$CURRENT" >&2; exit 1; }

      - name: Diagnostics on failure
        if: failure()
        run: |
          cat /tmp/gojet-auth-final.log 2>/dev/null || true
          MYSQL_PWD=root mysql -h127.0.0.1 -P3306 -uroot gojet_auth_final -e 'SELECT id,email,role,status FROM administrators; SELECT setting_key,setting_value FROM system_settings WHERE setting_key LIKE "registration.%";' || true

      - name: Stop Auth runtime
        if: always()
        run: kill "$(cat /tmp/gojet-auth-final.pid)" 2>/dev/null || true

      - name: Upload exact RC12 final Fresh Install Candidate
        uses: actions/upload-artifact@v4
        with:
          name: gojet-4.0.0-rc.12-fresh-install-candidate-final
          path: |
            /tmp/gojet-package-artifact/gojet-4.0.0-rc.12-linux-production.zip
            /tmp/gojet-package-artifact/gojet-4.0.0-rc.12-linux-production.zip.sha256
            /tmp/gojet-package-artifact/RC12-RELEASE-EVIDENCE.txt
            /tmp/gojet-package-artifact/RC12-FRESH-INSTALL-CANDIDATE-EVIDENCE.txt
          if-no-files-found: error
          retention-days: 14
