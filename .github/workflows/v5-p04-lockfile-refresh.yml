name: V5 P04 Lockfile Refresh

on:
  push:
    branches:
      - rebuild/v5-specification-rebuild
    paths:
      - '.github/workflows/v5-p04-lockfile-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Refresh lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(v5): lock P04 shell and browser dependencies'
          git push origin "HEAD:${GITHUB_REF_NAME}"
