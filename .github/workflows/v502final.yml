name: V5.0.2 Full System Acceptance

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - rebuild/v5.0.2-auth-i18n-product-copy

concurrency:
  group: v502fullsystem${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gojet_final
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Replace unstable Ubuntu mirror
        run: bash scripts/aptstable.sh

      - name: Install controlled acceptance dependencies
        run: |
          set -euo pipefail
          sudo apt-get install -y default-mysql-client nginx zip unzip poppler-utils zbar-tools python3-fonttools
          cd frontend
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium

      - name: Prepare database and PDF assets
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: gojet_final
        run: |
          set -euo pipefail
          chmod 0755 scripts/finalaudit.sh scripts/preparepdffonts.sh scripts/runmigrations.sh scripts/packagerelease.sh scripts/verifyrelease.sh
          scripts/preparepdffonts.sh
          scripts/runmigrations.sh

      - name: Run full system acceptance
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: gojet_final
        run: bash scripts/finalaudit.sh

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v502fullsystemevidence
          path: |
            frontend/test-results
            frontend/playwright-report
            dist/*.zip.sha256
          if-no-files-found: ignore
          retention-days: 14
