name: GoJet Product Surface Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'rebuild/v5.0.2-auth-i18n-product-copy'
      - 'rebuild/v5.0.3-final'

concurrency:
  group: gojetproductsurface${{ github.ref }}
  cancel-in-progress: true

jobs:
  productsurface:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gojet_surface
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Normalize Ubuntu package sources
        run: bash scripts/aptstable.sh

      - name: Install runtime acceptance dependencies
        run: |
          set -euo pipefail
          sudo apt-get install -y default-mysql-client nginx poppler-utils zbar-tools python3-fonttools
          cd frontend
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium

      - name: Validate repository and backend runtime
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: gojet_surface
        run: |
          set -euo pipefail
          python3 scripts/checknames.py
          python3 scripts/checkschema.py
          node --check tests/e2e/socialauthsettings.spec.js
          chmod 0755 scripts/preparepdffonts.sh
          scripts/preparepdffonts.sh
          bash scripts/runmigrations.sh
          go test ./...
          go vet ./...

      - name: Verify canonical V5 product surfaces
        working-directory: frontend
        run: |
          set -euo pipefail
          pnpm check

      - name: Run final website browser acceptance
        working-directory: frontend
        run: pnpm test:site-final

      - name: Run authentication and product shell browser acceptance
        working-directory: frontend
        run: |
          set -euo pipefail
          pnpm test:shells
          pnpm test:auth
          pnpm test:account
          pnpm test:admin
          pnpm test:workspace
          pnpm test:docs

      - name: Validate production release payload uses V5 applications
        run: |
          set -euo pipefail
          sh -n scripts/packagerelease.sh
          grep -Fq 'frontend/apps/site/dist' scripts/packagerelease.sh
          grep -Fq 'frontend/apps/workspace/dist' scripts/packagerelease.sh
          grep -Fq 'frontend/apps/admin/dist' scripts/packagerelease.sh
          grep -Fq 'frontend/apps/docs/dist' scripts/packagerelease.sh
          grep -Fq 'public/legal/privacy/index.html' scripts/packagerelease.sh
          grep -Fq 'public/zh-CN/legal/privacy/index.html' scripts/verifyrelease.sh
          for config in deploy/nginx/gojet.conf deploy/nginx/gojethost.conf deploy/nginx/gojetnative.conf deploy/nginx/gojetbtrewrite.conf; do
            grep -Fq 'try_files $uri $uri.html $uri/index.html' "$config"
          done

      - name: Reject retired visible and CI contracts
        run: |
          set -euo pipefail
          forbidden='playwright install --with'
          forbidden+='-deps'
          if grep -R -n -F "$forbidden" .github/workflows; then
            echo 'Playwright is not allowed to invoke apt implicitly. Use browser-only installation after controlled package setup.' >&2
            exit 1
          fi
          if grep -R -n -E 'frontend/(publicsite|userconsole|adminconsole)' scripts/packagerelease.sh; then
            echo 'legacy frontend entered the production release packager' >&2
            exit 1
          fi

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gojetv5productsurfaceevidence
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14
