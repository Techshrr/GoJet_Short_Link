name: GoJet Product Surface Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'rebuild/v4-rc12-real-install-fixes'

concurrency:
  group: gojetproductsurface${{ github.ref }}
  cancel-in-progress: true

jobs:
  productsurface:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env: {MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: gojet_surface}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: false}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packagelock.json

      - name: Enforce repository naming policy
        run: python3 scripts/checknames.py

      - name: Install browser and runtime dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y default-mysql-client nginx poppler-utils zbar-tools python3-fonttools
          bash scripts/npmci.sh
          npx playwright install --with-deps chromium

      - name: Prepare PDF font resources
        run: |
          set -euo pipefail
          chmod 0755 scripts/preparepdffonts.sh
          scripts/preparepdffonts.sh
          go mod download

      - name: Build canonical public site and validate runtime sources
        run: |
          set -euo pipefail
          python3 scripts/buildpublicsite.py --output /tmp/gojetpublicbuild
          test -f /tmp/gojetpublicbuild/index.html
          test -f /tmp/gojetpublicbuild/privacy.html
          test -f /tmp/gojetpublicbuild/terms.html
          test -f /tmp/gojetpublicbuild/forgotpassword.html
          test -f /tmp/gojetpublicbuild/reportabuse.html
          test -f /tmp/gojetpublicbuild/products/urlshortener.html
          test -z "$(find /tmp/gojetpublicbuild -mindepth 2 -type f -name index.html -print -quit)"
          test ! -e frontend/marketingsite
          test ! -e scripts/rebuildmarketingpages.py
          test ! -e scripts/rebuildpublicproductpages.py
          test ! -e frontend/adminconsole/settingsfull.js
          test -z "$(find frontend/publicsite/pages -type f -name index.html -print -quit)"
          RUNTIME_PATHS='frontend/publicsite frontend/adminconsole frontend/userconsole services/platformapi/cmd/server'
          VERSION_QUERY='?'
          VERSION_QUERY+='v='
          if grep -R -I -n -F "$VERSION_QUERY" $RUNTIME_PATHS --include='*.js' --include='*.html' --include='*.go' --exclude='*_test.go'; then
            echo 'static asset version query leaked into canonical runtime source' >&2
            exit 1
          fi
          if grep -R -n -E '/system-images/|SYSTEM_IMAGE_PATH|data/system/images' $RUNTIME_PATHS --include='*.js' --include='*.html' --include='*.go' --exclude='*_test.go'; then
            echo 'retired system image namespace leaked into canonical runtime source' >&2
            exit 1
          fi
          node --check frontend/publicsite/assets/app.js
          node --check frontend/publicsite/assets/fileshare.js
          node --check frontend/adminconsole/settings.js
          for file in frontend/userconsole/pages.js frontend/userconsole/router.js frontend/userconsole/links.js frontend/userconsole/bio.js frontend/userconsole/domains.js frontend/userconsole/analytics.js frontend/userconsole/files.js frontend/userconsole/team.js frontend/userconsole/organization.js frontend/userconsole/billing.js frontend/userconsole/support.js; do
            node --check "$file"
          done
          if grep -R -n --include='*.js' 'GoJetProductHardening' frontend/userconsole; then
            echo 'retired customer console page registry detected' >&2
            exit 1
          fi
          node --check tests/e2e/productsurface.spec.js
          node --check tests/e2e/fullsurfaceconsistency.spec.js
          python3 -m py_compile tests/integration/assertpdfcontrast.py

      - name: Run source level tests
        run: |
          set -euo pipefail
          bash tests/integration/releasestoragenamespaces.sh
          go test ./...
          go vet ./...

      - name: Apply fresh schema and build runtime services
        env: {MYSQL_PWD: root}
        run: |
          set -euo pipefail
          for f in database/migrations/*.sql; do mysql -h127.0.0.1 -P3306 -uroot gojet_surface < "$f"; done
          mkdir -p /tmp/gojetsurface/{uploads,files,brand,generated/qr,bin}
          go build -o /tmp/gojetsurface/bin/platformapi ./services/platformapi/cmd/server
          go build -o /tmp/gojetsurface/bin/redirectengine ./services/redirectengine/cmd/server
          go build -o /tmp/gojetsurface/bin/analyticsworker ./services/analyticsworker/cmd/worker

      - name: Start backend and analytics services
        run: |
          set -euo pipefail
          SETTINGS_KEY=$(python3 - <<'PY'
          import base64
          print(base64.b64encode(bytes(range(32))).decode())
          PY
          )
          QR_KEY='9c2f6b3a8d7e4f10b5a1c9d8e7f6a5b49c2f6b3a8d7e4f10b5a1c9d8e7f6a5b4'
          env MYSQL_DSN='root:root@tcp(127.0.0.1:3306)/gojet_surface?parseTime=true&multiStatements=true' REDIS_ADDRESS='127.0.0.1:6379' SETTINGS_ENCRYPTION_KEY="$SETTINGS_KEY" ADMIN_BOOTSTRAP_EMAIL='owner@example.test' ADMIN_BOOTSTRAP_PASSWORD='OwnerPassword!2026' QR_TRACKING_KEY="$QR_KEY" PUBLIC_BASE_URL='http://127.0.0.1:4180' PLATFORM_HTTP_ADDRESS='127.0.0.1:18090' UPLOAD_STORAGE_PATH='/tmp/gojetsurface/uploads' BRAND_ASSET_PATH='/tmp/gojetsurface/brand' GENERATED_QR_STORAGE_PATH='/tmp/gojetsurface/generated/qr' FILE_STORAGE_PATH='/tmp/gojetsurface/files' PDF_FONT_PATH="$GITHUB_WORKSPACE/resources/fonts/NotoSansSC-Regular.ttf" /tmp/gojetsurface/bin/platformapi >/tmp/gojetsurface/platformapi.log 2>&1 &
          echo $! >/tmp/gojetsurface/platformapi.pid
          env REDIS_ADDRESS='127.0.0.1:6379' HTTP_ADDRESS='127.0.0.1:18080' VISITOR_HASH_KEY='productsurfacevisitorkey2026' QR_TRACKING_KEY="$QR_KEY" /tmp/gojetsurface/bin/redirectengine >/tmp/gojetsurface/redirectengine.log 2>&1 &
          echo $! >/tmp/gojetsurface/redirectengine.pid
          env MYSQL_DSN='root:root@tcp(127.0.0.1:3306)/gojet_surface?parseTime=true&multiStatements=true' REDIS_ADDRESS='127.0.0.1:6379' ANALYTICS_GROUP='gojetsurface' ANALYTICS_CONSUMER='browsersurface' /tmp/gojetsurface/bin/analyticsworker >/tmp/gojetsurface/analyticsworker.log 2>&1 &
          echo $! >/tmp/gojetsurface/analyticsworker.pid
          for port in 18090 18080; do
            for i in $(seq 1 60); do
              curl -fsS "http://127.0.0.1:$port/health" >/dev/null 2>&1 && break
              sleep 1
              test "$i" -lt 60
            done
          done

      - name: Serve product through Nginx
        run: |
          set -euo pipefail
          rm -rf /tmp/gojetweb
          mkdir -p /tmp/gojetweb/app /tmp/gojetweb/admin
          cp -a /tmp/gojetpublicbuild/. /tmp/gojetweb/
          cp -a frontend/userconsole/. /tmp/gojetweb/app/
          cp -a frontend/adminconsole/. /tmp/gojetweb/admin/
          sudo rm -f /etc/nginx/sites-enabled/default /etc/nginx/conf.d/default.conf
          cat >/tmp/gojetsurfacenginx.conf <<'NGINX'
          server {
            listen 4180;
            server_name 127.0.0.1 localhost;
            root /tmp/gojetweb;
            index index.html;
            client_max_body_size 110m;
            location ^~ /api/ { proxy_pass http://127.0.0.1:18090; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
            location ^~ /assets/images/ { alias /tmp/gojetsurface/brand/; autoindex off; add_header Cache-Control 'public, max-age=60'; }
            location ^~ /generated/qr/ { alias /tmp/gojetsurface/generated/qr/; autoindex off; add_header Cache-Control 'public, max-age=60'; }
            location = /app { return 302 /app/; }
            location ^~ /app/ { try_files $uri $uri/ /app/index.html; }
            location = /admin { return 302 /admin/; }
            location ^~ /admin/ { try_files $uri $uri/ /admin/index.html; }
            location / { try_files $uri $uri.html @redirect; }
            location @redirect { proxy_pass http://127.0.0.1:18080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
          }
          NGINX
          sudo cp /tmp/gojetsurfacenginx.conf /etc/nginx/conf.d/gojetsurface.conf
          sudo nginx -t
          sudo nginx
          for path in / /privacy /terms /forgotpassword /reportabuse /products/urlshortener; do
            curl -fsS "http://127.0.0.1:4180$path" >/dev/null
          done

      - name: Run browser product surface acceptance
        env: {GOJET_SURFACE_BASE: 'http://127.0.0.1:4180'}
        run: npx playwright test productsurface.spec.js fullsurfaceconsistency.spec.js --config=tests/e2e/playwright.surface.config.js --project=chromium

      - name: Run invoice PDF visual contrast acceptance
        env: {GOJET_TEST_BASE: 'http://127.0.0.1:18090', MYSQL_HOST: '127.0.0.1', MYSQL_PORT: '3306', MYSQL_USER: root, MYSQL_PASSWORD: root, MYSQL_DATABASE: gojet_surface}
        run: |
          bash tests/integration/invoicepdfrender.sh
          python3 tests/integration/assertpdfcontrast.py /tmp/gojet-pdf-acceptance/invoice-pixels.ppm

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo '===== platformapi ====='; cat /tmp/gojetsurface/platformapi.log 2>/dev/null || true
          echo '===== redirectengine ====='; cat /tmp/gojetsurface/redirectengine.log 2>/dev/null || true
          echo '===== analyticsworker ====='; cat /tmp/gojetsurface/analyticsworker.log 2>/dev/null || true
          echo '===== nginx error ====='; sudo cat /var/log/nginx/error.log 2>/dev/null || true
          find /tmp/gojetsurface -maxdepth 4 -type f -printf '%M %u:%g %p\n' 2>/dev/null | sort || true

      - name: Upload browser and PDF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gojetproductsurfaceevidence
          path: |
            test-results/
            /tmp/gojet-pdf-acceptance/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop runtime services
        if: always()
        run: |
          sudo nginx -s stop 2>/dev/null || true
          for name in platformapi redirectengine analyticsworker; do
            test ! -f "/tmp/gojetsurface/$name.pid" || kill "$(cat "/tmp/gojetsurface/$name.pid")" 2>/dev/null || true
          done
