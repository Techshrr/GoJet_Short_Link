name: GoJet Release Package Gate

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/v4-rc12-real-install-fixes
    paths:
      - '.github/workflows/release-package.yml'
      - 'scripts/package-release.sh'
      - 'scripts/verify-release.sh'
      - 'scripts/build-public-site.py'
      - 'deploy/**'
      - 'docs/**'
      - 'frontend/**'
      - 'services/**'
      - 'app/**'
      - 'database/**'
      - 'tests/integration/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

concurrency:
  group: gojet-release-package-${{ github.ref }}
  cancel-in-progress: true

env:
  GOJET_RELEASE_VERSION: 4.0.0-rc.12

jobs:
  package:
    name: Production package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install release build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-fonttools
          python3 - <<'PY'
          from fontTools import subset
          print('FontTools ready')
          PY

      - name: Validate release source
        run: |
          set -euo pipefail
          sh -n scripts/package-release.sh
          sh -n scripts/verify-release.sh
          python3 -m py_compile scripts/build-public-site.py
          go test ./...
          go vet ./...

      - name: Build production archive
        run: |
          set -euo pipefail
          ./scripts/package-release.sh "$GOJET_RELEASE_VERSION"
          ZIP=$(find dist -maxdepth 1 -type f -name "*${GOJET_RELEASE_VERSION}*linux-production.zip" | head -1)
          test -n "$ZIP"
          printf '%s\n' "$ZIP" | tee /tmp/gojet-release-zip

      - name: Verify archive independently
        run: |
          set -euo pipefail
          ZIP=$(cat /tmp/gojet-release-zip)
          sh scripts/verify-release.sh "$ZIP"
          unzip -tq "$ZIP"
          test -f "$ZIP.sha256"
          (cd "$(dirname "$ZIP")" && sha256sum -c "$(basename "$ZIP.sha256")")

      - name: Inspect production payload
        run: |
          set -euo pipefail
          ZIP=$(cat /tmp/gojet-release-zip)
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          unzip -q "$ZIP" -d "$TMP"
          ROOT=$(find "$TMP" -mindepth 1 -maxdepth 1 -type d | head -1)
          test -n "$ROOT"
          test "$(cat "$ROOT/VERSION")" = "$GOJET_RELEASE_VERSION"
          grep -Fxq 'FRESH_INSTALL_ONLY=1' "$ROOT/FRESH_INSTALL_ONLY"
          for binary in redirect-engine analytics-worker analytics-reconciler platform-api mail-worker file-worker operations-monitor log-receiver; do
            test -x "$ROOT/bin/$binary"
            file "$ROOT/bin/$binary" | grep -Eq 'ELF 64-bit.*x86-64'
          done
          test "$(find "$ROOT/bin" -maxdepth 1 -type f | wc -l)" -eq 8
          test -f "$ROOT/public/index.html"
          test -f "$ROOT/public/app/index.html"
          test -f "$ROOT/public/admin/index.html"
          test -d "$ROOT/public/assets/images"
          test -d "$ROOT/public/generated/qr"
          test ! -e "$ROOT/tests"
          test ! -e "$ROOT/frontend"
          test ! -e "$ROOT/system-images"
          if grep -R -n -E 'frontend/marketing-site|system-images|compose\.release\.yaml|\bGoJet V4\b|\bRC[0-9]+\b|product-hardening|hardening-release' "$ROOT" --exclude='*.map' --exclude=verify-release.sh; then
            echo 'retired engineering/runtime terminology leaked into release package' >&2
            exit 1
          fi

      - name: Write immutable build evidence
        run: |
          set -euo pipefail
          ZIP=$(cat /tmp/gojet-release-zip)
          {
            echo "tested_sha=$GITHUB_SHA"
            echo "version=$GOJET_RELEASE_VERSION"
            echo "archive=$(basename "$ZIP")"
            echo "size_bytes=$(wc -c < "$ZIP")"
            echo "sha256=$(sha256sum "$ZIP" | awk '{print $1}')"
          } | tee dist/RELEASE-EVIDENCE.txt

      - name: Upload tested release package
        uses: actions/upload-artifact@v4
        with:
          name: gojet-release-package-${{ github.sha }}
          path: |
            dist/*${{ env.GOJET_RELEASE_VERSION }}*linux-production.zip
            dist/*${{ env.GOJET_RELEASE_VERSION }}*linux-production.zip.sha256
            dist/RELEASE-EVIDENCE.txt
          if-no-files-found: error
          retention-days: 14

  fresh-install-candidate:
    name: Fresh install candidate
    needs: package
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gojet_candidate
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=30

    steps:
      - name: Checkout acceptance harness
        uses: actions/checkout@v4

      - name: Install candidate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client zbar-tools unzip file nginx

      - name: Download package from this exact workflow run
        uses: actions/download-artifact@v4
        with:
          name: gojet-release-package-${{ github.sha }}
          path: /tmp/gojet-package-artifact

      - name: Verify evidence and unpack candidate
        run: |
          set -euo pipefail
          ART=/tmp/gojet-package-artifact
          EVIDENCE="$ART/RELEASE-EVIDENCE.txt"
          ZIP=$(find "$ART" -maxdepth 1 -type f -name "*${GOJET_RELEASE_VERSION}*linux-production.zip" | head -1)
          test -f "$EVIDENCE"
          test -n "$ZIP" -a -f "$ZIP" -a -f "$ZIP.sha256"
          grep -Fxq "tested_sha=$GITHUB_SHA" "$EVIDENCE"
          grep -Fxq "version=$GOJET_RELEASE_VERSION" "$EVIDENCE"
          grep -Fxq "archive=$(basename "$ZIP")" "$EVIDENCE"
          (cd "$ART" && sha256sum -c "$(basename "$ZIP.sha256")")
          unzip -tq "$ZIP"
          rm -rf /tmp/gojet-candidate-root
          mkdir -p /tmp/gojet-candidate-root
          unzip -q "$ZIP" -d /tmp/gojet-candidate-root
          ROOT=$(find /tmp/gojet-candidate-root -mindepth 1 -maxdepth 1 -type d | head -1)
          test -n "$ROOT"
          printf '%s\n' "$ROOT" >/tmp/gojet-candidate-root-path
          test "$(cat "$ROOT/VERSION")" = "$GOJET_RELEASE_VERSION"
          grep -Fxq 'FRESH_INSTALL_ONLY=1' "$ROOT/FRESH_INSTALL_ONLY"
          test "$(find "$ROOT/bin" -maxdepth 1 -type f | wc -l)" -eq 8
          for binary in redirect-engine analytics-worker analytics-reconciler platform-api mail-worker file-worker operations-monitor log-receiver; do
            test -x "$ROOT/bin/$binary"
          done
          test -f "$ROOT/public/index.html"
          test -f "$ROOT/public/app/index.html"
          test -f "$ROOT/public/admin/index.html"
          test -d "$ROOT/public/assets/images"
          test -d "$ROOT/public/generated/qr"

      - name: Apply packaged migrations to a fresh database
        env:
          MYSQL_PWD: root
        run: |
          set -euo pipefail
          ROOT=$(cat /tmp/gojet-candidate-root-path)
          for f in "$ROOT"/database/migrations/*.sql; do
            echo "Applying $(basename "$f")"
            mysql -h127.0.0.1 -P3306 -uroot gojet_candidate < "$f"
          done
          mysql -h127.0.0.1 -P3306 -uroot gojet_candidate -N -B <<'SQL' >/tmp/gojet-candidate-schema
          SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='gojet_candidate' AND TABLE_NAME='support_tickets';
          SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='gojet_candidate' AND TABLE_NAME='payment_transactions';
          SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='gojet_candidate' AND TABLE_NAME='fx_rate_cache';
          SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='gojet_candidate' AND TABLE_NAME='file_shares' AND COLUMN_NAME='password_hash';
          SELECT COUNT(*) FROM system_settings WHERE setting_key IN ('turnstile.enabled','turnstile.registration','turnstile.login','turnstile.forgot_password','turnstile.reset_password','turnstile.ticket_create','turnstile.ticket_reply','turnstile.abuse_report');
          SQL
          mapfile -t schema </tmp/gojet-candidate-schema
          test "${schema[0]}" = 1
          test "${schema[1]}" = 1
          test "${schema[2]}" = 1
          test "${schema[3]}" = 1
          test "${schema[4]}" = 8

      - name: Start exact packaged runtime
        run: |
          set -euo pipefail
          ROOT=$(cat /tmp/gojet-candidate-root-path)
          mkdir -p /tmp/gojet-candidate/uploads /tmp/gojet-candidate/files /tmp/gojet-candidate/brand /tmp/gojet-candidate/generated/qr /tmp/gojet
          SETTINGS_KEY=$(python3 - <<'PY'
          import base64
          print(base64.b64encode(bytes(range(32))).decode())
          PY
          )
          printf 'SETTINGS_ENCRYPTION_KEY=%s\n' "$SETTINGS_KEY" >/tmp/gojet/test-env
          cp "$ROOT/bin/mail-worker" /tmp/gojet/mail-worker
          chmod 0755 /tmp/gojet/mail-worker
          env \
            MYSQL_DSN='root:root@tcp(127.0.0.1:3306)/gojet_candidate?parseTime=true&multiStatements=true' \
            REDIS_ADDRESS='127.0.0.1:6379' \
            SETTINGS_ENCRYPTION_KEY="$SETTINGS_KEY" \
            ADMIN_BOOTSTRAP_EMAIL='owner@example.test' \
            ADMIN_BOOTSTRAP_PASSWORD='OwnerPassword!2026' \
            QR_TRACKING_KEY='fresh-candidate-qr-key-2026' \
            PUBLIC_BASE_URL='http://127.0.0.1:18080' \
            PLATFORM_HTTP_ADDRESS='127.0.0.1:18090' \
            UPLOAD_STORAGE_PATH='/tmp/gojet-candidate/uploads' \
            BRAND_ASSET_PATH='/tmp/gojet-candidate/brand' \
            GENERATED_QR_STORAGE_PATH='/tmp/gojet-candidate/generated/qr' \
            FILE_STORAGE_PATH='/tmp/gojet-candidate/files' \
            "$ROOT/bin/platform-api" >/tmp/gojet-candidate-platform-api.log 2>&1 &
          echo $! >/tmp/gojet-candidate-platform-api.pid
          env \
            REDIS_ADDRESS='127.0.0.1:6379' \
            HTTP_ADDRESS='127.0.0.1:18080' \
            VISITOR_HASH_KEY='fresh-candidate-visitor-key-2026' \
            QR_TRACKING_KEY='fresh-candidate-qr-key-2026' \
            "$ROOT/bin/redirect-engine" >/tmp/gojet-candidate-redirect-engine.log 2>&1 &
          echo $! >/tmp/gojet-candidate-redirect-engine.pid
          env \
            MYSQL_DSN='root:root@tcp(127.0.0.1:3306)/gojet_candidate?parseTime=true&multiStatements=true' \
            REDIS_ADDRESS='127.0.0.1:6379' \
            ANALYTICS_GROUP='gojet-mysql' \
            ANALYTICS_CONSUMER='fresh-install-candidate' \
            "$ROOT/bin/analytics-worker" >/tmp/gojet-candidate-analytics-worker.log 2>&1 &
          echo $! >/tmp/gojet-candidate-analytics-worker.pid
          for port in 18090 18080; do
            for i in $(seq 1 60); do
              curl -fsS "http://127.0.0.1:$port/health" >/dev/null 2>&1 && break
              sleep 1
              test "$i" -lt 60
            done
          done

      - name: Run packaged P0 acceptance
        env:
          GOJET_TEST_BASE: http://127.0.0.1:18090
          GOJET_PUBLIC_BASE: http://127.0.0.1:18080
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: gojet_candidate
          REDIS_ADDRESS: 127.0.0.1:6379
          UPLOAD_STORAGE_PATH: /tmp/gojet-candidate/uploads
          BRAND_ASSET_PATH: /tmp/gojet-candidate/brand
          GENERATED_QR_STORAGE_PATH: /tmp/gojet-candidate/generated/qr
          FILE_STORAGE_PATH: /tmp/gojet-candidate/files
        run: |
          set -euo pipefail
          bash tests/integration/product-rebuild-api.sh
          bash tests/integration/admin-permission-boundary.sh
          bash tests/integration/admin-link-lifecycle.sh
          bash tests/integration/settings-roundtrip.sh
          bash tests/integration/qr-real-e2e.sh
          bash tests/integration/file-share-lifecycle.sh
          bash tests/integration/brand-logo-lifecycle.sh
          bash tests/integration/mail-lifecycle-smtp.sh
          bash tests/integration/billing-payment-conflict.sh
          bash tests/integration/billing-fx-freeze.sh

      - name: Candidate diagnostics
        if: failure()
        run: |
          echo '===== platform-api ====='
          cat /tmp/gojet-candidate-platform-api.log 2>/dev/null || true
          echo '===== redirect-engine ====='
          cat /tmp/gojet-candidate-redirect-engine.log 2>/dev/null || true
          echo '===== analytics-worker ====='
          cat /tmp/gojet-candidate-analytics-worker.log 2>/dev/null || true

      - name: Stop candidate services
        if: always()
        run: |
          for pidfile in /tmp/gojet-candidate-platform-api.pid /tmp/gojet-candidate-redirect-engine.pid /tmp/gojet-candidate-analytics-worker.pid; do
            if [ -f "$pidfile" ]; then kill "$(cat "$pidfile")" 2>/dev/null || true; fi
          done
