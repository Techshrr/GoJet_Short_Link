name: V5 Lockfile Bootstrap

on:
  push:
    branches:
      - rebuild/v5-specification-rebuild
    paths:
      - '.github/workflows/v5-lockfile-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit generated lockfile
        run: |
          test -f pnpm-lock.yaml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'pnpm-lock.yaml already matches the workspace.'
            exit 0
          fi
          git commit -m 'chore(v5): lock frontend dependencies'
          git push origin "HEAD:${GITHUB_REF_NAME}"
