name: V4 product rebuild validation

on:
  push:
    branches:
      - 'rebuild/v4-product'
    paths-ignore:
      - 'scripts/v4-candidate-gate-*.trigger'
  pull_request:

concurrency:
  group: v4-product-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: PHP installer syntax
        run: |
          php -l installer/index.php
          php -l public/install/index.php
      - name: Shell and frontend syntax
        run: |
          bash -n install.sh
          bash -n install-native-lemp.sh
          bash -n launch-web-installer.sh
          bash -n scripts/native-installer-apply.sh
          bash -n scripts/install-docker.sh
          sh -n scripts/package-release.sh
          node --check frontend/admin-console/app.js
          node --check frontend/user-console/app.js
          node --check frontend/user-console/auth-guard.js
          node --check frontend/marketing-site/assets/auth.js
      - name: Fresh install release policy
        run: |
          grep -Fq 'FRESH_INSTALL_ONLY=1' scripts/package-release.sh
          ! grep -Fq '"$ROOT/upgrade-native.sh"' scripts/package-release.sh
          ! grep -Fq '"$ROOT/upgrade.sh"' scripts/package-release.sh
          grep -Fq '只支持全新安装' docs/v4-product-rebuild.zh-CN.md
      - name: Product rebuild regression checks
        run: |
          grep -Fq 'CREATE TABLE administrator_permissions' database/migrations/015_admin_identity.sql
          grep -Fq 'AllowedAdministrator' app/adminauth/service.go
          grep -Fq 'return s.admin(permission, next)' services/platform-api/cmd/server/admin_identity.go
          test ! -e database/migrations/026_admin_step_up_session.sql
          ! grep -R -Fq 'settingsMutationNeedsStepUp' services/platform-api/cmd/server
          grep -Fq 'POST /api/admin/users' services/platform-api/cmd/server/main.go
          grep -Fq 'DELETE /api/admin/users/{id}' services/platform-api/cmd/server/main.go
          grep -Fq 'POST /api/auth/forgot-password' services/platform-api/cmd/server/main.go
          grep -Fq 'PATCH /api/admin/announcements/{id}' services/platform-api/cmd/server/main.go
          grep -Fq 'adminRunReconciliationSimple' services/platform-api/cmd/server/main.go
          test ! -e frontend/admin-console/admin-settings-fix.js
          grep -Fq 'Markdown 正文' frontend/admin-console/app.js
          grep -Fq '添加用户' frontend/admin-console/app.js
          grep -Fq 'permissionGrid' frontend/admin-console/app.js
          ! grep -Fq 'step_up_required' frontend/admin-console/app.js
          test -f frontend/marketing-site/login/index.html
          test -f frontend/marketing-site/register/index.html
          test -f frontend/marketing-site/forgot-password/index.html
          test -f frontend/marketing-site/reset-password/index.html
          test -f frontend/marketing-site/verify-email/index.html
          grep -Fq 'location = /login' deploy/nginx/gojet-bt-rewrite.conf
          grep -Fq 'location ^~ /uploads/' deploy/nginx/gojet-bt-rewrite.conf
          ! sed -n '/location \^~ \/uploads\//,/^}/p' deploy/nginx/gojet-bt-rewrite.conf | grep -Fq 'try_files'
      - name: Go test and vet
        run: |
          go test ./...
          go vet ./...
      - name: Build all production services
        run: |
          CGO_ENABLED=0 go build ./services/redirect-engine/cmd/server
          CGO_ENABLED=0 go build ./services/analytics-worker/cmd/worker
          CGO_ENABLED=0 go build ./services/analytics-reconciler/cmd/reconciler
          CGO_ENABLED=0 go build ./services/platform-api/cmd/server
          CGO_ENABLED=0 go build ./services/platform-api/cmd/mail-worker
          CGO_ENABLED=0 go build ./services/platform-api/cmd/file-worker
          CGO_ENABLED=0 go build ./services/platform-api/cmd/operations-monitor
          CGO_ENABLED=0 go build ./services/log-receiver/cmd/server
