name: V4 product hardening validation

on:
  push:
    branches:
      - 'rebuild/v4-product-hardening'
    paths-ignore:
      - 'scripts/v4-candidate-gate-*.trigger'
      - 'docs/v4-fullstack.trigger'
      - 'docs/v4-browser.trigger'
  pull_request:

concurrency:
  group: v4-product-hardening-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: PHP installer syntax
        run: |
          php -l installer/index.php
          php -l public/install/index.php
      - name: Shell and frontend syntax
        run: |
          bash -n install.sh
          bash -n install-native-lemp.sh
          bash -n launch-web-installer.sh
          bash -n scripts/native-installer-run.sh
          bash -n scripts/native-installer-apply.sh
          bash -n scripts/install-docker.sh
          sh -n scripts/package-release.sh
          for script in tests/integration/*.sh; do bash -n "$script"; done
          for js in \
            frontend/admin-console/app.js \
            frontend/admin-console/admin-smtp-status.js \
            frontend/admin-console/admin-mail-template-ui.js \
            frontend/admin-console/product-actions.js \
            frontend/admin-console/admin-hardening.js \
            frontend/admin-console/admin-settings-unified.js \
            frontend/admin-console/billing-fx-settings.js \
            frontend/admin-console/support-security.js \
            frontend/user-console/app.js \
            frontend/user-console/auth-guard.js \
            frontend/user-console/product-hardening.js \
            frontend/user-console/product-router.js \
            frontend/user-console/pending-link.js \
            frontend/user-console/link-hardening.js \
            frontend/user-console/file-hardening.js \
            frontend/user-console/bio-hardening.js \
            frontend/user-console/domain-hardening.js \
            frontend/user-console/analytics-hardening.js \
            frontend/user-console/team-hardening.js \
            frontend/user-console/organization-hardening.js \
            frontend/user-console/billing-hardening.js \
            frontend/marketing-site/assets/app.js \
            frontend/marketing-site/assets/auth.js \
            frontend/marketing-site/assets/home.js \
            frontend/marketing-site/assets/file-share.js \
            frontend/marketing-site/assets/announcements.js; do
            node --check "$js"
          done
          python3 -m py_compile scripts/rebuild-public-product-pages.py scripts/rebuild-marketing-pages.py
      - name: Generate canonical public pages
        run: |
          python3 scripts/rebuild-public-product-pages.py
          python3 scripts/rebuild-marketing-pages.py
      - name: Fresh install runtime integrity policy
        run: |
          grep -Fq 'FRESH_INSTALL_ONLY=1' scripts/package-release.sh
          grep -Fq 'stop_existing_services' scripts/native-installer-run.sh
          grep -Fq 'information_schema.tables' scripts/native-installer-run.sh
          grep -Fq '/proc/$pid/exe' scripts/native-installer-run.sh
          grep -Fq 'totp_enabled' scripts/native-installer-run.sh
          grep -Fq 'native-installer-run.sh' deploy/native/gojet-installer.service
          grep -Fq 'reenable_installer_path' scripts/native-installer-run.sh
          if grep -Fq '"$ROOT/upgrade-native.sh"' scripts/package-release.sh; then exit 1; fi
          if grep -Fq '"$ROOT/upgrade.sh"' scripts/package-release.sh; then exit 1; fi
      - name: Product hardening regression checks
        run: |
          set -euo pipefail
          check_file() {
            local path=$1
            test -f "$path" || { echo "missing required hardening file: $path" >&2; exit 1; }
          }
          check_text() {
            local needle=$1 path=$2 label=$3
            grep -Fq "$needle" "$path" || { echo "regression check failed: $label — $path does not contain [$needle]" >&2; exit 1; }
          }
          for path in \
            docs/V4_PRODUCT_HARDENING_AUDIT.md \
            frontend/shared/gojet-design-system.css \
            frontend/user-console/shell-hardening.css \
            frontend/user-console/link-hardening.js \
            frontend/user-console/file-hardening.js \
            frontend/user-console/bio-hardening.js \
            frontend/user-console/domain-hardening.js \
            frontend/user-console/analytics-hardening.js \
            frontend/user-console/team-hardening.js \
            frontend/user-console/organization-hardening.js \
            frontend/user-console/billing-hardening.js \
            frontend/admin-console/admin-settings-unified.js \
            frontend/admin-console/admin-smtp-status.js \
            frontend/admin-console/admin-mail-template-ui.js \
            frontend/admin-console/admin-brand-unified.css \
            frontend/marketing-site/assets/app.js \
            frontend/marketing-site/assets/product-brand.css \
            frontend/marketing-site/privacy/index.html \
            frontend/marketing-site/terms/index.html \
            database/migrations/028_file_share_password.sql \
            database/migrations/029_payment_transactions.sql \
            database/migrations/030_fx_and_mail_lifecycle.sql \
            database/migrations/031_account_workspace_mail_events.sql \
            database/migrations/034_mail_brand_fragments.sql \
            services/platform-api/cmd/server/mail_templates.go \
            app/payments/service.go \
            app/billing/pdf.go \
            tests/integration/settings-roundtrip.sh \
            tests/integration/qr-real-e2e.sh \
            tests/integration/file-share-lifecycle.sh \
            tests/integration/billing-payment-conflict.sh \
            tests/integration/billing-fx-freeze.sh \
            tests/integration/mail-lifecycle-smtp.sh \
            tests/integration/brand-logo-lifecycle.sh; do
            check_file "$path"
          done
          check_text 'const publicURL=' frontend/user-console/link-hardening.js 'public link URL builder'
          check_text '/f/' frontend/user-console/file-hardening.js 'public file route'
          check_text '文件访问密码' services/platform-api/cmd/server/resources.go 'file password API'
          check_text 'OpenDownloadWithPassword' app/resources/file_public.go 'file password service'
          check_text 'X-GoJet-Public-File-Page' deploy/nginx/gojet-bt-rewrite.conf 'aaPanel file routing marker'
          check_text '/system-images/' deploy/nginx/gojet-bt-rewrite.conf 'isolated system-image route'
          check_text '/generated/qr/' deploy/nginx/gojet-bt-rewrite.conf 'isolated generated QR route'
          check_text 'SYSTEM_IMAGE_PATH' deploy/native/gojet@.service 'native system image path'
          check_text 'renderSafeMarkdown' services/platform-api/cmd/server/text_render.go 'safe Markdown renderer'
          check_text '手机预览' frontend/user-console/bio-hardening.js 'mobile bio preview'
          check_text '重新生成验证记录' frontend/user-console/domain-hardening.js 'domain verification regeneration'
          check_text '二维码访问' frontend/user-console/analytics-hardening.js 'QR analytics Chinese copy'
          check_text '支付宝' frontend/admin-console/admin-settings-unified.js 'Alipay settings'
          check_text '微信支付' frontend/admin-console/admin-settings-unified.js 'WeChat Pay settings'
          check_text 'PayPal' frontend/admin-console/admin-settings-unified.js 'PayPal settings'
          check_text 'Stripe' frontend/admin-console/admin-settings-unified.js 'Stripe settings'
          check_text '发送中…' frontend/admin-console/admin-smtp-status.js 'SMTP in-flight state'
          check_text '这里只编辑邮件内容区' frontend/admin-console/admin-mail-template-ui.js 'fragment-aware mail template editor'
          check_text 'mailTemplateIsFragment' services/platform-api/cmd/server/mail_templates.go 'server-side mail fragment guard'
          check_text 'support_ticket_reply' database/migrations/034_mail_brand_fragments.sql 'support ticket mail fragment'
          check_text 'USD — 美元' frontend/admin-console/billing-fx-settings.js 'canonical USD FX base'
          check_text 'seo.sitemap' tests/integration/settings-roundtrip.sh 'settings sitemap round trip'
          check_text '/privacy/' frontend/marketing-site/assets/app.js 'privacy navigation'
          check_text '/terms/' frontend/marketing-site/assets/app.js 'terms navigation'
          check_text 'gojet-design-system.css' scripts/package-release.sh 'shared design system packaging'
          check_text '?v=$SAFE_VERSION' scripts/package-release.sh 'release asset versioning'
          check_text 'registerProductHardeningRoutes' services/platform-api/cmd/server/main.go 'product hardening routes'
          check_text 'registerBillingPresentationRoutes' services/platform-api/cmd/server/main.go 'billing presentation routes'
          check_text 'paymentCallback' services/platform-api/cmd/server/main.go 'payment callback maintenance bypass'
          check_text 'ApplyPayment' app/billing/payment.go 'billing payment application'
          check_text 'HandleWeChatNotification' app/payments/wechat.go 'WeChat callback'
          check_text 'HandleStripeWebhook' app/payments/stripe.go 'Stripe webhook'
          check_text 'HandlePayPalWebhook' app/payments/paypal.go 'PayPal webhook'
          check_text 'HandleAlipayNotification' app/payments/alipay.go 'Alipay callback'
          check_text 'HandleEPayNotification' app/payments/epay.go 'EPay callback'
          check_text 'Content-Type", "application/pdf' services/platform-api/cmd/server/billing_pdf.go 'invoice PDF response'
          check_text 'gojet_post_auth_path' frontend/marketing-site/assets/auth.js 'post-auth redirect'
          check_text 'redirect_status' app/links/json.go 'redirect status JSON'
          if grep -R -n -E 'Fresh Install|真实业务接口|不是前端演示数据|analytics_events|RBAC 权限模型|V4 平台 API|Redis Worker|file-worker' frontend/marketing-site --include='*.html'; then
            echo 'engineering/development copy leaked into public marketing HTML' >&2
            exit 1
          fi
          if grep -R -n -E 'adminStepUp|stepUpRequiredForPath|verifyAdminStepUp|step_up_required|X-GoJet-TOTP|settingsMutationNeedsStepUp' app services frontend/admin-console; then
            echo 'obsolete operation-level administrator step-up contract returned' >&2
            exit 1
          fi
      - name: Go test and vet
        run: |
          set -euo pipefail
          go test ./... 2>&1 | tee /tmp/go-test.log
          go vet ./... 2>&1 | tee /tmp/go-vet.log
      - name: Build all production services
        run: |
          set -euo pipefail
          for spec in \
            'redirect-engine ./services/redirect-engine/cmd/server' \
            'analytics-worker ./services/analytics-worker/cmd/worker' \
            'analytics-reconciler ./services/analytics-reconciler/cmd/reconciler' \
            'platform-api ./services/platform-api/cmd/server' \
            'mail-worker ./services/platform-api/cmd/mail-worker' \
            'file-worker ./services/platform-api/cmd/file-worker' \
            'operations-monitor ./services/platform-api/cmd/operations-monitor' \
            'log-receiver ./services/log-receiver/cmd/server'; do
            set -- $spec
            go build -o "/tmp/$1" "$2"
          done
