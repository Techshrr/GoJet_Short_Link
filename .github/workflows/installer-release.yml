name: Installer and release

on:
  push:
    branches:
      - 'fix/v4-standard-web-installer'
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: PHP installer syntax
        run: |
          php -l installer/index.php
          php -l public/install/index.php
      - name: Shell and admin JS syntax
        run: |
          bash -n install.sh
          bash -n install-native-lemp.sh
          bash -n launch-web-installer.sh
          bash -n upgrade-native.sh
          bash -n scripts/native-installer-apply.sh
          bash -n scripts/install-docker.sh
          sh -n scripts/package-release.sh
          node --check frontend/admin-console/app.js
          node --check frontend/admin-console/admin-settings-fix.js
      - name: Installer request encoding
        run: |
          encoded=$(php -r 'echo base64_encode("https://test.san6.cn");')
          line="PUBLIC_BASE_URL=$encoded"
          key=${line%%=*}
          payload=${line#*=}
          test "$key" = "PUBLIC_BASE_URL"
          test "$payload" = "$encoded"
          test "$(printf '%s' "$payload" | base64 -d)" = "https://test.san6.cn"
          ! grep -Fq "while IFS='=' read -r key encoded" scripts/native-installer-apply.sh
          grep -Fq 'encoded=${line#*=}' scripts/native-installer-apply.sh
      - name: Installer Bash parameter expansion
        run: |
          bash -u -c '
            declare -A cfg=([ADMIN_PASSWORD]="123456789012" [MYSQL_PASSWORD]="dbpass" [REDIS_PASSWORD]="")
            admin_password=${cfg[ADMIN_PASSWORD]}
            mysql_password=${cfg[MYSQL_PASSWORD]}
            redis_password=${cfg[REDIS_PASSWORD]-}
            test ${#admin_password} -eq 12
            test ${#mysql_password} -eq 6
            test ${#redis_password} -eq 0
          '
          ! grep -Fq '${#cfg[REDIS_PASSWORD]:-}' scripts/native-installer-apply.sh
          grep -Fq 'redis_password=${cfg[REDIS_PASSWORD]-}' scripts/native-installer-apply.sh
      - name: Admin RC7 regression checks
        run: |
          grep -Fq 'SELECT COALESCE(step_up_until > UTC_TIMESTAMP(), FALSE)' services/platform-api/cmd/server/admin_identity.go
          grep -Fq 'DATE_ADD(UTC_TIMESTAMP(),INTERVAL 10 MINUTE)' services/platform-api/cmd/server/admin_identity.go
          grep -Fq 'strings.HasPrefix(path, "/api/admin/settings/")' services/platform-api/cmd/server/admin_identity.go
          grep -Fq 'ConfigStrict' services/platform-api/cmd/server/settingscenter.go
          grep -Fq '正在从服务器读取当前设置' frontend/admin-console/admin-settings-fix.js
          grep -Fq 'SMTP 设置已保存，并已从数据库重新读取确认' frontend/admin-console/admin-settings-fix.js
          ! grep -Fq 'MutationObserver' frontend/admin-console/admin-settings-fix.js
          grep -Fq 'location ^~ /uploads/' deploy/nginx/gojet-bt-rewrite.conf
          ! sed -n '/location \^~ \/uploads\//,/^}/p' deploy/nginx/gojet-bt-rewrite.conf | grep -Fq 'try_files'
          grep -Fq '修复品牌资源目录和宝塔 Nginx 路由' upgrade-native.sh
          grep -Fq 'upgrade-native.sh' scripts/package-release.sh
      - name: Go test and vet
        run: |
          go test ./...
          go vet ./...
      - name: Build all production services
        run: |
          CGO_ENABLED=0 go build ./services/redirect-engine/cmd/server
          CGO_ENABLED=0 go build ./services/analytics-worker/cmd/worker
          CGO_ENABLED=0 go build ./services/analytics-reconciler/cmd/reconciler
          CGO_ENABLED=0 go build ./services/platform-api/cmd/server
          CGO_ENABLED=0 go build ./services/platform-api/cmd/mail-worker
          CGO_ENABLED=0 go build ./services/platform-api/cmd/file-worker
          CGO_ENABLED=0 go build ./services/platform-api/cmd/operations-monitor
          CGO_ENABLED=0 go build ./services/log-receiver/cmd/server
      - name: Build and verify RC7 package
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          ./scripts/package-release.sh 4.0.0-rc.7
          unzip -l dist/gojet-4.0.0-rc.7-linux-production.zip | grep 'public/install/index.php'
          unzip -l dist/gojet-4.0.0-rc.7-linux-production.zip | grep 'public/admin/admin-settings-fix.js'
          unzip -l dist/gojet-4.0.0-rc.7-linux-production.zip | grep 'database/migrations/026_admin_step_up_session.sql'
          unzip -l dist/gojet-4.0.0-rc.7-linux-production.zip | grep 'deploy/nginx/gojet-bt-rewrite.conf'
          unzip -l dist/gojet-4.0.0-rc.7-linux-production.zip | grep 'upgrade-native.sh'
      - name: Upload RC7 package
        uses: actions/upload-artifact@v4
        with:
          name: gojet-4.0.0-rc.7-linux-production
          path: |
            dist/gojet-4.0.0-rc.7-linux-production.zip
            dist/gojet-4.0.0-rc.7-linux-production.zip.sha256
          if-no-files-found: error
          retention-days: 7
