name: V4 product hardening validation

on:
  push:
    branches:
      - 'rebuild/v4-product-hardening'
    paths-ignore:
      - 'scripts/v4-candidate-gate-*.trigger'
      - 'docs/v4-fullstack.trigger'
      - 'docs/v4-browser.trigger'
  pull_request:

concurrency:
  group: v4-product-hardening-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: PHP installer syntax
        run: |
          php -l installer/index.php
          php -l public/install/index.php
      - name: Shell and frontend syntax
        run: |
          bash -n install.sh
          bash -n install-native-lemp.sh
          bash -n launch-web-installer.sh
          bash -n scripts/native-installer-run.sh
          bash -n scripts/native-installer-apply.sh
          bash -n scripts/install-docker.sh
          sh -n scripts/package-release.sh
          for script in tests/integration/*.sh; do bash -n "$script"; done
          for js in \
            frontend/admin-console/app.js \
            frontend/admin-console/product-actions.js \
            frontend/admin-console/admin-hardening.js \
            frontend/admin-console/admin-settings-unified.js \
            frontend/user-console/app.js \
            frontend/user-console/auth-guard.js \
            frontend/user-console/product-hardening.js \
            frontend/user-console/product-router.js \
            frontend/user-console/pending-link.js \
            frontend/user-console/link-hardening.js \
            frontend/user-console/file-hardening.js \
            frontend/user-console/bio-hardening.js \
            frontend/user-console/domain-hardening.js \
            frontend/user-console/analytics-hardening.js \
            frontend/user-console/team-hardening.js \
            frontend/user-console/organization-hardening.js \
            frontend/user-console/billing-hardening.js \
            frontend/marketing-site/assets/auth.js \
            frontend/marketing-site/assets/home.js \
            frontend/marketing-site/assets/file-share.js \
            frontend/marketing-site/assets/announcements.js; do
            node --check "$js"
          done
      - name: Fresh install runtime integrity policy
        run: |
          grep -Fq 'FRESH_INSTALL_ONLY=1' scripts/package-release.sh
          grep -Fq 'stop_existing_services' scripts/native-installer-run.sh
          grep -Fq 'information_schema.tables' scripts/native-installer-run.sh
          grep -Fq '/proc/$pid/exe' scripts/native-installer-run.sh
          grep -Fq 'totp_enabled' scripts/native-installer-run.sh
          grep -Fq 'native-installer-run.sh' deploy/native/gojet-installer.service
          grep -Fq 'reenable_installer_path' scripts/native-installer-run.sh
          if grep -Fq '"$ROOT/upgrade-native.sh"' scripts/package-release.sh; then exit 1; fi
          if grep -Fq '"$ROOT/upgrade.sh"' scripts/package-release.sh; then exit 1; fi
      - name: Product hardening regression checks
        run: |
          test -f docs/V4_PRODUCT_HARDENING_AUDIT.md
          test -f frontend/shared/gojet-design-system.css
          test -f frontend/user-console/shell-hardening.css
          test -f frontend/user-console/link-hardening.js
          test -f frontend/user-console/file-hardening.js
          test -f frontend/user-console/bio-hardening.js
          test -f frontend/user-console/domain-hardening.js
          test -f frontend/user-console/analytics-hardening.js
          test -f frontend/user-console/team-hardening.js
          test -f frontend/user-console/organization-hardening.js
          test -f frontend/user-console/billing-hardening.js
          test -f frontend/admin-console/admin-settings-unified.js
          test -f frontend/admin-console/admin-brand-unified.css
          test -f database/migrations/028_file_share_password.sql
          test -f database/migrations/029_payment_transactions.sql
          test -f database/migrations/030_fx_and_mail_lifecycle.sql
          test -f database/migrations/031_account_workspace_mail_events.sql
          test -f app/payments/service.go
          test -f app/billing/pdf.go
          test -f tests/integration/qr-real-e2e.sh
          test -f tests/integration/file-share-lifecycle.sh
          test -f tests/integration/billing-payment-conflict.sh
          test -f tests/integration/billing-fx-freeze.sh
          test -f tests/integration/mail-lifecycle-smtp.sh
          test -f tests/integration/brand-logo-lifecycle.sh
          grep -Fq '完整公开网址' frontend/user-console/link-hardening.js
          grep -Fq '/f/' frontend/user-console/file-hardening.js
          grep -Fq '文件访问密码' services/platform-api/cmd/server/resources.go
          grep -Fq 'OpenDownloadWithPassword' app/resources/file_public.go
          grep -Fq 'X-GoJet-Public-File-Page' deploy/nginx/gojet-bt-rewrite.conf
          grep -Fq 'renderSafeMarkdown' services/platform-api/cmd/server/text_render.go
          grep -Fq '手机实时预览' frontend/user-console/bio-hardening.js
          grep -Fq '重新生成 TXT' frontend/user-console/domain-hardening.js
          grep -Fq 'QR 扫码访问' frontend/user-console/analytics-hardening.js
          grep -Fq '支付宝' frontend/admin-console/admin-settings-unified.js
          grep -Fq '微信支付' frontend/admin-console/admin-settings-unified.js
          grep -Fq 'PayPal' frontend/admin-console/admin-settings-unified.js
          grep -Fq 'Stripe' frontend/admin-console/admin-settings-unified.js
          grep -Fq 'gojet-design-system.css' scripts/package-release.sh
          grep -Fq '?v=$SAFE_VERSION' scripts/package-release.sh
          grep -Fq 'registerProductHardeningRoutes' services/platform-api/cmd/server/main.go
          grep -Fq 'registerBillingPresentationRoutes' services/platform-api/cmd/server/main.go
          grep -Fq 'paymentCallback' services/platform-api/cmd/server/main.go
          grep -Fq 'ApplyPayment' app/billing/payment.go
          grep -Fq 'HandleWeChatNotification' app/payments/wechat.go
          grep -Fq 'HandleStripeWebhook' app/payments/stripe.go
          grep -Fq 'HandlePayPalWebhook' app/payments/paypal.go
          grep -Fq 'HandleAlipayNotification' app/payments/alipay.go
          grep -Fq 'HandleEPayNotification' app/payments/epay.go
          grep -Fq 'Content-Type", "application/pdf' services/platform-api/cmd/server/billing_pdf.go
          grep -Fq 'data-demo-tab="url"' frontend/marketing-site/index.html
          grep -Fq 'data-demo-tab="text"' frontend/marketing-site/index.html
          grep -Fq 'data-demo-tab="file"' frontend/marketing-site/index.html
          grep -Fq 'gojet_post_auth_path' frontend/marketing-site/assets/auth.js
          grep -Fq 'redirect_status' app/links/json.go
          if grep -R -n -E 'adminStepUp|stepUpRequiredForPath|verifyAdminStepUp|step_up_required|X-GoJet-TOTP|settingsMutationNeedsStepUp' app services frontend/admin-console; then
            echo 'obsolete operation-level administrator step-up contract returned' >&2
            exit 1
          fi
      - name: Go test and vet
        run: |
          set -euo pipefail
          go test ./... 2>&1 | tee /tmp/go-test.log
          go vet ./... 2>&1 | tee /tmp/go-vet.log
      - name: Build all production services
        run: |
          set -euo pipefail
          for spec in \
            'redirect-engine ./services/redirect-engine/cmd/server' \
            'analytics-worker ./services/analytics-worker/cmd/worker' \
            'analytics-reconciler ./services/analytics-reconciler/cmd/reconciler' \
            'platform-api ./services/platform-api/cmd/server' \
            'mail-worker ./services/platform-api/cmd/mail-worker' \
            'file-worker ./services/platform-api/cmd/file-worker' \
            'operations-monitor ./services/platform-api/cmd/operations-monitor' \
            'log-receiver ./services/log-receiver/cmd/server'; do
            set -- $spec
            go build -o "/tmp/$1" "$2"
          done
