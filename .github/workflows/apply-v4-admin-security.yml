name: Apply V4 administrator security boundary

on:
  push:
    branches:
      - 'rebuild/v4-product'
    paths:
      - 'scripts/v4-admin-security.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/v4-product
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply latest administrator security boundary
        run: |
          git fetch origin rebuild/v4-product
          git reset --hard origin/rebuild/v4-product
          python3 scripts/apply-v4-admin-security.py
          gofmt -w services/platform-api/cmd/server/admin_identity.go
          grep -Fq '只有超级管理员可以创建管理员账户' services/platform-api/cmd/server/admin_identity.go
          grep -Fq '只有超级管理员可以修改管理员权限或状态' services/platform-api/cmd/server/admin_identity.go
          go test ./...
          go vet ./...
      - name: Commit boundary
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'gojet-ci'
          git config user.email 'gojet-ci@users.noreply.github.com'
          git add services/platform-api/cmd/server/admin_identity.go
          git commit -m 'admin: restrict administrator mutations to super admins'
          git pull --rebase origin rebuild/v4-product
          git push origin HEAD:rebuild/v4-product
