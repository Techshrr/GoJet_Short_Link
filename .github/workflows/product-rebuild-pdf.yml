name: V4 invoice PDF real render acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/billing/**'
      - 'services/platform-api/cmd/server/billing*.go'
      - 'database/migrations/**'
      - 'tests/integration/invoice-pdf-render.sh'
      - '.github/workflows/product-rebuild-pdf.yml'
  push:
    branches:
      - 'rebuild/v4-product-hardening'
    paths:
      - 'app/billing/**'
      - 'services/platform-api/cmd/server/billing*.go'
      - 'database/migrations/**'
      - 'tests/integration/invoice-pdf-render.sh'
      - '.github/workflows/product-rebuild-pdf.yml'

concurrency:
  group: v4-pdf-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pdf-render:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gojet_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install PDF rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client poppler-utils fonts-noto-cjk file
      - name: Apply fresh MySQL migrations
        env:
          MYSQL_PWD: root
        run: |
          set -euo pipefail
          for f in database/migrations/*.sql; do
            echo "Applying $f"
            mysql -h127.0.0.1 -P3306 -uroot gojet_test < "$f"
          done
      - name: Build and start platform API
        run: |
          set -euo pipefail
          mkdir -p /tmp/gojet-pdf/uploads /tmp/gojet-pdf/files
          go build -o /tmp/gojet-platform-api ./services/platform-api/cmd/server
          SETTINGS_KEY=$(python3 - <<'PY'
          import base64
          print(base64.b64encode(bytes(range(32))).decode())
          PY
          )
          env \
            MYSQL_DSN='root:root@tcp(127.0.0.1:3306)/gojet_test?parseTime=true&multiStatements=true' \
            REDIS_ADDRESS='127.0.0.1:6379' \
            SETTINGS_ENCRYPTION_KEY="$SETTINGS_KEY" \
            ADMIN_BOOTSTRAP_EMAIL='owner@example.test' \
            ADMIN_BOOTSTRAP_PASSWORD='OwnerPassword!2026' \
            QR_TRACKING_KEY='pdf-render-acceptance-qr-key-2026' \
            PUBLIC_BASE_URL='http://127.0.0.1:18090' \
            PLATFORM_HTTP_ADDRESS='127.0.0.1:18090' \
            UPLOAD_STORAGE_PATH='/tmp/gojet-pdf/uploads' \
            FILE_STORAGE_PATH='/tmp/gojet-pdf/files' \
            /tmp/gojet-platform-api >/tmp/gojet-pdf-platform.log 2>&1 &
          echo $! >/tmp/gojet-pdf-platform.pid
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:18090/health >/dev/null 2>&1 && break
            sleep 1
            test "$i" -lt 60
          done
      - name: Generate, parse and rasterize a real invoice PDF
        env:
          GOJET_TEST_BASE: http://127.0.0.1:18090
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: gojet_test
          PDF_ACCEPTANCE_OUT: /tmp/gojet-pdf-acceptance
        run: bash tests/integration/invoice-pdf-render.sh
      - name: Upload PDF render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gojet-invoice-pdf-render-evidence
          path: |
            /tmp/gojet-pdf-acceptance/invoice.pdf
            /tmp/gojet-pdf-acceptance/invoice-page.png
            /tmp/gojet-pdf-acceptance/invoice.txt
            /tmp/gojet-pdf-acceptance/pdfinfo.txt
            /tmp/gojet-pdf-acceptance/invoice.headers
            /tmp/gojet-pdf-acceptance/render-file.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Diagnostics on failure
        if: failure()
        run: |
          echo '===== platform-api ====='
          cat /tmp/gojet-pdf-platform.log 2>/dev/null || true
          echo '===== PDF evidence directory ====='
          find /tmp/gojet-pdf-acceptance -maxdepth 1 -type f -printf '%f %s bytes\n' 2>/dev/null || true
          MYSQL_PWD=root mysql -h127.0.0.1 -P3306 -uroot gojet_test -e 'SELECT id,email,status FROM users ORDER BY id DESC LIMIT 10; SELECT id,invoice_number,status,source_amount_cents,source_currency,amount_cents,currency,fx_rate FROM billing_invoices ORDER BY id DESC LIMIT 10;' || true
      - name: Stop platform API
        if: always()
        run: |
          if [ -f /tmp/gojet-pdf-platform.pid ]; then
            kill "$(cat /tmp/gojet-pdf-platform.pid)" 2>/dev/null || true
          fi
