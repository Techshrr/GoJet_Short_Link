name: V4 product browser acceptance

on:
  workflow_dispatch:
  pull_request:

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Generate canonical public marketing pages
        run: |
          python3 scripts/rebuild-public-product-pages.py
          python3 scripts/rebuild-marketing-pages.py
          ! grep -R -n -E 'Fresh Install|GoJet V4|不是静态演示数据|真实业务接口|Redis Worker|file-worker' frontend/marketing-site/products frontend/marketing-site/pricing frontend/marketing-site/about frontend/marketing-site/contact frontend/marketing-site/resources frontend/marketing-site/solutions
          test -f frontend/marketing-site/privacy/index.html
          test -f frontend/marketing-site/terms/index.html
      - name: Start browser acceptance harness
        run: |
          python3 tests/e2e/rebuild_server.py >/tmp/gojet-rebuild-browser.log 2>&1 &
          echo $! >/tmp/gojet-rebuild-browser.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
      - name: Run product browser acceptance
        run: npx playwright test tests/e2e/product-rebuild.spec.js tests/e2e/abuse-report.spec.js --project=chromium
      - name: Harness log on failure
        if: failure()
        run: cat /tmp/gojet-rebuild-browser.log 2>/dev/null || true
      - name: Stop harness
        if: always()
        run: kill "$(cat /tmp/gojet-rebuild-browser.pid)" 2>/dev/null || true
