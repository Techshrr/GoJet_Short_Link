name: GoJet Installer Validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - rebuild/v5.0.2-auth-i18n-product-copy
    paths:
      - '.github/workflows/installervalidation.yml'
      - 'installer/**'
      - 'public/install/**'
      - 'deploy/**'
      - 'database/**'
      - 'frontend/**'
      - 'services/**'
      - 'app/**'
      - 'scripts/**'
      - 'install.sh'
      - 'installhostnginx.sh'
      - 'installnativelemp.sh'
      - 'launchwebinstaller.sh'
      - 'package.json'
      - 'packagelock.json'
      - 'playwright.config.js'
      - 'tests/e2e/**'
      - 'tests/integration/**'

concurrency:
  group: gojetinstallervalidation${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Validate installer deployment and naming syntax
        run: |
          set -euo pipefail
          php -l installer/index.php
          php -l public/install/index.php
          node --check public/install/install.js
          grep -Fq 'gojetInstallerActive' public/install/index.php
          grep -Fq 'request.processing' public/install/index.php
          grep -Fq '状态同步暂时中断' public/install/install.js
          grep -Fq '自动重连' public/install/install.js
          grep -Fq '请勿重复提交' public/install/install.js
          test -z "$(grep -R -F 'catch(e){}' public/install 2>/dev/null || true)"
          for script in install.sh installhostnginx.sh installnativelemp.sh launchwebinstaller.sh scripts/installdocker.sh scripts/nativeinstallerrun.sh scripts/nativeinstallerapply.sh scripts/runmigrations.sh scripts/installgeoip.sh scripts/packagerelease.sh scripts/verifyrelease.sh scripts/aptstable.sh; do bash -n "$script"; done
          python3 - <<'PY'
          from pathlib import Path
          text = Path('install.sh').read_text()
          start = text.index('find_cmd(){')
          end = text.index('\n}\n\nNGINX=', start)
          body = text[start:end]
          assert body.index('for p in "$@"') < body.index('command -v "$name"'), 'aaPanel explicit runtime paths must win over shell PATH'
          for contract in (
              'NGINX=$(find_cmd nginx /www/server/nginx/sbin/nginx)',
              'PHP=$(find_cmd php /www/server/php/83/bin/php)',
              'MYSQL=$(find_cmd mysql /www/server/mysql/bin/mysql)',
              'REDIS_CLI=$(find_cmd redis-cli /www/server/redis/src/redis-cli /usr/local/bin/redis-cli)',
          ):
              assert contract in text, contract
          PY
          python3 -m py_compile scripts/buildpublicsite.py scripts/checknames.py scripts/checkschema.py
          python3 scripts/checknames.py
          python3 scripts/checkschema.py
          test -f database/migrations/migrationcatalog.txt
          sql_count="$(find database/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d '[:space:]')"
          catalog_count="$(grep -cve '^[[:space:]]*$' database/migrations/migrationcatalog.txt | tr -d '[:space:]')"
          test "$sql_count" -gt 0
          test "$sql_count" -eq "$catalog_count"
          grep -Fxq 'linkdestinationrisk.sql' database/migrations/migrationcatalog.txt
          grep -Fxq 'socialauth.sql' database/migrations/migrationcatalog.txt
          grep -Fxq 'socialsubjectwidth.sql' database/migrations/migrationcatalog.txt
          grep -Fxq 'billingcycles.sql' database/migrations/migrationcatalog.txt
          test -z "$(find database/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | grep -E '^[0-9]' || true)"
          MIGRATION_GLOB='database/migrations/'
          MIGRATION_GLOB+='*.sql'
          if grep -R -I -n -F "$MIGRATION_GLOB" .github/workflows scripts install.sh upgradenative.sh upgrade.sh 2>/dev/null; then
            echo 'migration glob execution is forbidden; use migrationcatalog.txt through scripts/runmigrations.sh' >&2
            exit 1
          fi
          grep -Fq 'scripts/installgeoip.sh' install.sh
          grep -Fq 'GEOIP_MMDB=__GOJET_ROOT__/deploy/data/geoip/city.mmdb' deploy/native/gojet@.service
          grep -Fq 'test -s __GOJET_ROOT__/deploy/data/geoip/city.mmdb' deploy/native/gojet@.service
          grep -Fq 'GEOIP_MMDB: /data/geoip/city.mmdb' deploy/compose.production.yaml
          grep -Fq 'bash "$ROOT/scripts/installgeoip.sh"' scripts/installdocker.sh
          grep -Fq 'deploy/data/geoip/city.mmdb' deploy/.env.production.example
          test -z "$(grep -R -F 'GeoLite2-City.mmdb' deploy scripts install.sh 2>/dev/null || true)"

      - name: Validate canonical V5 frontend and release routing
        run: |
          set -euo pipefail
          cd frontend
          pnpm install --frozen-lockfile
          pnpm check
          cd ..
          for config in deploy/nginx/gojet.conf deploy/nginx/gojethost.conf deploy/nginx/gojetnative.conf deploy/nginx/gojetbtrewrite.conf; do
            grep -Fq 'try_files $uri $uri.html $uri/index.html' "$config"
          done
          grep -Fq 'frontend/apps/site/dist' scripts/packagerelease.sh
          grep -Fq 'frontend/apps/workspace/dist' scripts/packagerelease.sh
          grep -Fq 'frontend/apps/admin/dist' scripts/packagerelease.sh
          grep -Fq 'frontend/apps/docs/dist' scripts/packagerelease.sh
          grep -Fq 'public/legal/privacy/index.html' scripts/verifyrelease.sh
          grep -Fq 'public/zh-CN/legal/privacy/index.html' scripts/verifyrelease.sh
          test ! -e frontend/marketingsite

      - name: Run legacy backend browser fixture regressions without apt bootstrap
        run: |
          set -euo pipefail
          bash scripts/npmci.sh --ignore-scripts
          npx playwright install chromium
          npm run test:e2e -- --project=chromium

      - name: Reject retired engineering and unstable CI contracts
        run: |
          set -euo pipefail
          PATHS='installer public/install deploy scripts/nativeinstallerrun.sh scripts/nativeinstallerapply.sh scripts/runmigrations.sh scripts/installgeoip.sh install.sh installhostnginx.sh installnativelemp.sh launchwebinstaller.sh'
          if grep -R -I -n -E '\bGoJet V4\b|\bRC[0-9]+\b|product-hardening|hardening-release|SYSTEM_IMAGE_PATH|/system-images/|frontend/marketingsite' $PATHS; then
            echo 'retired engineering or runtime contract detected in installer sources' >&2
            exit 1
          fi
          if grep -R -n -F 'playwright install --with-deps' .github/workflows; then
            echo 'Playwright apt bootstrap is forbidden; use browser-only installation and controlled system packages.' >&2
            exit 1
          fi
          grep -Fq 'FRESHINSTALLONLY=1' scripts/packagerelease.sh
          grep -Fq 'stop_existing_services' scripts/nativeinstallerrun.sh
          grep -Fq 'information_schema.tables' scripts/nativeinstallerrun.sh
          grep -Fq 'LEGACY_SERVICES=(log-receiver redirect-engine platform-api analytics-worker analytics-reconciler mail-worker file-worker operations-monitor)' scripts/nativeinstallerrun.sh
          grep -Fq 'preflight_reserved_ports' scripts/nativeinstallerrun.sh
          grep -Fq 'for port in 18080 18090 18092' scripts/nativeinstallerrun.sh
          grep -Fq 'systemctl disable --now "gojet@$service.service"' scripts/nativeinstallerrun.sh
          test -z "$(grep -F 'upgradenative.sh' scripts/packagerelease.sh || true)"
          test -z "$(grep -F 'upgrade.sh' scripts/packagerelease.sh || true)"

      - name: Validate storage namespaces and source contracts
        run: |
          set -euo pipefail
          bash tests/integration/releasestoragenamespaces.sh
          bash tests/integration/adminsettingssourcecontract.sh

      - name: Test and build production services
        run: |
          set -euo pipefail
          go test ./...
          go test -tags=integration_smtp ./app/mail
          go vet ./...
          mkdir -p /tmp/gojetinstallerbin
          for spec in \
            'redirectengine ./services/redirectengine/cmd/server' \
            'analyticsworker ./services/analyticsworker/cmd/worker' \
            'analyticsreconciler ./services/analyticsreconciler/cmd/reconciler' \
            'platformapi ./services/platformapi/cmd/server' \
            'mailworker ./services/platformapi/cmd/mailworker' \
            'fileworker ./services/platformapi/cmd/fileworker' \
            'operationsmonitor ./services/platformapi/cmd/operationsmonitor' \
            'logreceiver ./services/logreceiver/cmd/server'; do
            set -- $spec
            go build -o "/tmp/gojetinstallerbin/$1" "$2"
          done
          test "$(find /tmp/gojetinstallerbin -maxdepth 1 -type f | wc -l)" -eq 8
