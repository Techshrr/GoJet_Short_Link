name: GoJet stale reference cleanup

on:
  push:
    branches:
      - rebuild/v4-rc12-real-install-fixes
    paths:
      - .github/workflows/migratenames.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/v4-rc12-real-install-fixes
          fetch-depth: 0
      - name: Replace retired non-workflow path references
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          root = Path.cwd()
          workflow = '.github/workflows/'
          replacements = {
              'NotoSansSC-Regular.ttf': 'NotoSansSCRegular.ttf',
              'NotoSansSC-VF.ttf': 'NotoSansSCVF.ttf',
              'login/index.html': 'login.html',
              'register/index.html': 'register.html',
              'forgotpassword/index.html': 'forgotpassword.html',
              'resetpassword/index.html': 'resetpassword.html',
              'verifyemail/index.html': 'verifyemail.html',
              'reportabuse/index.html': 'reportabuse.html',
              'privacy/index.html': 'privacy.html',
              'terms/index.html': 'terms.html',
          }
          files = [p for p in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if p]
          changed = []
          for rel in files:
              if rel.startswith(workflow):
                  continue
              path = root / rel
              raw = path.read_bytes()
              if b'\x00' in raw:
                  continue
              try:
                  text = raw.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(rel)

          stale = []
          for rel in files:
              if rel.startswith(workflow):
                  continue
              path = root / rel
              if not path.exists():
                  continue
              raw = path.read_bytes()
              if b'\x00' in raw:
                  continue
              try:
                  text = raw.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              for old in replacements:
                  if old in text:
                      stale.append(f'{rel}: {old}')
          if stale:
              raise SystemExit('stale references remain:\n' + '\n'.join(stale))
          subprocess.run(['python3','scripts/checknames.py'], check=True)
          print('updated:', ', '.join(changed) if changed else 'none')
          PY
          git config user.name "GoJet Repository Cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No stale references required changes.'
            exit 0
          fi
          git commit -m "Remove stale font and public route references"
          git push origin HEAD:rebuild/v4-rc12-real-install-fixes
