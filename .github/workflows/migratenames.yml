name: GoJet repository connector cleanup

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/v4-rc12-real-install-fixes
    paths:
      - .github/workflows/migratenames.yml

permissions:
  contents: write

concurrency:
  group: gojetrepositoryconnectorcleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/v4-rc12-real-install-fixes
          fetch-depth: 0

      - name: Repair connector cleanup side effects and validate repository
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          main = Path('services/platformapi/cmd/server/main.go')
          text = main.read_text(encoding='utf-8')
          damaged = '/api/admin/announcements{id}'
          repaired = '/api/admin/announcements/{id}'
          count = text.count(damaged)
          if count not in (0, 2):
              raise SystemExit(f'unexpected damaged announcement route count: {count}')
          if count:
              main.write_text(text.replace(damaged, repaired), encoding='utf-8')
              print(f'repaired {count} announcement ServeMux patterns')
          else:
              print('announcement ServeMux patterns already canonical')

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.parts[:3] == ('.github', 'workflows'):
                  continue
              try:
                  raw = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if '/tmp/gojet/test-env' in raw:
                  path.write_text(raw.replace('/tmp/gojet/test-env', '/tmp/gojet/testenv'), encoding='utf-8')

          subprocess.run(['python3', 'scripts/checknames.py'], check=True)
          subprocess.run(['python3', 'scripts/checkschema.py'], check=True)
          subprocess.run(['go', 'test', './...'], check=True)
          subprocess.run(['go', 'vet', './...'], check=True)
          subprocess.run(['python3', '-m', 'py_compile', 'scripts/buildpublicsite.py', 'tests/e2e/browserfixtureserver.py'], check=True)
          PY

          git config user.name "GoJet Repository Cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --name-status
          if git diff --cached --quiet; then
            echo 'No connector cleanup changes required.'
            exit 0
          fi
          git commit -m "Repair ServeMux route contract after connector cleanup"
          git push origin HEAD:rebuild/v4-rc12-real-install-fixes
