name: GoJet payment callback browser test wiring

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/v4-rc12-real-install-fixes
    paths:
      - '.github/workflows/wirecallbackbrowser.yml'

permissions:
  contents: write

concurrency:
  group: gojetpaymentcallbackbrowserwiring
  cancel-in-progress: false

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/v4-rc12-real-install-fixes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Add real administrator callback observability browser acceptance
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path=Path('tests/e2e/productsurface.spec.js')
          text=path.read_text(encoding='utf-8')
          marker="  test('uploaded brand logo is readable through the same public origin',async({page,request})=>{\n"
          title="  test('administrator billing shows real payment callback observability',async({page,request})=>{\n"
          if title in text:
              print('browser callback observability test already present')
          else:
              if marker not in text:
                  raise SystemExit('product surface insertion marker not found')
              block=r'''  test('administrator billing shows real payment callback observability',async({page,request})=>{
    const requestID='browsercallbackreject0001';
    const merchantOrder='BROWSERCALLBACKOBSERVE';
    const probe=await request.fetch(base+'/api/payments/epay/notify',{
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded','X-Request-ID':requestID},
      data:`pid=1000&out_trade_no=${merchantOrder}&sign=00000000000000000000000000000000&sign_type=MD5`
    });
    expect(probe.status()).toBeGreaterThanOrEqual(400);
    await adminLogin(page);
    await page.getByRole('button',{name:'套餐与账单',exact:true}).click();
    await expect(page.getByRole('heading',{name:'最近支付回调',exact:true})).toBeVisible();
    const callbackSection=page.getByRole('heading',{name:'最近支付回调',exact:true}).locator('xpath=following-sibling::*[1]');
    await expect(callbackSection).toContainText('EPAY');
    await expect(callbackSection).toContainText('已拒绝');
    await expect(callbackSection).toContainText(merchantOrder);
    await expect(callbackSection).toContainText(requestID);
  });

'''
              path.write_text(text.replace(marker,block+marker,1),encoding='utf-8')
          PY
          node --check tests/e2e/productsurface.spec.js
          python3 scripts/checknames.py

      - name: Commit validated browser acceptance
        run: |
          set -euo pipefail
          git restore -- .github/workflows
          git config user.name 'GoJet Callback Browser Wiring'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/e2e/productsurface.spec.js
          git diff --cached --name-status
          if git diff --cached --quiet; then
            echo 'Browser callback observability acceptance already wired.'
            exit 0
          fi
          git commit -m 'Verify payment callback observability in admin browser'
          git push origin HEAD:rebuild/v4-rc12-real-install-fixes
