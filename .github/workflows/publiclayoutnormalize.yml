name: GoJet public layout normalization

on:
  push:
    branches:
      - rebuild/v4-rc12-real-install-fixes
    paths:
      - '.github/workflows/publiclayoutnormalize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gojetpubliclayoutnormalize
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/v4-rc12-real-install-fixes
          fetch-depth: 0
      - name: Normalize homepage layout and routes
        run: |
          set -euo pipefail
          python3 scripts/publiclayoutnormalize.py
          node --check frontend/publicsite/assets/app.js
          python3 scripts/checknames.py
          python3 scripts/buildpublicsite.py --output /tmp/gojetpublicia
          for path in pricing products/qrcode products/analytics products/textsharing products/filesharing; do test -f "/tmp/gojetpublicia/$path.html"; done
          if grep -R -I -n -E '/pricing/|/products/(qr-code|text-sharing|file-sharing)/' frontend/publicsite; then
            echo 'retired public URL remains in canonical public source' >&2
            exit 1
          fi
      - name: Commit validated public layout
        run: |
          set -euo pipefail
          git restore -- .github/workflows
          git config user.name 'GoJet Public Layout'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend/publicsite/assets/styles.css frontend/publicsite/assets/home.css frontend/publicsite/pages/home.html
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Widen public layout and canonicalize homepage links'
          git push origin HEAD:rebuild/v4-rc12-real-install-fixes
