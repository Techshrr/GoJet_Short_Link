name: GoJet Release Package Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - rebuild/v4-rc12-real-install-fixes
    paths:
      - '.github/workflows/releasepackage.yml'
      - 'scripts/**'
      - 'installer/**'
      - 'public/install/**'
      - 'install.sh'
      - 'installhostnginx.sh'
      - 'installnativelemp.sh'
      - 'launchwebinstaller.sh'
      - 'LICENSE'
      - 'deploy/**'
      - 'docs/**'
      - 'frontend/**'
      - 'services/**'
      - 'app/**'
      - 'database/**'
      - 'tests/integration/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

concurrency:
  group: gojetreleasepackage${{ github.ref }}
  cancel-in-progress: true

env:
  GOJET_RELEASE_VERSION: 4.0.0_${{ github.sha }}

jobs:
  package:
    name: Production package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Enforce repository naming policy
        run: python3 scripts/checknames.py

      - name: Install release build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-fonttools
          python3 - <<'PY'
          from fontTools import subset
          print('FontTools ready')
          PY

      - name: Validate release source
        run: |
          set -euo pipefail
          sh -n scripts/packagerelease.sh
          sh -n scripts/verifyrelease.sh
          python3 -m py_compile scripts/buildpublicsite.py
          go test ./...
          go vet ./...

      - name: Build production archive
        run: |
          set -euo pipefail
          ./scripts/packagerelease.sh "$GOJET_RELEASE_VERSION"
          ZIP="dist/GoJet_${GOJET_RELEASE_VERSION}_LinuxProduction.zip"
          test -f "$ZIP"
          printf '%s\n' "$ZIP" | tee /tmp/gojetreleasezip

      - name: Verify archive independently
        run: |
          set -euo pipefail
          ZIP=$(cat /tmp/gojetreleasezip)
          sh scripts/verifyrelease.sh "$ZIP"
          unzip -tq "$ZIP"
          test -f "$ZIP.sha256"
          (cd "$(dirname "$ZIP")" && sha256sum -c "$(basename "$ZIP.sha256")")

      - name: Inspect production payload
        run: |
          set -euo pipefail
          ZIP=$(cat /tmp/gojetreleasezip)
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          unzip -q "$ZIP" -d "$TMP"
          ROOT=$(find "$TMP" -mindepth 1 -maxdepth 1 -type d | head -1)
          test -n "$ROOT"
          test "$(cat "$ROOT/VERSION")" = "$GOJET_RELEASE_VERSION"
          grep -Fxq 'FRESH_INSTALL_ONLY=1' "$ROOT/FRESH_INSTALL_ONLY"
          for binary in redirectengine analyticsworker analyticsreconciler platformapi mailworker fileworker operationsmonitor logreceiver; do
            test -x "$ROOT/bin/$binary"
            file "$ROOT/bin/$binary" | grep -Eq 'ELF 64-bit.*x86-64'
          done
          test "$(find "$ROOT/bin" -maxdepth 1 -type f | wc -l)" -eq 8
          test -f "$ROOT/public/index.html"
          test -f "$ROOT/public/privacy.html"
          test -f "$ROOT/public/terms.html"
          test -f "$ROOT/public/forgotpassword.html"
          test -f "$ROOT/public/reportabuse.html"
          test -f "$ROOT/public/products/urlshortener.html"
          test -f "$ROOT/public/app/index.html"
          test -f "$ROOT/public/admin/index.html"
          test -d "$ROOT/public/assets/images"
          test -d "$ROOT/public/generated/qr"
          test -z "$(find "$ROOT/public" -mindepth 2 -type f -name index.html ! -path "$ROOT/public/app/index.html" ! -path "$ROOT/public/admin/index.html" -print -quit)"
          test ! -e "$ROOT/tests"
          test ! -e "$ROOT/frontend"
          test ! -e "$ROOT/systemimages"
          if find "$ROOT" -mindepth 1 -printf '%f\n' | grep -F -- '-' | grep -q .; then
            echo 'hyphenated filename leaked into release payload' >&2
            find "$ROOT" -mindepth 1 -printf '%P\n' | grep -F -- '-' >&2 || true
            exit 1
          fi
          if grep -R -I -n -E 'frontend/marketingsite|systemimages|compose\.release\.yaml|\bGoJet V4\b|\bRC[0-9]+\b|product-hardening|hardening-release' "$ROOT" --exclude='*.map' --exclude=verifyrelease.sh; then
            echo 'retired engineering or runtime terminology leaked into release package' >&2
            exit 1
          fi

      - name: Write immutable build evidence
        run: |
          set -euo pipefail
          ZIP=$(cat /tmp/gojetreleasezip)
          {
            echo "tested_sha=$GITHUB_SHA"
            echo "version=$GOJET_RELEASE_VERSION"
            echo "archive=$(basename "$ZIP")"
            echo "size_bytes=$(wc -c < "$ZIP")"
            echo "sha256=$(sha256sum "$ZIP" | awk '{print $1}')"
          } | tee dist/RELEASEEVIDENCE.txt

      - name: Upload tested release package
        uses: actions/upload-artifact@v4
        with:
          name: gojetreleasepackage${{ github.sha }}
          path: |
            dist/GoJet_${{ env.GOJET_RELEASE_VERSION }}_LinuxProduction.zip
            dist/GoJet_${{ env.GOJET_RELEASE_VERSION }}_LinuxProduction.zip.sha256
            dist/RELEASEEVIDENCE.txt
          if-no-files-found: error
          retention-days: 14

  freshinstallcandidate:
    name: Fresh install candidate
    needs: package
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gojet_candidate
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=30

    steps:
      - name: Checkout acceptance harness
        uses: actions/checkout@v4

      - name: Install candidate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client zbar-tools unzip file nginx

      - name: Download package from this exact workflow run
        uses: actions/download-artifact@v4
        with:
          name: gojetreleasepackage${{ github.sha }}
          path: /tmp/gojetpackageartifact

      - name: Verify evidence and unpack candidate
        run: |
          set -euo pipefail
          ART=/tmp/gojetpackageartifact
          EVIDENCE="$ART/RELEASEEVIDENCE.txt"
          ZIP="$ART/GoJet_${GOJET_RELEASE_VERSION}_LinuxProduction.zip"
          test -f "$EVIDENCE"
          test -f "$ZIP" -a -f "$ZIP.sha256"
          grep -Fxq "tested_sha=$GITHUB_SHA" "$EVIDENCE"
          grep -Fxq "version=$GOJET_RELEASE_VERSION" "$EVIDENCE"
          grep -Fxq "archive=$(basename "$ZIP")" "$EVIDENCE"
          (cd "$ART" && sha256sum -c "$(basename "$ZIP.sha256")")
          unzip -tq "$ZIP"
          rm -rf /tmp/gojetcandidateroot
          mkdir -p /tmp/gojetcandidateroot
          unzip -q "$ZIP" -d /tmp/gojetcandidateroot
          ROOT=$(find /tmp/gojetcandidateroot -mindepth 1 -maxdepth 1 -type d | head -1)
          test -n "$ROOT"
          printf '%s\n' "$ROOT" >/tmp/gojetcandidaterootpath
          test "$(cat "$ROOT/VERSION")" = "$GOJET_RELEASE_VERSION"
          grep -Fxq 'FRESH_INSTALL_ONLY=1' "$ROOT/FRESH_INSTALL_ONLY"
          test "$(find "$ROOT/bin" -maxdepth 1 -type f | wc -l)" -eq 8
          for binary in redirectengine analyticsworker analyticsreconciler platformapi mailworker fileworker operationsmonitor logreceiver; do
            test -x "$ROOT/bin/$binary"
          done
          test -f "$ROOT/public/index.html"
          test -f "$ROOT/public/privacy.html"
          test -f "$ROOT/public/terms.html"
          test -f "$ROOT/public/app/index.html"
          test -f "$ROOT/public/admin/index.html"
          test -d "$ROOT/public/assets/images"
          test -d "$ROOT/public/generated/qr"

      - name: Apply packaged migrations to a fresh database
        env:
          MYSQL_PWD: root
        run: |
          set -euo pipefail
          ROOT=$(cat /tmp/gojetcandidaterootpath)
          for f in "$ROOT"/database/migrations/*.sql; do
            echo "Applying $(basename "$f")"
            mysql -h127.0.0.1 -P3306 -uroot gojet_candidate < "$f"
          done
          mysql -h127.0.0.1 -P3306 -uroot gojet_candidate -N -B <<'SQL' >/tmp/gojetcandidateschema
          SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='gojet_candidate' AND TABLE_NAME='support_tickets';
          SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='gojet_candidate' AND TABLE_NAME='payment_transactions';
          SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='gojet_candidate' AND TABLE_NAME='fx_rate_cache';
          SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='gojet_candidate' AND TABLE_NAME='file_shares' AND COLUMN_NAME='password_hash';
          SELECT COUNT(*) FROM system_settings WHERE setting_key IN ('turnstile.enabled','turnstile.registration','turnstile.login','turnstile.forgot_password','turnstile.reset_password','turnstile.ticket_create','turnstile.ticket_reply','turnstile.abuse_report');
          SQL
          mapfile -t schema </tmp/gojetcandidateschema
          test "${schema[0]}" = 1
          test "${schema[1]}" = 1
          test "${schema[2]}" = 1
          test "${schema[3]}" = 1
          test "${schema[4]}" = 8

      - name: Start exact packaged runtime
        run: |
          set -euo pipefail
          ROOT=$(cat /tmp/gojetcandidaterootpath)
          mkdir -p /tmp/gojetcandidate/uploads /tmp/gojetcandidate/files /tmp/gojetcandidate/brand /tmp/gojetcandidate/generated/qr /tmp/gojet
          SETTINGS_KEY=$(python3 - <<'PY'
          import base64
          print(base64.b64encode(bytes(range(32))).decode())
          PY
          )
          printf 'SETTINGS_ENCRYPTION_KEY=%s\n' "$SETTINGS_KEY" >/tmp/gojet/testenv
          cp "$ROOT/bin/mailworker" /tmp/gojet/mailworker
          chmod 0755 /tmp/gojet/mailworker
          env \
            MYSQL_DSN='root:root@tcp(127.0.0.1:3306)/gojet_candidate?parseTime=true&multiStatements=true' \
            REDIS_ADDRESS='127.0.0.1:6379' \
            SETTINGS_ENCRYPTION_KEY="$SETTINGS_KEY" \
            ADMIN_BOOTSTRAP_EMAIL='owner@example.test' \
            ADMIN_BOOTSTRAP_PASSWORD='OwnerPassword!2026' \
            QR_TRACKING_KEY='freshinstallcandidateqrtrackingkey2026' \
            PUBLIC_BASE_URL='http://127.0.0.1:18080' \
            PLATFORM_HTTP_ADDRESS='127.0.0.1:18090' \
            UPLOAD_STORAGE_PATH='/tmp/gojetcandidate/uploads' \
            BRAND_ASSET_PATH='/tmp/gojetcandidate/brand' \
            GENERATED_QR_STORAGE_PATH='/tmp/gojetcandidate/generated/qr' \
            FILE_STORAGE_PATH='/tmp/gojetcandidate/files' \
            PDF_FONT_PATH="$ROOT/resources/fonts/NotoSansSCRegular.ttf" \
            "$ROOT/bin/platformapi" >/tmp/gojetcandidateplatformapi.log 2>&1 &
          echo $! >/tmp/gojetcandidateplatformapi.pid
          env \
            REDIS_ADDRESS='127.0.0.1:6379' \
            HTTP_ADDRESS='127.0.0.1:18080' \
            VISITOR_HASH_KEY='freshcandidatevisitorkey2026' \
            QR_TRACKING_KEY='freshinstallcandidateqrtrackingkey2026' \
            "$ROOT/bin/redirectengine" >/tmp/gojetcandidateredirectengine.log 2>&1 &
          echo $! >/tmp/gojetcandidateredirectengine.pid
          env \
            MYSQL_DSN='root:root@tcp(127.0.0.1:3306)/gojet_candidate?parseTime=true&multiStatements=true' \
            REDIS_ADDRESS='127.0.0.1:6379' \
            ANALYTICS_GROUP='gojetmysql' \
            ANALYTICS_CONSUMER='freshinstallcandidate' \
            "$ROOT/bin/analyticsworker" >/tmp/gojetcandidateanalyticsworker.log 2>&1 &
          echo $! >/tmp/gojetcandidateanalyticsworker.pid
          for port in 18090 18080; do
            for i in $(seq 1 60); do
              curl -fsS "http://127.0.0.1:$port/health" >/dev/null 2>&1 && break
              sleep 1
              test "$i" -lt 60
            done
          done

      - name: Run packaged P0 acceptance
        env:
          GOJET_TEST_BASE: http://127.0.0.1:18090
          GOJET_PUBLIC_BASE: http://127.0.0.1:18080
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: gojet_candidate
          REDIS_ADDRESS: 127.0.0.1:6379
          UPLOAD_STORAGE_PATH: /tmp/gojetcandidate/uploads
          BRAND_ASSET_PATH: /tmp/gojetcandidate/brand
          GENERATED_QR_STORAGE_PATH: /tmp/gojetcandidate/generated/qr
          FILE_STORAGE_PATH: /tmp/gojetcandidate/files
        run: |
          set -euo pipefail
          bash tests/integration/coreproductapi.sh
          bash tests/integration/adminpermissionboundary.sh
          bash tests/integration/adminlinklifecycle.sh
          bash tests/integration/settingsroundtrip.sh
          bash tests/integration/qrreale2e.sh
          bash tests/integration/filesharelifecycle.sh
          bash tests/integration/brandlogolifecycle.sh
          bash tests/integration/maillifecyclesmtp.sh
          bash tests/integration/billingpaymentconflict.sh
          bash tests/integration/billingfxfreeze.sh

      - name: Candidate diagnostics
        if: failure()
        run: |
          echo '===== platformapi ====='
          cat /tmp/gojetcandidateplatformapi.log 2>/dev/null || true
          echo '===== redirectengine ====='
          cat /tmp/gojetcandidateredirectengine.log 2>/dev/null || true
          echo '===== analyticsworker ====='
          cat /tmp/gojetcandidateanalyticsworker.log 2>/dev/null || true

      - name: Stop candidate services
        if: always()
        run: |
          for pidfile in /tmp/gojetcandidateplatformapi.pid /tmp/gojetcandidateredirectengine.pid /tmp/gojetcandidateanalyticsworker.pid; do
            if [ -f "$pidfile" ]; then kill "$(cat "$pidfile")" 2>/dev/null || true; fi
          done
