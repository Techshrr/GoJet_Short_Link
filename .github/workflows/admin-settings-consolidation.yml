name: GoJet Admin Settings Consolidation

on:
  push:
    branches:
      - rebuild/v4-rc12-real-install-fixes
    paths:
      - '.github/workflows/admin-settings-consolidation.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/v4-rc12-real-install-fixes
          fetch-depth: 0

      - name: Remove legacy settings owner
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app = Path('frontend/admin-console/app.js')
          lines = app.read_text(encoding='utf-8').splitlines()
          prefixes = (
              'function settingInput(',
              'async function renderSettings(',
              'async function saveSettingForm(',
              'async function saveBrand(',
              'async function deleteBrand(',
          )
          removed = [line for line in lines if line.startswith(prefixes)]
          if len(removed) != 5:
              raise SystemExit(f'expected exactly 5 legacy settings lines, found {len(removed)}')
          app.write_text('\n'.join(line for line in lines if not line.startswith(prefixes)) + '\n', encoding='utf-8')

          canonical = Path('frontend/admin-console/settings.js').read_text(encoding='utf-8')
          for marker in ('renderSettings=async function(){', 'async function saveUnifiedSection('):
              if marker not in canonical:
                  raise SystemExit(f'canonical settings owner missing: {marker}')
          PY
          bash tests/integration/admin-settings-source-contract.sh

      - name: Commit cleanup and remove maintenance workflow
        run: |
          set -euo pipefail
          git config user.name 'GoJet Repository Maintenance'
          git config user.email '118724895+Techshrr@users.noreply.github.com'
          git rm .github/workflows/admin-settings-consolidation.yml
          git add frontend/admin-console/app.js
          git diff --cached --check
          git commit -m 'Consolidate administrator settings implementation'
          git push origin HEAD:rebuild/v4-rc12-real-install-fixes
