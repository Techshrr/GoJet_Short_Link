name: V5 Frontend Foundation

on:
  push:
    branches:
      - 'rebuild/v5-*'
    paths:
      - 'frontend/**'
      - '.github/workflows/v5-frontend-foundation.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/v5-frontend-foundation.yml'

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies and create lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Verify no browser auth-token persistence in V5 apps/packages
        run: |
          if grep -R -n -E 'localStorage|sessionStorage' apps packages; then
            echo 'V5 auth/session persistence must not use browser Web Storage.' >&2
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Build independent applications
        run: pnpm build
