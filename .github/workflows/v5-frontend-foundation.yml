name: V5 Frontend Foundation

on:
  push:
    branches:
      - 'rebuild/v5-*'
    paths:
      - 'frontend/**'
      - '.github/workflows/v5-frontend-foundation.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/v5-frontend-foundation.yml'

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and create lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Capture generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: v5-pnpm-lock-${{ github.sha }}
          path: frontend/pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1

      - name: Verify no browser auth-token persistence in V5 source
        run: |
          if grep -R -n \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=.astro \
            -E '(localStorage|sessionStorage)\.(setItem|getItem|removeItem)' \
            apps packages; then
            echo 'V5 auth/session persistence must not use browser Web Storage.' >&2
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Build independent applications
        run: pnpm build

      - name: Verify P01 static and split boundaries
        run: |
          test -f apps/docs/dist/en/index.html
          test -f apps/docs/dist/zh-CN/index.html
          node <<'NODE'
          const fs = require('node:fs');
          const checks = [
            ['workspace', 'src/routes/LinksBoundary.tsx'],
            ['admin', 'src/routes/UsersBoundary.tsx'],
          ];
          for (const [app, source] of checks) {
            const file = `apps/${app}/dist/.vite/manifest.json`;
            const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
            const entry = Object.values(manifest).find((item) => item && item.src === source);
            if (!entry || entry.isDynamicEntry !== true) {
              throw new Error(`${app} route ${source} is not a dynamic entry`);
            }
          }
          NODE
