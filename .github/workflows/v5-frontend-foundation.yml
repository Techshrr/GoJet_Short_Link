name: V5 Frontend Foundation

on:
  push:
    branches:
      - 'rebuild/v5-*'
    paths:
      - 'frontend/**'
      - 'app/links/**'
      - 'services/platformapi/cmd/server/**'
      - 'go.mod'
      - 'go.sum'
      - 'docs/v5/P05_LINKS_CONTRACT.md'
      - '.github/workflows/v5-frontend-foundation.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'app/links/**'
      - 'services/platformapi/cmd/server/**'
      - 'go.mod'
      - 'go.sum'
      - 'docs/v5/P05_LINKS_CONTRACT.md'
      - '.github/workflows/v5-frontend-foundation.yml'

concurrency:
  group: v5-frontend-foundation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: go.sum

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify no browser auth-token persistence in V5 source
        run: |
          if grep -R -n \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=.astro \
            -E '(localStorage|sessionStorage)\.(setItem|getItem|removeItem)' \
            apps packages; then
            echo 'V5 auth/session persistence must not use browser Web Storage.' >&2
            exit 1
          fi

      - name: Verify P02 brand foundation
        run: pnpm verify:brand

      - name: Verify P03 design system foundation
        run: pnpm verify:ui

      - name: Verify P04 five-surface shell contract
        run: pnpm verify:shells

      - name: Verify P05 Links vertical slice contract
        run: pnpm verify:links

      - name: Typecheck
        run: pnpm typecheck

      - name: Build independent applications
        run: pnpm build

      - name: Verify P01 static and split boundaries
        run: |
          test -f apps/docs/dist/en/index.html
          test -f apps/docs/dist/zh-CN/index.html
          node <<'NODE'
          const fs = require('node:fs');
          const checks = [
            ['workspace', 'src/routes/LinksPage.tsx'],
            ['workspace', 'src/routes/LinkDetailPage.tsx'],
            ['admin', 'src/routes/UsersBoundary.tsx'],
          ];
          for (const [app, source] of checks) {
            const file = `apps/${app}/dist/.vite/manifest.json`;
            const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
            const entry = Object.values(manifest).find((item) => item && item.src === source);
            if (!entry || entry.isDynamicEntry !== true) {
              throw new Error(`${app} route ${source} is not a dynamic entry`);
            }
          }
          NODE

      - name: Test P05 Go Links backend
        working-directory: .
        run: go test ./app/links ./services/platformapi/cmd/server

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run P04 fixed-viewport browser gate
        run: pnpm test:shells

      - name: Upload P04 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p04-shell-evidence-${{ github.sha }}
          path: frontend/test-results
          if-no-files-found: warn
          retention-days: 7

      - name: Run P05 fixed-viewport browser gate
        run: pnpm test:links

      - name: Upload P05 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p05-links-evidence-${{ github.sha }}
          path: frontend/test-results
          if-no-files-found: warn
          retention-days: 7

      - name: Persist exact-head CI evidence to issue 8
        if: always() && github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          HEAD_BRANCH: ${{ github.ref_name }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          current_sha="$(git ls-remote origin "refs/heads/$HEAD_BRANCH" | awk '{print $1}' | head -n 1)"
          if [ -z "$current_sha" ] || [ "$current_sha" != "$HEAD_SHA" ]; then
            echo "Skipping stale evidence for $HEAD_SHA; current branch HEAD is ${current_sha:-unknown}."
            exit 0
          fi

          marker='<!-- v5-p05-ci-evidence-v2 -->'
          if [ "$JOB_STATUS" = "success" ]; then
            state='✅ success'
          else
            state="❌ $JOB_STATUS"
          fi

          cat > /tmp/v5-ci-evidence.md <<EOF
          $marker
          ## P05 Links — final exact-head evidence v2

          - Status: **$state**
          - Branch: \`$HEAD_BRANCH\`
          - Tested SHA: \`$HEAD_SHA\`
          - Workflow run: $RUN_URL
          - Run ID: \`$RUN_ID\`
          - Scope: P01–P04 regression gates + P05 Links contract + strict TS/build + Go Links/server tests + P04/P05 fixed-viewport browser gates

          This v2 marker is isolated from pre-guard workflow runs. It records only an exact current branch HEAD and does not mark P06 or later phases complete.
          EOF

          comment_id="$(gh api --paginate "repos/$REPO/issues/8/comments" --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1 || true)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" --raw-field body="$(cat /tmp/v5-ci-evidence.md)" >/dev/null
          else
            gh api --method POST "repos/$REPO/issues/8/comments" --raw-field body="$(cat /tmp/v5-ci-evidence.md)" >/dev/null
          fi
