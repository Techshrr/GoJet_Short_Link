name: Ensure V4 core invariants

on:
  push:
    branches:
      - 'rebuild/v4-product'
    paths:
      - 'scripts/v4-core-invariants.trigger'

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/v4-product
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Converge latest source
        run: |
          git fetch origin rebuild/v4-product
          git reset --hard origin/rebuild/v4-product
          python3 scripts/ensure-v4-core-invariants.py
          gofmt -w services/platform-api/cmd/server/main.go app/adminauth/service.go
          go test ./...
          go vet ./...
      - name: Commit invariant fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'gojet-ci'
          git config user.email 'gojet-ci@users.noreply.github.com'
          git add services/platform-api/cmd/server/main.go app/adminauth/service.go
          git commit -m 'core: converge V4 auth and permission invariants'
          git pull --rebase origin rebuild/v4-product
          git push origin HEAD:rebuild/v4-product
