# GoJet aaPanel routing snippet.
# Included inside the aaPanel-managed server{} block. TLS and PHP-FPM remain managed by aaPanel.

location = / { try_files /index.html =404; }
location = /login { try_files /login.html =404; }
location = /register { try_files /register.html =404; }
location = /forgotpassword { try_files /forgotpassword.html =404; }
location = /resetpassword { try_files /resetpassword.html =404; }
location = /verifyemail { try_files /verifyemail.html =404; }

location = /app { return 302 /app/; }
location ^~ /app/ {
    try_files $uri $uri/ /app/index.html;
}

location = /admin { return 302 /admin/; }
location ^~ /admin/ {
    try_files $uri $uri/ /admin/index.html;
}

location = /health {
    proxy_pass http://127.0.0.1:18080/health;
    proxy_set_header Host $host;
    access_log off;
}

location ~ ^/api/workspaces/[0-9]+/fileshares$ {
    proxy_pass http://127.0.0.1:18090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 101m;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
}

# Unicode invoice rendering embeds a real CJK font and can exceed the generic
# API timeout on a cold/low-CPU host. Keep this authenticated route bounded but
# give it enough time to finish instead of surfacing an XHR connection abort.
location ~ ^/api/workspaces/[0-9]+/billing/invoices/[0-9]+/pdf$ {
    proxy_pass http://127.0.0.1:18090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
    add_header Cache-Control "private, no-store" always;
}

# Payment providers call these endpoints directly; keep them public, bounded and observable.
location ^~ /api/payments/ {
    proxy_pass http://127.0.0.1:18090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 3m;
    proxy_request_buffering off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
}

location /api/ {
    proxy_pass http://127.0.0.1:18090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10m;
    proxy_read_timeout 30s;
}

location ~ ^/t/[a-z0-9_-]+$ {
    proxy_pass http://127.0.0.1:18090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/p/[a-z0-9_-]+$ {
    proxy_pass http://127.0.0.1:18090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/f/([a-z0-9_-]+)$ {
    rewrite ^/f/([a-z0-9_-]+)$ /api/public/files/$1 break;
    proxy_pass http://127.0.0.1:18090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-GoJet-Public-File-Page 1;
    proxy_read_timeout 120s;
}

location ^~ /assets/images/ {
    alias __GOJET_ROOT__/deploy/data/brand/;
    autoindex off;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header X-Content-Type-Options nosniff always;
}

location ^~ /generated/qr/ {
    alias __GOJET_ROOT__/deploy/data/generated/qr/;
    autoindex off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
}

location ^~ /uploads/ {
    alias __GOJET_ROOT__/deploy/data/uploads/;
    autoindex off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
}

# Keep the web installer on aaPanel PHP-FPM for the entire install transaction.
# Query strings such as ?status=1 are preserved by the internal rewrite.
location = /install { return 302 /install/; }
location = /install/ { rewrite ^ /install/index.php last; }

location / {
    try_files $uri $uri.html @gojet_redirect;
}

location @gojet_redirect {
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Referer $http_referer;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
}
