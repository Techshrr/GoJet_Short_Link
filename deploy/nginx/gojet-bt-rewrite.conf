# GoJet aaPanel routing snippet.
# Included inside the aaPanel-managed server{} block. TLS and PHP-FPM remain managed by aaPanel.

# Public account pages deliberately use clean non-/app routes. Exact locations
# avoid Nginx redirecting directory URLs to a trailing slash.
location = /login { try_files /login/index.html =404; }
location = /register { try_files /register/index.html =404; }
location = /forgot-password { try_files /forgot-password/index.html =404; }
location = /reset-password { try_files /reset-password/index.html =404; }
location = /verify-email { try_files /verify-email/index.html =404; }

location = /app { return 302 /app/; }
# ^~ is intentional: aaPanel vhosts often define generic regex locations for
# .js/.css/static files. The GoJet console must own every /app/* request so its
# assets cannot be hijacked by those regex locations.
location ^~ /app/ {
    try_files $uri $uri/ /app/index.html;
}

location = /admin { return 302 /admin/; }
# Same protection for the administrator console. Without ^~, aaPanel regex
# locations may win for /admin/styles.css and /admin/*.js, leaving the login
# page unstyled and without its JavaScript controller.
location ^~ /admin/ {
    try_files $uri $uri/ /admin/index.html;
}

location = /health {
    proxy_pass http://127.0.0.1:18080/health;
    proxy_set_header Host $host;
    access_log off;
}

location ~ ^/api/workspaces/[0-9]+/file-shares$ {
    proxy_pass http://127.0.0.1:18090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 101m;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
}

location /api/ {
    proxy_pass http://127.0.0.1:18090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10m;
    proxy_read_timeout 30s;
}

location ~ ^/t/[a-z0-9_-]+$ {
    proxy_pass http://127.0.0.1:18090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/p/[a-z0-9_-]+$ {
    proxy_pass http://127.0.0.1:18090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Public file sharing uses a clean /f/{slug} address. Nginx rewrites the request
# internally to the existing platform-api file endpoint while marking it as a
# product share-page request. The browser never needs to expose /api/... URLs.
location ~ ^/f/([a-z0-9_-]+)$ {
    rewrite ^/f/([a-z0-9_-]+)$ /api/public/files/$1 break;
    proxy_pass http://127.0.0.1:18090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-GoJet-Public-File-Page 1;
    proxy_read_timeout 120s;
}

# Brand assets are written directly into this directory by platform-api.
# Do not combine alias with try_files $uri here: that can cause Nginx to resolve
# /uploads/name against the aliased directory twice and return a false 404.
location ^~ /uploads/ {
    alias __GOJET_ROOT__/deploy/data/uploads/;
    autoindex off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
}

# /install/ is a real PHP directory under public/. aaPanel's existing PHP rule executes it.
location = /install { return 302 /install/; }

location / {
    try_files $uri $uri/ @gojet_redirect;
}

location @gojet_redirect {
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Referer $http_referer;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
}