limit_req_zone $binary_remote_addr zone=redirect_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=abuse_limit:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=conversion_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=share_limit:10m rate=30r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;

    location = /app { return 302 /app/; }
    location /app/ {
        alias /usr/share/nginx/html/site/app/;
        try_files $uri $uri/ /app/index.html;
    }
    location = /admin { return 302 /admin/; }
    location /admin/ {
        alias /usr/share/nginx/html/site/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location = /health {
        proxy_pass http://redirectengine:8080;
        access_log off;
    }

    location /api/ {
        proxy_pass http://platformapi:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
        proxy_read_timeout 15s;
    }

    location ~ ^/api/workspaces/[0-9]+/fileshares$ {
        proxy_pass http://platformapi:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 101m;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://platformapi:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/abuse-reports {
        limit_req zone=abuse_limit burst=2 nodelay;
        proxy_pass http://platformapi:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/api/public/campaigns/[0-9]+/conversion$ {
        limit_req zone=conversion_limit burst=10 nodelay;
        proxy_pass http://platformapi:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /assets/images/ {
        alias /usr/share/nginx/html/assets/images/;
        autoindex off;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /generated/qr/ {
        alias /usr/share/nginx/html/generated/qr/;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/t/[a-z0-9_-]+$ {
        limit_req zone=share_limit burst=10 nodelay;
        proxy_pass http://platformapi:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/p/[a-z0-9_-]+$ {
        proxy_pass http://platformapi:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/f/([a-z0-9_-]+)$ {
        rewrite ^/f/([a-z0-9_-]+)$ /api/public/files/$1 break;
        proxy_pass http://platformapi:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-GoJet-Public-File-Page 1;
        proxy_read_timeout 120s;
    }

    location = / {
        root /usr/share/nginx/html/site;
        try_files /index.html =404;
    }

    location / {
        root /usr/share/nginx/html/site;
        try_files $uri $uri.html @redirect;
    }

    location @redirect {
        limit_req zone=redirect_limit burst=60 nodelay;
        proxy_pass http://redirectengine:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Referer $http_referer;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
