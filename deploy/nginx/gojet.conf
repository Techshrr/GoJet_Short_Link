upstream gojet_redirector {
    server 127.0.0.1:8081;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name gojet.cc www.gojet.cc;
    return 301 https://gojet.cc$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gojet.cc;

    root /var/www/gojet/current/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 1024m;

    ssl_certificate /etc/letsencrypt/live/gojet.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gojet.cc/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }
    location ~* /(?:\.env|composer\.(?:json|lock)|package(?:-lock)?\.json|artisan)$ { deny all; }
    location ~ /\. { deny all; }

    # Only root-level short codes enter the Go redirect plane. Marketing and
    # application routes fall back to Laravel on an unknown code or an
    # unavailable durable analytics spool.
    location ~ ^/[A-Za-z0-9_-]{3,64}$ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_intercept_errors on;
        error_page 404 = @laravel;
        error_page 503 = @laravel;
        proxy_pass http://gojet_redirector;
    }

    location / {
        try_files $uri $uri/ @laravel;
    }

    location @laravel {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_X_REQUEST_ID $request_id;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_X_REQUEST_ID $request_id;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 60s;
    }
}
