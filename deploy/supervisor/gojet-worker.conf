[program:gojet-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/gojet/current/artisan queue:work redis --queue=default --sleep=1 --tries=3 --timeout=60 --max-time=3600
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/gojet/current/storage/logs/worker.log
stopwaitsecs=70
