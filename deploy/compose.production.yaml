name: gojet

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/gojet.conf:/etc/nginx/conf.d/default.conf:ro
      - ../public:/usr/share/nginx/html/site:ro
      - ./data/brand:/usr/share/nginx/html/assets/images:ro
      - ./data/generated/qr:/usr/share/nginx/html/generated/qr:ro
      - ./data/uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      redirectengine:
        condition: service_healthy
      platformapi:
        condition: service_healthy

  logreceiver:
    build:
      context: ..
      dockerfile: deploy/docker/service.Dockerfile
      args:
        BINARY: logreceiver
    restart: unless-stopped
    environment:
      MYSQL_DSN: gojet:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@tcp(mysql:3306)/gojet?parseTime=true&charset=utf8mb4
      LOG_INGEST_TOKEN: ${LOG_INGEST_TOKEN:?LOG_INGEST_TOKEN is required}
    depends_on:
      mysql:
        condition: service_healthy

  redirectengine:
    build:
      context: ..
      dockerfile: deploy/docker/service.Dockerfile
      args:
        BINARY: redirectengine
    restart: unless-stopped
    environment:
      HTTP_ADDRESS: :8080
      REDIS_ADDRESS: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      VISITOR_HASH_KEY: ${VISITOR_HASH_KEY:?VISITOR_HASH_KEY is required}
      QR_TRACKING_KEY: ${QR_TRACKING_KEY:?QR_TRACKING_KEY is required}
      GEOIP_MMDB: /data/geoip/GeoLite2-City.mmdb
      GEOIP_COUNTRY_CSV: /data/geoip/country.csv
      LOG_WEBHOOK_URL: ${LOG_WEBHOOK_URL:-http://logreceiver:8092/v1/logs}
      LOG_WEBHOOK_TOKEN: ${LOG_WEBHOOK_TOKEN:?LOG_WEBHOOK_TOKEN is required}
      VISIT_RATE_LIMIT_PER_MINUTE: ${VISIT_RATE_LIMIT_PER_MINUTE:-60}
    volumes:
      - ./data/geoip:/data/geoip:ro
    healthcheck:
      test: ["CMD", "/service", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      redis:
        condition: service_healthy

  analyticsworker:
    build:
      context: ..
      dockerfile: deploy/docker/service.Dockerfile
      args:
        BINARY: analyticsworker
    restart: unless-stopped
    environment:
      REDIS_ADDRESS: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      MYSQL_DSN: gojet:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@tcp(mysql:3306)/gojet?parseTime=true&charset=utf8mb4
      LOG_WEBHOOK_URL: ${LOG_WEBHOOK_URL:-http://logreceiver:8092/v1/logs}
      LOG_WEBHOOK_TOKEN: ${LOG_WEBHOOK_TOKEN:?LOG_WEBHOOK_TOKEN is required}
      ANALYTICS_GROUP: gojet-mysql
      ANALYTICS_CONSUMER: ${HOSTNAME:-worker-1}
      ANALYTICS_BATCH_SIZE: ${ANALYTICS_BATCH_SIZE:-100}
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy

  analyticsreconciler:
    build:
      context: ..
      dockerfile: deploy/docker/service.Dockerfile
      args:
        BINARY: analyticsreconciler
    restart: unless-stopped
    environment:
      REDIS_ADDRESS: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      MYSQL_DSN: gojet:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@tcp(mysql:3306)/gojet?parseTime=true&charset=utf8mb4
      ANALYTICS_RECONCILE_BATCH: ${ANALYTICS_RECONCILE_BATCH:-500}
      ANALYTICS_RECONCILE_INTERVAL_SECONDS: ${ANALYTICS_RECONCILE_INTERVAL_SECONDS:-60}
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy

  platformapi:
    image: gojet-platform-runtime:local
    build:
      context: ..
      dockerfile: deploy/docker/platform.Dockerfile
    restart: unless-stopped
    environment:
      PLATFORM_HTTP_ADDRESS: :8090
      MYSQL_DSN: gojet:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@tcp(mysql:3306)/gojet?parseTime=true&charset=utf8mb4
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?SETTINGS_ENCRYPTION_KEY is required}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:?ADMIN_BOOTSTRAP_EMAIL is required}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:?ADMIN_BOOTSTRAP_PASSWORD is required}
      REDIS_ADDRESS: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      ANALYTICS_GROUP: gojet-mysql
      UPLOAD_STORAGE_PATH: /data/uploads
      BRAND_ASSET_PATH: /data/brand
      GENERATED_QR_STORAGE_PATH: /data/generated/qr
      FILE_STORAGE_PATH: /data/files
      FILE_STORAGE_DRIVER: ${FILE_STORAGE_DRIVER:-filesystem}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SECURE: ${S3_SECURE:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      QR_TRACKING_KEY: ${QR_TRACKING_KEY:?QR_TRACKING_KEY is required}
      LOG_WEBHOOK_URL: ${LOG_WEBHOOK_URL:-http://logreceiver:8092/v1/logs}
      LOG_WEBHOOK_TOKEN: ${LOG_WEBHOOK_TOKEN:?LOG_WEBHOOK_TOKEN is required}
    volumes:
      - ./data/brand:/data/brand
      - ./data/generated/qr:/data/generated/qr
      - ./data/uploads:/data/uploads
      - ./data/files:/data/files
    healthcheck:
      test: ["CMD", "/platformapi", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mailworker:
    image: gojet-platform-runtime:local
    entrypoint: ["/mailworker"]
    restart: unless-stopped
    environment:
      MYSQL_DSN: gojet:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@tcp(mysql:3306)/gojet?parseTime=true&charset=utf8mb4
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?SETTINGS_ENCRYPTION_KEY is required}
      LOG_WEBHOOK_URL: ${LOG_WEBHOOK_URL:-http://logreceiver:8092/v1/logs}
      LOG_WEBHOOK_TOKEN: ${LOG_WEBHOOK_TOKEN:?LOG_WEBHOOK_TOKEN is required}
    depends_on:
      mysql:
        condition: service_healthy
      platformapi:
        condition: service_started

  fileworker:
    image: gojet-platform-runtime:local
    entrypoint: ["/fileworker"]
    restart: unless-stopped
    environment:
      MYSQL_DSN: gojet:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@tcp(mysql:3306)/gojet?parseTime=true&charset=utf8mb4
      FILE_STORAGE_PATH: /data/files
      CLAMAV_ADDRESS: clamav:3310
      LOG_WEBHOOK_URL: ${LOG_WEBHOOK_URL:-http://logreceiver:8092/v1/logs}
      LOG_WEBHOOK_TOKEN: ${LOG_WEBHOOK_TOKEN:?LOG_WEBHOOK_TOKEN is required}
      FILE_STORAGE_DRIVER: ${FILE_STORAGE_DRIVER:-filesystem}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SECURE: ${S3_SECURE:-true}
    volumes:
      - ./data/files:/data/files
    depends_on:
      mysql:
        condition: service_healthy
      clamav:
        condition: service_started
      platformapi:
        condition: service_started

  operationsmonitor:
    image: gojet-platform-runtime:local
    entrypoint: ["/operationsmonitor"]
    restart: unless-stopped
    environment:
      MYSQL_DSN: gojet:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@tcp(mysql:3306)/gojet?parseTime=true&charset=utf8mb4
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?SETTINGS_ENCRYPTION_KEY is required}
      ALERT_RECIPIENT: ${ALERT_RECIPIENT:-}
      OPERATIONS_MONITOR_INTERVAL_SECONDS: ${OPERATIONS_MONITOR_INTERVAL_SECONDS:-60}
      LOG_WEBHOOK_URL: ${LOG_WEBHOOK_URL:-http://logreceiver:8092/v1/logs}
      LOG_WEBHOOK_TOKEN: ${LOG_WEBHOOK_TOKEN:?LOG_WEBHOOK_TOKEN is required}
    depends_on:
      mysql:
        condition: service_healthy
      platformapi:
        condition: service_started

  clamav:
    image: clamav/clamav:1.4.5
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gojet
      MYSQL_USER: gojet
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  redis-data:
  mysql-data:
  clamav-data:
