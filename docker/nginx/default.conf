upstream gojet_php {
    server app:9000;
}

upstream gojet_redirector {
    server redirector:8081;
}

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 1024m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }
    location ~* /(?:\.env|composer\.(?:json|lock)|package(?:-lock)?\.json|artisan)$ { deny all; }
    location ~ /\. { deny all; }

    # Root-level short codes are resolved by the Go redirect plane. Marketing and
    # application routes fall back to Laravel when the redirect plane returns 404.
    location ~ ^/[A-Za-z0-9_-]{3,64}$ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_intercept_errors on;
        error_page 404 = @laravel;
        error_page 503 = @laravel;
        proxy_pass http://gojet_redirector;
    }

    location / {
        try_files $uri $uri/ @laravel;
    }

    location @laravel {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_X_REQUEST_ID $request_id;
        fastcgi_pass gojet_php;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_X_REQUEST_ID $request_id;
        fastcgi_pass gojet_php;
        fastcgi_read_timeout 60s;
    }
}
