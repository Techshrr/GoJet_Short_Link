<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoJet 平台管理</title><link rel="stylesheet" href="/admin/styles.css"></head><body><div id="gate"><form id="gateForm"><b>GoJet Admin</b><h1>平台管理后台</h1><label>管理员访问令牌<input name="token" type="password" required></label><button>进入后台</button><p id="gateError"></p></form></div><div id="admin" class="layout hidden"><aside><b>GoJet <i>ADMIN</i></b><nav><button data-view="overview" class="active">平台概览</button><button data-view="users">用户与封禁</button><button data-view="workspaces">工作区</button><button data-view="links">内容与链接</button><button data-view="mail">邮件与失败</button><button data-view="audit">审计日志</button><button data-view="settings">系统设置</button></nav><small>独立管理后台</small></aside><main><header><div><small>平台控制中心</small><strong id="viewTitle">平台概览</strong></div><input id="search" placeholder="全局筛选"><button id="reload">刷新</button></header><section id="content"></section></main></div><div id="dialog" class="overlay hidden"><form id="statusForm"><h2>变更用户状态</h2><input name="id" type="hidden"><label>新状态<select name="status"><option value="suspended">封禁</option><option value="active">恢复</option></select></label><label>操作原因<textarea name="reason" required></textarea></label><div><button type="button" id="cancel">取消</button><button class="danger">确认并记录审计</button></div></form></div><script src="/admin/app.js"></script></body></html>
