<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GoJet 管理后台</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="/admin/styles.css">
</head>
<body>
<div id="loginView" class="login-view">
  <form id="loginForm" class="login-card">
    <a href="/" class="login-brand">GoJet<span>.</span><small>ADMIN</small></a>
    <h1>管理后台</h1>
    <p>使用管理员账户登录。若账户启用了双因素认证，验证码只在登录时输入一次。</p>
    <div id="loginError" class="alert hidden"></div>
    <label><span>管理员邮箱</span><input name="email" type="email" autocomplete="username" required></label>
    <label><span>密码</span><input name="password" type="password" autocomplete="current-password" required></label>
    <label id="loginTotp" class="hidden"><span>验证器验证码</span><input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code"></label>
    <button class="btn primary wide">登录后台</button>
  </form>
</div>

<div id="adminView" class="admin-shell hidden">
  <aside class="sidebar">
    <a href="/" class="brand">GoJet<span>.</span><small>ADMIN</small></a>
    <div class="side-label">平台</div>
    <nav id="nav">
      <button data-view="overview" data-permission="platform.read" class="active">平台概览</button>
      <button data-view="users" data-permission="users.manage">用户管理</button>
      <button data-view="administrators" data-permission="admins.manage">管理员与权限</button>
      <button data-view="links" data-permission="links.manage">链接管理</button>
      <button data-view="workspaces" data-permission="workspaces.manage">工作区</button>
      <button data-view="announcements" data-permission="content.manage">公告运营</button>
      <button data-view="mail" data-permission="mail.manage">邮件中心</button>
      <button data-view="billing" data-permission="billing.manage">套餐与账单</button>
      <button data-view="files" data-permission="files.manage">文件安全</button>
      <button data-view="abuse" data-permission="security.manage">滥用举报</button>
      <button data-view="domains" data-permission="domains.manage">域名管理</button>
      <button data-view="security" data-permission="security.manage">安全事件</button>
      <button data-view="diagnostics" data-permission="operations.manage">系统运维</button>
      <button data-view="settings" data-permission="settings.manage">系统设置</button>
      <button data-view="audit" data-permission="platform.read">审计日志</button>
    </nav>
    <div class="sidebar-account">
      <strong id="adminName">—</strong>
      <span id="adminEmail">—</span>
      <span id="adminRole" class="role-pill">—</span>
    </div>
  </aside>
  <main class="workspace">
    <header class="topbar">
      <div><small>GOJET CONTROL CENTER</small><h1 id="pageTitle">平台概览</h1></div>
      <div class="top-actions">
        <button id="enableMfa" class="btn ghost">登录双因素认证</button>
        <button id="changePassword" class="btn ghost">修改密码</button>
        <button id="reload" class="btn ghost">刷新</button>
        <button id="logout" class="btn">退出</button>
      </div>
    </header>
    <section id="content" class="content"></section>
  </main>
</div>

<div id="modal" class="modal-layer hidden" aria-hidden="true"><div class="modal" id="modalBody"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="/admin/app.js"></script>
<script src="/admin/product-actions.js"></script>
</body>
</html>
