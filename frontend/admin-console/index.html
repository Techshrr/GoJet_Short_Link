<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoJet 平台管理</title><link rel="stylesheet" href="/admin/styles.css"></head><body><div id="gate"><form id="gateForm"><b>GoJet Admin</b><h1>平台管理后台</h1><label>管理员邮箱<input name="email" type="email" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><label id="totpField" class="hidden">二次验证码<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code"></label><button>安全登录</button><p id="gateError"></p></form></div><div id="admin" class="layout hidden"><aside><b>GoJet <i>ADMIN</i></b><nav><button data-view="overview" class="active">平台概览</button><button data-view="administrators">管理员与权限</button><button data-view="users">用户与封禁</button><button data-view="workspaces">工作区</button><button data-view="links">内容与链接</button><button data-view="mail">邮件与失败</button><button data-view="files">文件扫描</button><button data-view="abuse">举报与隔离</button><button data-view="domains">域名风险</button><button data-view="security">安全事件</button><button data-view="announcements">公告运营</button><button data-view="audit">审计日志</button><button data-view="settings">系统设置</button></nav><small>独立管理后台</small></aside><main><header><div><small>平台控制中心</small><strong id="viewTitle">平台概览</strong></div><input id="search" placeholder="全局筛选"><button id="changePassword">修改密码</button><button id="enable2FA">启用二次验证</button><button id="logout">退出</button><button id="reload">刷新</button></header><section id="content"></section></main></div><div id="passwordDialog" class="overlay hidden"><form id="passwordForm"><h2>修改管理员密码</h2><p>修改成功后，除当前浏览器外的管理员会话将全部强制退出。</p><label>当前密码<input name="current_password" type="password" required></label><label>新密码<input name="new_password" type="password" minlength="12" required></label><div><button type="button" id="cancelPassword">取消</button><button>修改密码</button></div><p id="passwordError"></p></form></div><div id="totpDialog" class="overlay hidden"><form id="totpForm"><h2>启用管理员二次验证</h2><p>在验证器应用中录入以下密钥，然后输入当前 6 位验证码。密钥仅显示本次。</p><code id="totpSecret"></code><input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6 位验证码" required><div><button type="button" id="cancelTOTP">取消</button><button>确认启用</button></div><p id="totpError"></p></form></div><div id="adminDialog" class="overlay hidden"><form id="administratorForm"><h2 id="administratorDialogTitle">创建管理员</h2><input name="id" type="hidden"><label>管理员名称<input name="display_name" required></label><label>管理员邮箱<input name="email" type="email" required></label><label>初始密码<input name="password" type="password" minlength="12" placeholder="创建时至少 12 位"></label><label>角色<select name="role"><option value="super_admin">超级管理员</option><option value="operator">运营管理员</option><option value="security">安全管理员</option><option value="support">支持专员</option><option value="analyst">分析员</option></select></label><label>状态<select name="status"><option value="active">正常</option><option value="suspended">停用</option></select></label><div><button type="button" id="cancelAdministrator">取消</button><button>保存并记录审计</button></div><p id="administratorError"></p></form></div><div id="dialog" class="overlay hidden"><form id="statusForm"><h2>变更用户状态</h2><input name="id" type="hidden"><label>新状态<select name="status"><option value="suspended">封禁</option><option value="active">恢复</option></select></label><label>操作原因<textarea name="reason" required></textarea></label><div><button type="button" id="cancel">取消</button><button class="danger">确认并记录审计</button></div></form></div><script src="/admin/app.js"></script></body></html>
