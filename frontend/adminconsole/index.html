<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoJet 管理中心</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/assets/gojetdesignsystem.css"><link rel="stylesheet" href="/admin/styles.css"><link rel="stylesheet" href="/admin/shell.css"><link rel="stylesheet" href="/admin/brand.css"><link rel="stylesheet" href="/admin/polish.css"><link rel="stylesheet" href="/admin/finalpolish.css"><link rel="stylesheet" href="/admin/workflowpages.css"><link rel="stylesheet" href="/admin/announcementbar.css"><link rel="stylesheet" href="/admin/destinationrisk.css"><link rel="stylesheet" href="/admin/socialauthsettings.css"><link rel="stylesheet" href="/assets/consolefoundation.css"></head>
<body><div id="loginView" class="login-view"><form id="loginForm" class="login-card" method="post" action="/api/admin/auth/login"><a href="/" class="login-brand">GoJet<span>.</span></a><h1>管理中心</h1><p>使用管理员账户登录。已启用登录双因素认证的账户还需要输入验证器验证码。</p><div id="loginError" class="alert hidden"></div><label><span>管理员邮箱</span><input name="email" type="email" autocomplete="username" required></label><label><span>密码</span><input name="password" type="password" autocomplete="current-password" required></label><label id="loginTotp" class="hidden"><span>验证器验证码</span><input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code"></label><button class="btn primary wide" type="submit">登录</button></form></div><div id="adminView" class="admin-shell hidden"><aside class="sidebar"><a href="/" class="brand"><strong>GoJet<span>.</span></strong><small>Admin</small></a><nav id="nav"><div class="adminNavGroup"><span class="adminNavLabel">运营</span><button data-view="overview" data-permission="platform.read" class="active">平台概览</button><button data-view="users" data-permission="users.manage">用户管理</button><button data-view="workspaces" data-permission="workspaces.manage">工作区管理</button></div><div class="adminNavGroup"><span class="adminNavLabel">内容</span><button data-view="links" data-permission="links.manage">链接管理</button><button data-view="domains" data-permission="domains.manage">域名管理</button><button data-view="announcements" data-permission="content.manage">公告管理</button></div><div class="adminNavGroup"><span class="adminNavLabel">服务与商业</span><button data-view="tickets" data-permission="tickets.manage">客户工单</button><button data-view="billing" data-permission="billing.manage">套餐与账单</button><button data-view="files" data-permission="files.manage">文件安全</button><button data-view="abuse" data-permission="security.manage">滥用举报</button></div><div class="adminNavGroup"><span class="adminNavLabel">安全与系统</span><button data-view="administrators" data-permission="admins.manage">管理员与权限</button><button data-view="security" data-permission="security.manage">安全事件</button><button data-risk-review data-permission="security.manage">目标风险审核</button><button data-view="diagnostics" data-permission="operations.manage">系统状态</button><button data-view="settings" data-permission="settings.manage">系统设置</button><button data-view="audit" data-permission="platform.read">审计日志</button></div></nav><div class="sidebar-account"><div class="adminAvatar" aria-hidden="true">A</div><div class="adminIdentity"><strong id="adminName">—</strong><span id="adminEmail">—</span></div><span id="adminRole" class="role-pill">—</span></div></aside><main class="workspace"><header class="topbar"><div><h1 id="pageTitle">平台概览</h1></div><div class="top-actions"><button id="enableMfa" class="btn ghost">登录双因素认证</button><button id="changePassword" class="btn ghost">修改密码</button><button id="reload" class="btn ghost">刷新</button><button id="logout" class="btn">退出登录</button></div></header><section id="content" class="content"></section></main></div><div id="modal" class="modal-layer hidden" aria-hidden="true"><div class="modal" id="modalBody"></div></div><div id="toast" class="toast hidden"></div><script src="/assets/brandruntime.js"></script><script src="/admin/app.js"></script><script src="/admin/mailstatus.js"></script><script src="/admin/mailtemplates.js"></script><script src="/admin/productactions.js"></script><script src="/admin/billingadmin.js"></script><script src="/admin/paymentcallbacks.js"></script><script src="/admin/settings.js"></script><script src="/admin/socialauthsettings.js"></script><script src="/admin/announcementbarsettings.js"></script><script src="/admin/paymentux.js"></script><script src="/admin/billingfxsettings.js"></script><script src="/admin/officialdomains.js"></script><script src="/admin/supportsecurity.js"></script><script src="/admin/destinationrisk.js"></script><script src="/admin/riskworkflowux.js"></script><script src="/admin/finalpolish.js"></script>
