<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoJet 控制台</title><link rel="stylesheet" href="/app/styles.css"></head><body>
<div id="auth" class="auth"><form id="loginForm"><a class="brand" href="/">GoJet<span>.</span></a><h1>登录控制台</h1><p>管理链接、工作区和真实访问数据</p><label>邮箱<input name="email" type="email" required></label><label>密码<input name="password" type="password" required></label><button>登录</button><div id="authError" class="error"></div></form></div>
<div id="shell" class="shell hidden"><aside><a class="brand" href="/">GoJet<span>.</span></a><nav><button data-console-view="links" class="active">链接管理</button><button data-console-view="team">工作区与团队</button><button data-console-view="organization">活动与组织</button><button data-console-view="domains">自定义域名</button><button data-console-view="texts">文本分享</button><button data-console-view="bios">个人主页</button><button data-console-view="files">文件分享</button><button data-console-view="qrs">二维码</button></nav><div class="profile"><b id="userName"></b><small id="userEmail"></small></div></aside>
<main><header><select id="workspace"></select><div class="search">⌕ <input id="globalSearch" placeholder="搜索短码、标题或目标地址"></div><button class="primary" id="createButton">创建链接</button></header>
<section class="content"><div class="title"><div><small>链接管理</small><h1>所有短链接</h1><p>搜索、筛选、批量操作并查看实时访问表现。</p></div><button id="refresh">刷新数据</button></div>
<div class="metrics"><article><span>实时累计点击</span><strong id="totalClicks">—</strong></article><article><span>独立访客</span><strong id="totalVisitors">—</strong></article><article><span>活跃链接</span><strong id="activeLinks">—</strong></article><article><span>当前套餐用量</span><strong id="usage">—</strong></article></div>
<div class="toolbar"><select id="status"><option value="">全部状态</option><option value="active">启用</option><option value="paused">暂停</option><option value="expired">已过期</option></select><select id="folderFilter"><option value="">全部文件夹</option></select><select id="campaignFilter"><option value="">全部活动</option></select><select id="tagFilter"><option value="">全部标签</option></select><button id="enable">批量启用</button><button id="pause">批量暂停</button><button id="moveSelected">批量移动</button><button id="tagSelected">批量标签</button><button id="exportLinks">导出 CSV</button><button id="deleteSelected" class="danger">批量删除</button><span id="resultCount"></span></div>
<div class="tableWrap"><table><thead><tr><th><input id="checkAll" type="checkbox"></th><th>短网址</th><th>目标地址</th><th>点击</th><th>访客</th><th>创建时间</th><th>状态</th><th>操作</th></tr></thead><tbody id="links"></tbody></table><div id="empty" class="empty hidden"><b>还没有符合条件的链接</b><span>创建第一个短链接，真实访问数据会显示在这里。</span></div></div>
<div class="pagination"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div></section></main></div>
<div id="drawer" class="overlay hidden"><form id="createForm" class="drawer"><div class="drawerHead"><div><small>分步骤创建</small><h2>创建短链接</h2></div><button type="button" data-close>×</button></div><div class="steps"><b>1 基础信息</b><span>2 跳转策略</span><span>3 分析参数</span></div><label>目标地址<input name="destination" type="url" placeholder="https://example.com/campaign" required></label><div class="grid"><label>自定义短码<input name="code" placeholder="留空自动生成"></label><label>自定义域名<select name="domain" id="createDomain"><option value="">默认域名</option></select></label></div><div class="grid"><label>跳转状态码<select name="redirect_status"><option>302</option><option>301</option><option>307</option><option>308</option></select></label><span></span></div><label>链接标题<input name="title" placeholder="例如：夏季营销活动"></label><div class="grid"><label>文件夹<select name="folder_id" id="createFolder"><option value="">无文件夹</option></select></label><label>活动<select name="campaign_id" id="createCampaign"><option value="">无活动</option></select></label></div><label>标签<select name="tag_ids" id="createTags" multiple size="3"></select></label><div class="grid"><label>访问密码<input name="password" type="password" minlength="6" placeholder="留空不启用"></label><label>到期日期<input name="expires_at" type="datetime-local"></label></div><div class="grid"><label>最大点击量<input name="max_clicks" type="number" min="1"></label><label class="check"><input name="one_time" type="checkbox">一次性访问</label></div><fieldset><legend>UTM 参数</legend><div class="grid"><input name="utm_source" placeholder="utm_source"><input name="utm_medium" placeholder="utm_medium"><input name="utm_campaign" placeholder="utm_campaign"><input name="utm_content" placeholder="utm_content"></div></fieldset><div id="createError" class="error"></div><footer><button type="button" data-close>取消</button><button class="primary">创建并启用</button></footer></form></div>
<div id="analyticsModal" class="overlay hidden"><div class="drawer analytics"><div class="drawerHead"><div><small>真实访问事件</small><h2 id="analyticsTitle">链接分析</h2></div><button type="button" data-close-analytics>×</button></div><div id="analyticsBody" class="analyticsBody"></div></div></div>
<script src="/app/app.js"></script></body></html>
