<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GoJet 控制台</title>
  <link rel="stylesheet" href="/assets/gojetdesignsystem.css">
  <link rel="stylesheet" href="/app/styles.css">
  <link rel="stylesheet" href="/app/product.css">
  <link rel="stylesheet" href="/app/components.css">
  <link rel="stylesheet" href="/app/shell.css">
  <link rel="stylesheet" href="/app/polish.css">
  <link rel="stylesheet" href="/app/finalpolish.css">
  <script src="/app/authguard.js"></script>
</head>
<body>
  <div id="shell" class="shell hidden">
    <aside>
      <a class="brand" href="/" aria-label="GoJet 首页">GoJet<span>.</span></a>
      <nav aria-label="客户控制台导航">
        <button type="button" data-console-view="overview" class="active">总览</button>
        <button type="button" data-console-view="links">链接管理</button>
        <button type="button" data-console-view="team">工作区与团队</button>
        <button type="button" data-console-view="organization">活动与组织</button>
        <button type="button" data-console-view="domains">自定义域名</button>
        <button type="button" data-console-view="texts">文本分享</button>
        <button type="button" data-console-view="bios">个人主页</button>
        <button type="button" data-console-view="files">文件分享</button>
        <button type="button" data-console-view="qrs">二维码</button>
        <button type="button" data-console-view="billing">套餐与账单</button>
        <button type="button" data-console-view="analytics">访问分析</button>
        <button type="button" data-console-view="settings">账户设置</button>
      </nav>
      <div class="profile">
        <b id="userName">我的账户</b>
        <small id="userEmail"></small>
        <button type="button" id="logoutButton">退出登录</button>
      </div>
    </aside>
    <main>
      <header>
        <select id="workspace" aria-label="当前工作区"></select>
        <div class="search">⌕ <input id="globalSearch" type="search" placeholder="搜索短码、标题或目标地址" aria-label="搜索链接"></div>
        <button class="primary" id="createButton" type="button">创建链接</button>
      </header>
      <section class="content" aria-live="polite"><div class="productLoading">正在加载控制台…</div></section>
    </main>
  </div>
  <script src="/assets/brandruntime.js"></script>
  <script src="/app/app.js"></script>
  <script src="/app/pages.js"></script>
  <script src="/app/router.js"></script>
  <script src="/app/pendinglink.js"></script>
  <script src="/app/finalpolish.js"></script>
</body>
</html>
