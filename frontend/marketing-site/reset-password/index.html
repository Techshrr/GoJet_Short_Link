<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>重置密码 · GoJet</title><meta name="robots" content="noindex"><link rel="stylesheet" href="/assets/auth.css"></head><body data-auth-page="reset"><nav class="auth-nav"><a class="auth-brand" href="/">GoJet<span>.</span></a><a href="/login">返回登录</a></nav><main class="auth-page"><div class="auth-wrap"><div class="auth-kicker">RESET PASSWORD</div><section class="auth-card"><h1>设置新密码</h1><p class="lead">完成后所有旧登录会话都会失效，请使用新密码重新登录。</p><div id="message" class="message"></div><form id="resetForm"><label class="field"><span>新密码</span><input name="password" type="password" autocomplete="new-password" required minlength="10"></label><label class="field"><span>确认新密码</span><input name="password_confirmation" type="password" autocomplete="new-password" required minlength="10"></label><button class="primary" type="submit">更新密码</button></form></section></div></main><script src="/assets/auth.js"></script></body></html>
