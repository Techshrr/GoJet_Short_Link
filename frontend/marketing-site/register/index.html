<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>注册 · GoJet</title><meta name="robots" content="noindex"><link rel="stylesheet" href="/assets/auth.css"></head><body data-auth-page="register"><nav class="auth-nav"><a class="auth-brand" href="/">GoJet<span>.</span></a><a href="/login">已有账户？登录</a></nav><main class="auth-page"><div class="auth-wrap"><div class="auth-kicker">CREATE YOUR ACCOUNT</div><section class="auth-card"><h1>创建 GoJet 账户</h1><p class="lead">一个账户管理短链接、文本分享、文件和分析数据。</p><div id="message" class="message"></div><form id="registerForm"><label class="field"><span>显示名称</span><input name="display_name" autocomplete="name" required maxlength="120" placeholder="例如：Ethan"></label><label class="field"><span>邮箱</span><input name="email" type="email" autocomplete="email" required></label><label class="field"><span>密码</span><input name="password" type="password" autocomplete="new-password" required minlength="10"><div class="hint">至少 10 位字符。</div></label><label class="field"><span>确认密码</span><input name="password_confirmation" type="password" autocomplete="new-password" required minlength="10"></label><label class="row" style="justify-content:flex-start"><input type="checkbox" required> <span>我已阅读并同意服务条款和隐私政策</span></label><button class="primary" type="submit">创建账户</button></form><div class="auth-foot">已有账户？ <a href="/login">直接登录</a></div></section></div></main><script src="/assets/auth.js"></script></body></html>
