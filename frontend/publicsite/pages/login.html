<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · GoJet</title><meta name="robots" content="noindex"><link rel="stylesheet" href="/assets/gojetdesignsystem.css"><link rel="stylesheet" href="/assets/auth.css"></head><body data-auth-page="login"><nav class="auth-nav"><a class="auth-brand" href="/">GoJet<span>.</span></a><a href="/register">没有账户？免费注册</a></nav><main class="auth-page"><div class="auth-wrap"><div class="auth-kicker">账户登录</div><section class="auth-card"><h1>欢迎回来</h1><p class="lead">登录后即可管理短链接、文本、文件、个人主页和访问数据。</p><div id="message" class="message"></div><div id="socialAuth" class="social-auth hidden"><div id="socialProviders" class="social-providers"></div><div class="auth-divider"><span>或使用邮箱登录</span></div></div><form id="loginForm"><label class="field"><span>邮箱</span><input name="email" type="email" autocomplete="username" required></label><label class="field"><span>密码</span><input name="password" type="password" autocomplete="current-password" required minlength="10"></label><div class="row"><span></span><a href="/forgotpassword">忘记密码？</a></div><button class="primary" type="submit">登录</button></form><div class="auth-foot">还没有 GoJet 账户？ <a href="/register">创建账户</a></div></section></div></main><script src="/assets/auth.js"></script></body></html>
