<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · GoJet</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/gojetdesignsystem.css">
<link rel="stylesheet" href="/assets/auth.css">
</head>
<body data-auth-page="login">
<header class="auth-header"><a class="auth-brand" href="/" aria-label="GoJet 首页">GoJet<span>.</span></a></header>
<main class="auth-page">
  <section class="auth-panel" aria-labelledby="authTitle">
    <div class="auth-heading"><h1 id="authTitle">欢迎回来</h1><p>登录 GoJet，继续管理你的链接与内容。</p></div>
    <div id="message" class="message" role="status" aria-live="polite"></div>
    <div id="socialAuth" class="social-auth hidden"><div id="socialProviders" class="social-providers"></div><div class="auth-divider"><span>或使用邮箱</span></div></div>
    <form id="loginForm">
      <label class="field"><span>邮箱</span><input name="email" type="email" autocomplete="username" inputmode="email" required autofocus placeholder="name@example.com"></label>
      <label class="field"><span>密码</span><input name="password" type="password" autocomplete="current-password" required minlength="10" placeholder="输入登录密码"></label>
      <div class="auth-row"><a href="/forgotpassword">忘记密码？</a></div>
      <button class="primary auth-submit" type="submit">登录</button>
    </form>
    <footer class="auth-foot">还没有账户？<a href="/register">免费注册</a></footer>
  </section>
</main>
<script src="/assets/auth.js"></script>
</body>
</html>
