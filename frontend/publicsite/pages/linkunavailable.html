<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>链接暂不可访问 · GoJet</title>
  <link rel="stylesheet" href="/assets/gojetdesignsystem.css">
  <link rel="stylesheet" href="/assets/linkunavailable.css">
</head>
<body>
  <main class="safetyPage">
    <a class="safetyBrand" href="/" aria-label="返回 GoJet 首页">GoJet<span>.</span></a>
    <section class="safetyCard" aria-labelledby="safetyTitle">
      <div class="safetyIcon" aria-hidden="true"><span>!</span></div>
      <div class="safetyEyebrow">GOJET LINK SAFETY</div>
      <h1 id="safetyTitle">此链接已暂停访问</h1>
      <p id="safetyDescription">GoJet 正在核验该链接的目标安全状态。核验完成前，我们不会继续跳转。</p>
      <div class="safetyReason">
        <span>当前状态</span>
        <strong id="safetyState">安全审核中</strong>
      </div>
      <div class="safetyReference hidden" id="safetyReference"><span>链接参考</span><code id="safetyCode"></code></div>
      <p class="safetyNote" id="safetyNote">如果你是链接创建者，并认为当前处理有误，可以提交工单申请人工复核。</p>
      <div class="safetyActions">
        <a class="primary" id="safetyAppeal" href="/app/support">提交申诉工单</a>
        <a class="secondary" href="/">返回 GoJet</a>
      </div>
    </section>
    <footer>GoJet · Link Safety</footer>
  </main>
  <script src="/assets/linkunavailable.js"></script>
</body>
</html>
