<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>找回密码 · GoJet</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/gojetdesignsystem.css">
<link rel="stylesheet" href="/assets/auth.css">
</head>
<body data-auth-page="forgot">
<header class="auth-header"><a class="auth-brand" href="/" aria-label="GoJet 首页">GoJet<span>.</span></a></header>
<main class="auth-page">
  <section class="auth-panel auth-panel-compact" aria-labelledby="authTitle">
    <div class="auth-heading"><h1 id="authTitle">重置登录密码</h1><p>输入注册邮箱，我们会发送 30 分钟内有效的密码重置链接。</p></div>
    <div id="message" class="message" role="status" aria-live="polite"></div>
    <form id="forgotForm">
      <label class="field"><span>邮箱</span><input name="email" type="email" autocomplete="email" inputmode="email" required autofocus placeholder="name@example.com"></label>
      <button class="primary auth-submit" type="submit">发送重置链接</button>
    </form>
    <footer class="auth-foot"><a href="/login">返回登录</a></footer>
  </section>
</main>
<script src="/assets/auth.js"></script>
</body>
</html>
