<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>重置密码 · GoJet</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/gojetdesignsystem.css">
<link rel="stylesheet" href="/assets/auth.css">
<link rel="stylesheet" href="/assets/authreal.css">
</head>
<body data-auth-page="reset">
<header class="auth-header"><div class="auth-header-left"><a class="auth-brand" href="/" aria-label="GoJet 首页">GoJet<span>.</span></a><a class="auth-return" href="/" aria-label="返回网站">返回网站 <span aria-hidden="true">↗</span></a></div></header>
<main class="auth-page">
  <section class="auth-shell">
    <aside class="auth-showcase" aria-hidden="true">
      <div class="auth-art auth-art-forgot">
        <svg viewBox="0 0 560 460" role="img">
          <path d="M120 310C141 213 229 153 337 169 414 180 459 229 455 292" fill="none" stroke="#c9ef67" stroke-width="22" stroke-linecap="round"/>
          <path d="M122 310c37 61 109 92 185 77 59-12 105-47 134-96" fill="none" stroke="#6373e8" stroke-width="5" stroke-linecap="round"/>
          <path d="M425 283l27 9-13 26" fill="none" stroke="#172144" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <g transform="rotate(12 288 239)">
            <rect x="184" y="157" width="207" height="151" rx="28" fill="#fff" stroke="#172144" stroke-width="5"/>
            <path d="M190 180l98 75 97-75" fill="none" stroke="#172144" stroke-width="5" stroke-linejoin="round"/>
            <circle cx="288" cy="248" r="27" fill="#eef3ff" stroke="#172144" stroke-width="4"/><path d="M288 234v30m-10-20c0-7 5-13 10-13s10 6 10 13" fill="none" stroke="#6373e8" stroke-width="4" stroke-linecap="round"/>
          </g>
          <circle cx="444" cy="153" r="21" fill="#ff6f4e"/><path d="M435 153h18m-9-9v18" stroke="#172144" stroke-width="3"/>
        </svg>
      </div>
      <p class="auth-showcase-caption">完成最后一步，重新安全地进入账户。</p>
    </aside>
    <section class="auth-form-panel">
      <section class="auth-panel auth-panel-compact" aria-labelledby="authTitle">
        <div class="auth-heading"><h1 id="authTitle">重置密码</h1><p>设置新的登录密码。保存后，其他设备上的现有登录状态会失效。</p></div>
        <div id="message" class="message" role="status" aria-live="polite"></div>
        <form id="resetForm">
          <label class="field"><span>新密码</span><input name="password" type="password" autocomplete="new-password" required minlength="10" placeholder="至少 10 位字符"></label>
          <label class="field"><span>确认新密码</span><input name="password_confirmation" type="password" autocomplete="new-password" required minlength="10" placeholder="再次输入新密码"></label>
          <button class="primary auth-submit" type="submit">保存新密码</button>
        </form>
        <footer class="auth-foot"><a class="auth-back-login" href="/login"><span aria-hidden="true">←</span> 返回登录</a></footer>
      </section>
    </section>
  </section>
</main>
<script src="/assets/auth.js"></script>
</body>
</html>
