<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>重置密码 · GoJet</title><meta name="robots" content="noindex"><link rel="stylesheet" href="/assets/gojetdesignsystem.css"><link rel="stylesheet" href="/assets/auth.css"></head><body data-auth-page="reset"><header class="auth-header"><a class="auth-brand" href="/" aria-label="GoJet 首页">GoJet<span>.</span></a></header><main class="auth-page"><section class="auth-panel auth-panel-compact" aria-labelledby="authTitle"><div class="auth-heading"><h1 id="authTitle">设置新密码</h1><p>保存后，其他设备上的登录状态会失效。</p></div><div id="message" class="message" role="status" aria-live="polite"></div><form id="resetForm"><label class="field"><span>新密码</span><input name="password" type="password" autocomplete="new-password" required minlength="10" placeholder="至少 10 位字符"></label><label class="field"><span>确认新密码</span><input name="password_confirmation" type="password" autocomplete="new-password" required minlength="10"></label><button class="primary auth-submit" type="submit">保存新密码</button></form><footer class="auth-foot"><a href="/login">返回登录</a></footer></section></main><script src="/assets/auth.js"></script></body></html>
