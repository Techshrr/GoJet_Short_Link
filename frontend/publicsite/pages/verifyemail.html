<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>验证邮箱 · GoJet</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/gojetdesignsystem.css">
<link rel="stylesheet" href="/assets/auth.css">
</head>
<body data-auth-page="verify">
<header class="auth-header"><a class="auth-brand" href="/" aria-label="GoJet 首页">GoJet<span>.</span></a></header>
<main class="auth-page">
  <section class="auth-panel auth-panel-compact" aria-labelledby="authTitle">
    <div class="auth-heading auth-status"><div class="auth-status-mark" aria-hidden="true">✓</div><h1 id="authTitle">验证邮箱</h1><p>确认邮箱后，即可使用这个地址登录 GoJet。</p></div>
    <div id="message" class="message" role="status" aria-live="polite"></div>
    <button id="verifyAction" class="primary auth-submit" type="button">确认邮箱</button>
    <div class="button-row"><a id="loginLink" class="secondary hidden" href="/login">前往登录</a></div>
    <footer class="auth-foot"><a href="/login">返回登录</a></footer>
  </section>
</main>
<script src="/assets/auth.js"></script>
</body>
</html>
